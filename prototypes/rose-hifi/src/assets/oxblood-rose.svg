<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
  <!-- Rose HiFi · Oxblood field for reading surfaces (Rose, Rose's apps, detail). Original
       procedural artwork: quiet dark oxblood upper area for text, oblique lit glass planes
       confined to the lower right. No raster, no grain, no blue. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#1c070b"/><stop offset=".55" stop-color="#25090f"/><stop offset="1" stop-color="#2e0b13"/>
    </linearGradient>
    <linearGradient id="plane" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4a111d" stop-opacity="0"/><stop offset=".5" stop-color="#6a1928" stop-opacity=".7"/><stop offset="1" stop-color="#a8344a" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="plane2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f2a3e" stop-opacity=".45"/><stop offset="1" stop-color="#2a0a12" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8d95" stop-opacity="0"/><stop offset=".55" stop-color="#ffd9d6"/><stop offset="1" stop-color="#fff4ee"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="390" height="844" fill="url(#base)"/>
  <polygon points="390,250 390,844 40,844" fill="url(#plane2)" opacity=".7"/>
  <polygon points="60,640 390,340 390,600 150,844 60,844" fill="url(#plane)"/>
  <polygon points="190,844 390,590 390,844" fill="#3b0e18" opacity=".7"/>
  <path d="M150 560 L390 345" stroke="url(#edge)" stroke-width="6" opacity=".45" filter="url(#soft)"/>
  <path d="M150 560 L390 345" stroke="url(#edge)" stroke-width="1.2"/>
  <path d="M230 790 L390 585" stroke="#ffe3dc" stroke-opacity=".55" stroke-width="1"/>
  <path d="M60 640 L150 560" stroke="#f0c2b8" stroke-opacity=".25" stroke-width=".8"/>
</svg>
