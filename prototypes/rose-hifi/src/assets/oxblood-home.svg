<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
  <!-- Rose HiFi · Oxblood Home field. Original procedural artwork drawn to the geometry of the
       study's Home render (Rose-09): lit graphite pane upper left, near-black wedge, saturated
       crimson right plane, a glass beam falling to a hot join, lower plane rising to the right.
       No raster, no grain, no blue. -->
  <defs>
    <linearGradient id="pane" x1="0" y1="0" x2=".55" y2="1"><stop offset="0" stop-color="#5a514f"/><stop offset=".5" stop-color="#2a2221"/><stop offset="1" stop-color="#171110"/></linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2=".8"><stop offset="0" stop-color="#2a0309"/><stop offset=".55" stop-color="#46040f"/><stop offset="1" stop-color="#5e0a1a"/></linearGradient>
    <linearGradient id="lower" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b020c"/><stop offset=".45" stop-color="#250207"/><stop offset=".8" stop-color="#1b0104"/><stop offset="1" stop-color="#170104"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4dccf" stop-opacity=".26"/><stop offset=".7" stop-color="#f4dccf" stop-opacity=".12"/><stop offset="1" stop-color="#ffd2c8" stop-opacity=".3"/></linearGradient>
    <linearGradient id="fan" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8a1426" stop-opacity=".9"/><stop offset=".6" stop-color="#5e0a1a" stop-opacity=".3"/><stop offset="1" stop-color="#2a0309" stop-opacity="0"/></linearGradient>
    <radialGradient id="join" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3ea"/><stop offset=".25" stop-color="#ff6a78" stop-opacity=".85"/><stop offset=".55" stop-color="#c0283f" stop-opacity=".45"/><stop offset="1" stop-color="#c0283f" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="390" height="844" fill="#170104"/>
  <polygon points="0,0 290,0 208,226 0,297" fill="url(#pane)"/>
  <polygon points="0,297 208,226 127,391 63,414 0,610" fill="#0f0606"/>
  <polygon points="290,0 390,0 390,300 63,414 127,391" fill="url(#right)"/>
  <polygon points="127,391 390,190 390,300 63,414" fill="url(#fan)"/>
  <polygon points="63,414 390,300 390,844 0,844 0,610" fill="url(#lower)"/>
  <polygon points="284,0 312,0 136,392 120,392" fill="url(#beam)"/>
  <path d="M286 0 L121 392" stroke="#fff1e6" stroke-width="3.5" opacity=".45" filter="url(#soft)"/>
  <path d="M286 0 L121 392" stroke="#fff1e6" stroke-width="1.3"/>
  <path d="M312 0 L136 392" stroke="#f0cfc2" stroke-opacity=".45" stroke-width=".8"/>
  <path d="M63 414 L390 300" stroke="#d65a69" stroke-opacity=".55" stroke-width="1"/>
  <path d="M63 414 L0 610" stroke="#a0283c" stroke-opacity=".7" stroke-width="1"/>
  <path d="M208 226 L0 297" stroke="#c9b6ad" stroke-opacity=".22" stroke-width=".8"/>
  <ellipse cx="128" cy="388" rx="70" ry="40" transform="rotate(-20 128 388)" fill="url(#join)" filter="url(#bloom)" opacity=".9"/>
  <ellipse cx="127" cy="390" rx="16" ry="7" transform="rotate(-20 127 390)" fill="#fff3ea" opacity=".85" filter="url(#soft)"/>
</svg>
