<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
  <!-- Rose HiFi · Oxblood field for Home/Lock/switcher. Original procedural artwork interpreting
       the "Sunlit Instruments" Oxblood study: oxblood + graphite, oblique glass planes, sunlit
       platinum edges. No raster, no grain, no blue. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0506"/><stop offset=".5" stop-color="#1d070b"/><stop offset="1" stop-color="#2b0a11"/>
    </linearGradient>
    <linearGradient id="graphite" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#2e2a2b"/><stop offset=".6" stop-color="#100b0c"/><stop offset="1" stop-color="#0b0607" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plane" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b1828" stop-opacity=".85"/><stop offset=".55" stop-color="#3c0d17" stop-opacity=".7"/><stop offset="1" stop-color="#2a0a12" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="plane2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3e0f19" stop-opacity=".85"/><stop offset=".6" stop-color="#6e1c2c" stop-opacity=".45"/><stop offset="1" stop-color="#2a0a12" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#f4dccf" stop-opacity=".0"/><stop offset=".5" stop-color="#f4dccf" stop-opacity=".22"/><stop offset="1" stop-color="#f4dccf" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c4b4" stop-opacity="0"/><stop offset=".45" stop-color="#fff1e6"/><stop offset="1" stop-color="#e2b7a6" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe9dc" stop-opacity=".95"/><stop offset=".25" stop-color="#ff9a9f" stop-opacity=".45"/><stop offset="1" stop-color="#c0283f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".78" cy=".55" r=".6">
      <stop offset="0" stop-color="#5a1220" stop-opacity=".45"/><stop offset="1" stop-color="#3d0f1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="390" height="844" fill="url(#base)"/>
  <rect width="390" height="844" fill="url(#glow)"/>
  <!-- graphite wedge, upper left -->
  <polygon points="0,0 250,0 0,410" fill="url(#graphite)"/>
  <!-- main oblique glass plane from top right falling to the lower left -->
  <polygon points="300,0 390,0 390,470 82,560 196,330" fill="url(#plane)"/>
  <!-- translucent glass sheet catching light -->
  <polygon points="318,0 352,0 150,500 108,520" fill="url(#sheet)"/>
  <!-- lower plane meeting at an oblique join -->
  <polygon points="0,610 390,410 390,844 0,844" fill="url(#plane2)"/>
  <polygon points="0,700 390,520 390,560 0,760" fill="#1c070c" opacity=".55"/>
  <!-- sunlit platinum edges -->
  <path d="M338 0 L120 512" stroke="url(#edge)" stroke-width="5" opacity=".5" filter="url(#soft)"/>
  <path d="M338 0 L120 512" stroke="url(#edge)" stroke-width="1.3"/>
  <path d="M0 612 L390 410" stroke="#f3cfc2" stroke-opacity=".55" stroke-width="1"/>
  <path d="M82 560 L390 470" stroke="#e7b5a8" stroke-opacity=".35" stroke-width=".8"/>
  <path d="M120 512 L82 560" stroke="#f6d8cb" stroke-opacity=".6" stroke-width="1"/>
  <!-- sun catching the join -->
  <circle cx="170" cy="395" r="40" fill="url(#sun)" filter="url(#bloom)" opacity=".6"/>
  <circle cx="170" cy="395" r="3.2" fill="#fff6ef"/>
</svg>
