/* Rose HiFi — one material system: refractive wallpaper, ivory content, brushed metal,
   recessed glass wells. Light comes from the upper left everywhere. */
:root{
  --ink:#141922;--ink-2:#5b6680;--ink-3:#8a93a6;--ivory:#f5f7fa;--ivory-2:#eef2f7;
  --line:rgba(30,50,80,.10);--rose:#c56f78;--stop:#d9534a;--stop-soft:#fde9e6;--ok:#4fb36a;
  --blue:#3d7df2;--focus:#b36d4f;
  --ease:cubic-bezier(.2,.8,.2,1);--ease-in:cubic-bezier(.5,0,.75,0);
  --t-fast:160ms;--t-med:320ms;--t-slow:560ms;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --margin:24px;--screen-w:384px;--screen-h:832px;--bezel:12px;--radius:46px;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);
  font-synthesis:none;-webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 30% 10%,#f4f7fb 0%,#dfe6ee 60%,#d3dce6 100%);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Page: phone stage + compact harness ---------- */
.page{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:0}
.stage{position:relative;display:grid;place-items:center;min-width:0;overflow:hidden}
.fit{position:absolute;left:50%;top:50%;width:calc(var(--screen-w) + 2*var(--bezel));height:calc(var(--screen-h) + 2*var(--bezel));transform:translate(-50%,-50%) scale(var(--fit,1));transform-origin:center;transition:width var(--t-slow) var(--ease)}
.harness{border-left:1px solid rgba(40,60,90,.12);background:rgba(250,252,254,.72);backdrop-filter:blur(18px);padding:18px 16px;overflow:auto;font-size:12.5px;color:#334;display:flex;flex-direction:column;gap:14px}
.harness h1{font-size:14px;font-weight:600;margin:0;letter-spacing:-.01em}
.harness h1 small{display:block;font-weight:400;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.harness fieldset{border:0;margin:0;padding:12px 0 0;border-top:1px solid rgba(40,60,90,.10);display:grid;gap:7px}
.harness legend{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#6a7488;padding:0;margin-bottom:6px;float:left;width:100%}
.harness .row{display:flex;gap:6px;flex-wrap:wrap}
.harness .row>button{flex:1 1 auto}
.hbtn{min-height:34px;padding:6px 10px;border-radius:10px;border:1px solid rgba(40,60,90,.18);background:#fff;font-size:12px;font-weight:500;white-space:nowrap}
.hbtn:hover:not(:disabled){background:#f1f5fa}
.hbtn:disabled{opacity:.42;cursor:default}
.hbtn[aria-pressed=true]{background:#233247;color:#fff;border-color:#233247}
.hcheck{display:flex;align-items:center;gap:8px;min-height:28px}
.hcheck input{width:16px;height:16px;accent-color:#233247;margin:0}
.hstatus{font-variant-numeric:tabular-nums;color:#55607a;line-height:1.5;font-size:11.5px}
.hstatus b{font-weight:600;color:#2a3446}
.tasklist{display:grid;gap:4px}
.tasklist div{display:flex;justify-content:space-between;gap:8px}
.tasklist span:last-child{color:#5b6680}

/* ---------- Device ---------- */
.device{position:relative;width:100%;height:100%;border-radius:calc(var(--radius) + var(--bezel));padding:var(--bezel);
  background:linear-gradient(145deg,#3b3f45,#101215 30%,#1c1f23 70%,#4a4e55);
  box-shadow:0 0 0 1px #6b7078 inset,0 0 0 2px #0b0c0e inset,0 40px 80px rgba(20,35,55,.35),0 12px 24px rgba(20,35,55,.25)}
.device::before{content:'';position:absolute;left:-3px;top:150px;width:3px;height:64px;border-radius:2px 0 0 2px;background:linear-gradient(90deg,#2a2d31,#555a61);box-shadow:0 84px 0 #3a3e44}
.screen{-webkit-user-select:none;user-select:none;position:relative;width:100%;height:100%;border-radius:var(--radius);overflow:hidden;background:var(--ivory);isolation:isolate;contain:layout paint}
.punch{position:absolute;top:14px;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2b3442 0 20%,#07090c 45%);box-shadow:0 0 0 2px #0d0f12;z-index:60;pointer-events:none}
.device.unfolded .punch{left:auto;right:64px}
.device.unfolded::after{content:'';position:absolute;top:var(--bezel);bottom:var(--bezel);left:50%;width:1px;background:linear-gradient(transparent,rgba(255,255,255,.08) 20%,rgba(255,255,255,.08) 80%,transparent);z-index:70;pointer-events:none}

/* Wallpaper & backdrops */
.wall{position:absolute;inset:0;background-image:var(--wallpaper);background-size:cover;background-position:62% 30%;z-index:0;transition:filter var(--t-slow) var(--ease),transform var(--t-slow) var(--ease)}
.device.unfolded .wall{background-position:center 34%}
.screen[data-view=switcher] .wall{filter:blur(26px) saturate(.9) brightness(1.18);transform:scale(1.08)}
.ivory-bg{position:absolute;inset:0;z-index:0;background:
  radial-gradient(120% 60% at 110% 105%,rgba(160,190,230,.35),transparent 55%),
  linear-gradient(180deg,#f7f9fc 0%,#eef3f9 100%)}
.ivory-bg::after{content:'';position:absolute;inset:-10%;background-image:var(--wallpaper);background-size:cover;background-position:80% 20%;opacity:.16;filter:blur(2px) saturate(.8);mix-blend-mode:multiply;
  -webkit-mask-image:radial-gradient(90% 70% at 100% 100%,#000 10%,transparent 70%);mask-image:radial-gradient(90% 70% at 100% 100%,#000 10%,transparent 70%)}

/* Views */
.view{position:absolute;inset:0;z-index:2}
.view[data-active=false]{visibility:hidden;pointer-events:none}

/* ---------- Brushed metal tray & glass wells ---------- */
.tray{position:absolute;left:var(--margin);right:var(--margin);bottom:34px;height:92px;border-radius:22px;z-index:20;
  display:flex;align-items:center;justify-content:space-around;padding:0 14px;
  background:var(--brush),linear-gradient(180deg,#f6f7f9 0%,#e3e7eb 38%,#cfd5db 62%,#e8ebee 100%);
  background-size:220px 100%,100% 100%;background-blend-mode:soft-light,normal;
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(60,75,95,.28),inset 1px 0 0 rgba(255,255,255,.7),0 1px 0 rgba(255,255,255,.5),0 16px 32px rgba(18,35,60,.28),0 3px 8px rgba(18,35,60,.18)}
.device.unfolded .tray{left:50%;right:auto;width:520px;margin-left:-260px}
.tray.two{justify-content:space-between;padding:0 22px}
.tray:not(.two) .well{width:92px}
.well{position:relative;width:104px;height:66px;border-radius:36px;display:grid;place-items:center;
  background:radial-gradient(110% 80% at 32% 18%,rgba(255,255,255,.98) 0%,rgba(255,255,255,.55) 34%,rgba(214,226,240,.35) 68%,rgba(190,206,224,.5) 100%);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.95),inset 0 -4px 8px rgba(70,92,125,.22),inset 0 0 0 1px rgba(255,255,255,.65),0 0 0 1px rgba(110,130,158,.32),0 5px 10px rgba(30,50,80,.22),0 1px 1px rgba(30,50,80,.2);
  transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease);color:#26303f}
.well::after{content:'';position:absolute;left:16%;right:16%;top:5px;height:34%;border-radius:40px;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none}
.well:active,.well.pressed{transform:translateY(1px) scale(.975);box-shadow:inset 0 3px 8px rgba(60,80,110,.28),inset 0 -1px 2px rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.5),0 0 0 1px rgba(110,130,158,.32),0 2px 4px rgba(30,50,80,.18)}
.well[aria-pressed=true].sel,.well.selected{box-shadow:inset 0 2px 1px rgba(255,255,255,.95),inset 0 -4px 8px rgba(70,92,125,.18),0 0 0 1px rgba(80,140,255,.65),0 0 14px rgba(80,140,255,.55),0 5px 10px rgba(30,50,80,.2)}
.well:disabled{opacity:.45;cursor:default}
.well svg{width:28px;height:28px;position:relative;z-index:1}
.well .end{color:var(--stop)}
.well[data-muted=true]{color:#6f7b8e}
.overview-glyph{display:flex;gap:4px;align-items:center;position:relative;z-index:1}
.overview-glyph i{display:block;width:11px;height:30px;border-radius:5px;background:linear-gradient(180deg,#fff,#e2e8f0);box-shadow:0 0 0 1px rgba(120,140,170,.55),inset 0 -2px 3px rgba(80,100,130,.25)}
.overview-glyph i:nth-child(2){height:34px}
.overview-glyph i:last-child{background:linear-gradient(180deg,#6aa2ff,#2f6be6);box-shadow:0 0 0 1px rgba(30,80,200,.6),inset 0 2px 2px rgba(255,255,255,.45)}
.rose-slot{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:1}
.rose-slot canvas,.rose-slot .rose-fallback{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.well .rose-slot canvas,.well .rose-slot .rose-fallback{width:102px;height:102px}

/* ---------- Rose renderer static fallback (mirrors the three signals) ---------- */
.rose-fallback{display:grid;place-items:center}
.rose-fallback .orb{position:relative;width:37%;height:37%}
.rose-fallback .h{position:absolute;left:0;width:100%;height:50%;background:radial-gradient(ellipse at 30% 22%,#fff 0,rgba(255,255,255,0) 32%),linear-gradient(115deg,#7d91a3,#dfe7ee 42%,#6e8496 78%,#eef3f9);transition:transform var(--t-med) var(--ease)}
.rose-fallback .h.up{top:0;border-radius:999px 999px 6% 6%/999px 999px 8% 8%}
.rose-fallback .h.lo{bottom:0;border-radius:6% 6% 999px 999px/8% 8% 999px 999px;background:linear-gradient(115deg,#8aa0b1,#cfdae5 42%,#53697a)}
.rose-fallback[data-mic=on] .h{background:radial-gradient(ellipse at 30% 22%,#fff 0,rgba(255,255,255,0) 32%),linear-gradient(115deg,#a35b6b,#f2c0c9 44%,#8e4c5d 80%,#f6d2d9)}
.rose-fallback[data-mic=on] .h.lo{background:linear-gradient(115deg,#a86677,#e8b2bd 44%,#7e4152)}
.rose-fallback[data-connection=connecting] .h.up{transform:translateY(-5%)}
.rose-fallback[data-connection=disconnected] .h.up{transform:translateY(-19%)}
.rose-fallback .ring{position:absolute;width:41%;height:41%;border-radius:50%;border:1.5px solid #f4faff;box-shadow:0 0 6px #b9c8ff,0 0 14px #e4f4ff,inset 0 0 8px #c4e2ff;opacity:0;transition:all var(--t-med) var(--ease)}
.rose-fallback[data-voice=listening] .ring{opacity:1}
.rose-fallback[data-voice=speaking] .ring{opacity:1;width:62%;height:62%}

/* ---------- Home ---------- */
.home-pages{position:absolute;inset:0;overflow:hidden;touch-action:pan-y}
.home-track{display:flex;height:100%;transition:transform var(--t-slow) var(--ease);will-change:transform}
.home-track.dragging{transition:none}
.home-page{flex:0 0 100%;height:100%;position:relative;padding:0 var(--margin)}
.home-date{position:absolute;top:132px;left:0;right:0;text-align:center;color:#fff;font-size:22px;font-weight:400;letter-spacing:-.01em;text-shadow:0 1px 10px rgba(20,50,90,.45)}
.app-grid{position:absolute;left:var(--margin);right:var(--margin);display:grid;grid-template-columns:repeat(var(--cols,3),1fr);row-gap:22px;justify-items:center}
.home-page.sparse .app-grid{bottom:210px;--cols:3;padding:0 6px}
.home-page.full .app-grid{top:84px;--cols:4;row-gap:20px}
.home-page.few .app-grid{bottom:210px;--cols:4}
.device.unfolded .home-page.sparse .app-grid{--cols:5;left:120px;right:120px}
.device.unfolded .home-page.full .app-grid{--cols:6;left:60px;right:60px;row-gap:26px}
.device.unfolded .home-page.few .app-grid{--cols:4;left:150px;right:150px}
.app{display:grid;justify-items:center;gap:7px;width:84px;padding:4px 0;border-radius:18px}
.tile{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;position:relative;
  background:linear-gradient(160deg,rgba(255,255,255,.62),rgba(255,255,255,.18) 55%,rgba(225,236,248,.32));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -2px 6px rgba(60,90,130,.18),inset 0 0 0 1px rgba(255,255,255,.5),0 0 0 1px rgba(120,150,190,.32),0 6px 14px rgba(15,35,70,.22);
  backdrop-filter:blur(6px) saturate(1.2);transition:transform var(--t-fast) var(--ease)}
.tile::after{content:'';position:absolute;inset:2px 2px 50% 2px;border-radius:16px 16px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.tile img,.tile svg{width:44px;height:44px;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 2px 2px rgba(20,40,70,.25))}
.app:active .tile{transform:scale(.94)}
.app .label{font-size:12.5px;font-weight:500;color:#fff;text-shadow:0 1px 6px rgba(10,30,60,.65),0 0 1px rgba(10,30,60,.5);letter-spacing:.005em;white-space:nowrap}
.page-dots{position:absolute;left:0;right:0;bottom:142px;display:flex;justify-content:center;gap:4px;z-index:21}
.page-dots button{width:28px;height:28px;display:grid;place-items:center}
.page-dots button i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.45);box-shadow:0 0 0 1px rgba(30,60,100,.15);transition:all var(--t-med) var(--ease)}
.page-dots button[aria-current=true] i{background:#fff;width:9px;height:9px;box-shadow:0 0 6px rgba(255,255,255,.8)}

/* ---------- Rose main ---------- */
.rose-head{position:absolute;top:58px;left:var(--margin);right:var(--margin);display:flex;align-items:center;justify-content:space-between;z-index:5}
.device.unfolded .rose-head{left:calc(50% - 280px);right:calc(50% - 280px)}
.rose-head h2{margin:0;font-size:30px;font-weight:450;letter-spacing:-.03em}
.rose-stage{position:absolute;width:220px;height:220px;left:50%;top:228px;margin-left:-110px;z-index:4;pointer-events:none;
  transform-origin:center;transition:transform var(--t-slow) var(--ease)}
.rose-stage .rose-slot canvas,.rose-stage .rose-slot .rose-fallback{width:282px;height:282px}
.rose-caption{position:absolute;left:0;right:0;top:470px;text-align:center;font-size:15px;color:var(--ink-2);z-index:4;transition:all var(--t-slow) var(--ease);min-height:20px}
.screen[data-result=true] .rose-stage{transform:translate(-128px,-176px) scale(.4)}
.screen[data-result=true] .rose-caption{text-align:left;left:calc(var(--margin) + 84px);top:151px}
.rose-output{position:absolute;left:var(--margin);right:var(--margin);top:216px;bottom:150px;overflow:auto;z-index:3;scrollbar-width:none}
.rose-output h3{font-size:44px;line-height:1.06;font-weight:400;letter-spacing:-.038em;margin:0 0 22px;color:var(--ink);text-wrap:balance}
.rose-output p{font-size:21px;line-height:1.38;color:var(--ink-2);margin:0 0 14px;letter-spacing:-.01em}
.rose-output .facts{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:10px}
.rose-output .facts li{display:flex;align-items:baseline;gap:12px;font-size:15px;color:var(--ink-2);padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.62);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 1px 2px rgba(30,50,80,.08)}
.rose-output .facts b{font-weight:550;color:var(--ink);min-width:118px}
.reveal>*{animation:rise var(--t-slow) var(--ease) both}
.reveal>*:nth-child(2){animation-delay:110ms}.reveal>*:nth-child(3){animation-delay:220ms}.reveal>*:nth-child(4){animation-delay:330ms}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.device.unfolded .rose-output{left:50%;right:auto;width:560px;margin-left:-280px}
.device.unfolded .screen[data-result=true] .rose-stage{transform:translate(-240px,-176px) scale(.4)}
.device.unfolded .screen[data-result=true] .rose-caption{left:calc(50% - 280px + 84px)}

/* ---------- Home indicator ---------- */
.home-bar{position:absolute;left:50%;bottom:6px;width:180px;height:22px;margin-left:-90px;display:grid;place-items:center;z-index:30}
.home-bar i{display:block;width:132px;height:5px;border-radius:3px;background:rgba(20,25,34,.82)}
.screen[data-view=home] .home-bar{display:none}

/* ---------- Notifications ---------- */
.screen.locked #sheet-host{display:none}
.notices{position:absolute;top:56px;left:var(--margin);right:var(--margin);z-index:50;display:grid;gap:8px;justify-items:center;pointer-events:none}
.notice{pointer-events:auto;display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 18px 10px 12px;border-radius:26px;max-width:100%;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(244,247,251,.9));backdrop-filter:blur(20px) saturate(1.4);
  box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(120,140,170,.22),0 12px 28px rgba(20,40,70,.22);font-size:15px;font-weight:500;color:var(--ink);
  animation:drop var(--t-med) var(--ease) both}
.notice.task{border-radius:20px;padding:12px 16px 12px 12px;min-width:min(100%,300px)}
.notice.leaving{animation:lift var(--t-med) var(--ease-in) both}
.notice .ni{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#fff,#e6ebf2);box-shadow:inset 0 0 0 1px rgba(120,140,170,.3);color:#3a4558;flex:none}
.notice .ni svg{width:17px;height:17px}
.notice .ni.end{color:var(--stop)}
.notice .ni.done{color:#fff;background:linear-gradient(180deg,#63c27c,#3e9a59)}
.notice .ni.attn{color:#fff;background:linear-gradient(180deg,#f2b54a,#d98f1d)}
.notice small{display:block;font-weight:400;color:var(--ink-2);font-size:13px;margin-top:1px}
@keyframes drop{from{transform:translateY(-140%);opacity:0}to{transform:none;opacity:1}}
@keyframes lift{to{transform:translateY(-140%);opacity:0}}

/* ---------- Lock ---------- */
.lock{position:absolute;inset:0;z-index:57;display:grid;align-content:start;justify-items:center;padding-top:150px;color:#fff;text-shadow:0 2px 14px rgba(10,30,60,.5)}
.lock .wall{filter:brightness(.82)}
.lock .time{position:relative;font-size:84px;font-weight:300;letter-spacing:-.04em;line-height:1}
.lock .date{position:relative;font-size:18px;margin-top:8px}
.lock .unlock{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);min-height:48px;padding:0 26px;border-radius:24px;background:rgba(255,255,255,.22);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45);font-size:15px;font-weight:500}

/* ---------- Generic surfaces used by switcher / agents / apps (hour two) ---------- */
.surface{position:absolute;inset:0;padding:64px var(--margin) 150px;overflow:auto;scrollbar-width:none}
.surface h2{font-size:28px;font-weight:450;letter-spacing:-.03em;margin:0 0 18px}
.app-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.app-head .tile{width:44px;height:44px;border-radius:13px}
.app-head .tile img,.app-head .tile svg{width:30px;height:30px}
.app-head h2{margin:0}

/* Reduced motion: keep every state distinction, remove travel. */
.static-motion *,.static-motion *::before,.static-motion *::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important;transition-delay:0ms!important}

@media (max-width:820px){
  .page{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .harness{border-left:0;border-top:1px solid rgba(40,60,90,.12);max-height:38vh;padding:12px 16px}
}

/* ---------- System switcher: two independent carousels ---------- */
#v-switcher .wall{filter:blur(28px) saturate(.85) brightness(1.22);transform:scale(1.1)}
.sw-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(240,245,251,.55),rgba(236,242,250,.72))}
.sw-human,.sw-agent{position:absolute;left:0;right:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.sw-human::-webkit-scrollbar,.sw-agent::-webkit-scrollbar{display:none}
.sw-human.dragging,.sw-agent.dragging{scroll-snap-type:none;cursor:grabbing}
.sw-human{top:64px;height:480px;gap:10px;padding:20px calc(50% - 108px);align-items:center}
.hcard{position:relative;flex:0 0 216px;height:420px;scroll-snap-align:center;border-radius:24px;background:#fff;overflow:hidden;
  box-shadow:0 0 0 1px rgba(120,140,170,.16),0 18px 40px rgba(25,45,80,.22),0 3px 8px rgba(25,45,80,.12);transition:transform 80ms linear;display:flex;flex-direction:column}
.hcard header,.wcard header{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;font-size:13px;font-weight:550;color:var(--ink)}
.mini-ico{width:24px;height:24px;display:grid;place-items:center;flex:none}
.mini-ico img,.mini-ico svg{width:24px;height:24px;object-fit:contain}
.hbody{flex:1;padding:0 12px 12px;overflow:hidden;font-size:12px;pointer-events:none}
.hopen,.wopen{position:absolute;inset:0;z-index:2;border-radius:inherit}
.sw-link{position:absolute;left:var(--margin);right:var(--margin);top:560px;height:56px}
.sw-rose{position:absolute;left:-6px;top:-4px;width:64px;height:64px}
.sw-rose .rose-slot canvas,.sw-rose .rose-slot .rose-fallback{width:82px;height:82px}
.wire{position:absolute;left:52px;right:24px;top:28px;height:56px;width:calc(100% - 76px);overflow:visible}
.wire path{fill:none;stroke:rgba(80,100,130,.35);stroke-width:1.6;stroke-dasharray:1.2 3.2;stroke-linecap:round;vector-effect:non-scaling-stroke}
.working .wire path{stroke:rgba(70,110,200,.75);stroke-width:2.2;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-8.8}}
.sw-link-label{position:absolute;left:66px;top:2px;font-size:12px;color:var(--ink-2);letter-spacing:.01em}
.sw-agent{top:624px;height:176px;gap:12px;padding:6px var(--margin) 10px;align-items:stretch}
.sw-agent .aitem{flex:0 0 156px;scroll-snap-align:start;display:flex}
.sw-empty{margin:auto;color:var(--ink-2);font-size:14px}
.device.unfolded .sw-human{padding:20px calc(50% - 140px)}
.device.unfolded .hcard{flex-basis:280px;height:440px}
.device.unfolded .sw-agent .aitem{flex-basis:168px}

/* ---------- Agent window cards ---------- */
.wcard{position:relative;display:flex;flex-direction:column;border-radius:22px;background:rgba(255,255,255,.86);width:100%;
  box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(120,140,170,.18),0 10px 26px rgba(25,45,80,.12);overflow:hidden;transition:filter var(--t-med) var(--ease),opacity var(--t-med) var(--ease)}
.wcard .wl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbody{flex:1;margin:0 10px;border-radius:14px;overflow:hidden;background:#f3f6fa;position:relative;min-height:0;font-size:11px}
.wcard footer{display:flex;align-items:center;gap:7px;padding:8px 8px 8px 14px;font-size:12px;color:var(--ink-2);position:relative;z-index:3;pointer-events:none}
.wcard footer .stop-btn{margin-left:auto;pointer-events:auto}
.wcard .wstate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard[data-state=stopped],.wcard[data-state=done]{filter:saturate(.35)}
.wcard[data-state=stopped] .wbody{opacity:.6}
.wcard[data-state=stopping] .wbody{opacity:.8}
.wcard.small header{padding:9px 10px 6px;font-size:12px}
.wcard.small .wbody{margin:0 8px;border-radius:11px;font-size:9px}
.wcard.small footer{padding:5px 6px 6px 10px;font-size:11px}
.sdot{width:9px;height:9px;border-radius:50%;background:#aeb7c4;flex:none}
.sdot[data-state=running]{background:var(--ok);box-shadow:0 0 0 3px rgba(79,179,106,.18)}
.sdot[data-state=attention]{background:#e6a23a;box-shadow:0 0 0 3px rgba(230,162,58,.2)}
.sdot[data-state=stopping]{background:transparent;border:2px solid #c9d0da;border-top-color:var(--stop);animation:spin .9s linear infinite}
.sdot[data-state=stopped]{background:#8e98a6}
.sdot[data-state=done]{background:#5b8def}
@keyframes spin{to{transform:rotate(360deg)}}
.stop-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--stop);flex:none;
  background:radial-gradient(90% 80% at 35% 25%,#fff,#fbe9e6 70%);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(217,83,74,.22),0 3px 8px rgba(217,83,74,.18)}
.stop-btn svg{width:20px;height:20px}
.stop-btn:active{transform:scale(.95)}
.stop-btn:disabled{color:#b8c0cb;background:#f1f4f8;box-shadow:0 0 0 1px rgba(120,140,170,.18);cursor:default}
.stop-btn.wide{width:auto;padding:0 16px 0 12px;gap:6px;display:flex;border-radius:22px;font-size:14px;font-weight:550}
.stop-btn.wide::after{content:'Stop task'}

/* ---------- Rose's apps (agent screens) ---------- */
.agents-surface{padding-top:64px;padding-bottom:150px}
.agrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.agrid .wcard{height:250px}
.device.unfolded .agrid{grid-template-columns:repeat(4,1fr);gap:14px}
.device.unfolded .agrid .wcard{height:296px}
.device.unfolded .agents-surface{overflow:hidden;padding-left:28px;padding-right:28px}
.a-empty{color:var(--ink-2);font-size:15px;text-align:center;margin-top:220px}
.rose-dot svg{width:30px;height:30px}

/* ---------- Detail views ---------- */
.detail{padding-top:60px}
.back-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin:0 0 10px -6px;color:#26303f;background:radial-gradient(90% 80% at 35% 25%,#fff,#e8eef5);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(120,140,170,.25),0 3px 8px rgba(25,45,80,.12)}
.back-btn svg{width:22px;height:22px}
.app-head .sub{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.detail-frame{position:relative;height:430px;border-radius:24px;overflow:hidden;background:#fff;font-size:15px;box-shadow:0 0 0 1px rgba(120,140,170,.16),0 14px 32px rgba(25,45,80,.12)}
.detail-frame.human{height:560px}
.device.unfolded .detail{padding-left:96px;padding-right:96px}
.task-strip{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 12px 12px 16px;border-radius:20px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 1px 3px rgba(25,45,80,.08)}
.task-strip div{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;flex:1;min-width:0}
.task-strip b{font-weight:550;font-size:15px}
.task-strip span:not(.sdot){grid-column:2;font-size:13px;color:var(--ink-2)}
.observe{font-size:13px;color:var(--ink-3);margin:12px 4px 0}

/* ---------- Stop confirmation ---------- */
#sheet-host{position:absolute;inset:0;z-index:55;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(20,30,45,.28);pointer-events:auto;animation:fade var(--t-med) var(--ease) both}
.sheet{position:absolute;left:12px;right:12px;bottom:12px;padding:26px 22px 20px;border-radius:32px;pointer-events:auto;background:linear-gradient(180deg,#fff,#f4f7fb);box-shadow:0 -10px 40px rgba(20,35,60,.25);animation:sheet var(--t-med) var(--ease) both}
.device.unfolded .sheet{left:50%;right:auto;width:440px;margin-left:-220px}
.sheet h3{font-size:22px;font-weight:500;letter-spacing:-.02em;margin:0 0 8px}
.sheet p{font-size:15px;line-height:1.45;color:var(--ink-2);margin:0 0 20px}
.sheet-actions{display:flex;gap:10px}
.sbtn{flex:1;min-height:52px;border-radius:26px;font-size:15px;font-weight:550;background:#eef2f7;box-shadow:inset 0 0 0 1px rgba(120,140,170,.25)}
.sbtn.danger{background:var(--stop);color:#fff;box-shadow:0 4px 12px rgba(217,83,74,.35)}
@keyframes fade{from{opacity:0}}
@keyframes sheet{from{transform:translateY(110%)}}

/* ---------- App content ---------- */
.ph{display:block;border-radius:8px;background-size:cover}
.c-browser{position:absolute;inset:0;padding:8%;background:#fff}
.c-browser .url{height:2.2em;border-radius:1.1em;background:#eef2f7;padding:0 .9em;display:flex;align-items:center;color:#556;white-space:nowrap;overflow:hidden;margin-bottom:7%}
.c-browser .hero{height:42%;margin-bottom:6%}
.c-browser h4{font-size:1.25em;font-weight:600;margin:0 0 .3em}
.c-browser p{margin:0 0 .25em;color:#5b6680}
.pointer{position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(61,125,242,.35);box-shadow:0 0 0 2px rgba(61,125,242,.8);transition:left .9s var(--ease),top .9s var(--ease)}
.caret{display:inline-block;width:1.5px;height:1em;background:#3d7df2;vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.c-maps{position:absolute;inset:0}
.c-maps svg{width:100%;height:100%;display:block}
.c-maps .route{transition:clip-path 1s var(--ease)}
.pill{position:absolute;left:8%;bottom:7%;padding:.35em .8em;border-radius:1em;background:#fff;box-shadow:0 1px 4px rgba(25,45,80,.18);font-size:1em;font-weight:500;color:#334}
.c-notes{position:absolute;inset:0;padding:9%;background:#fffdf6}
.c-notes h4{margin:0 0 .6em;font-size:1.3em;font-weight:600}
.c-notes p{display:flex;align-items:center;gap:.5em;margin:0 0 .55em;min-height:1.2em;color:#3c4250}
.box{width:.95em;height:.95em;border-radius:.25em;box-shadow:inset 0 0 0 1.5px #b9b39b;flex:none}
.c-cal{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column}
.cal-head{padding:7% 8% 4%;display:flex;gap:.4em;align-items:baseline}
.cal-head b{font-size:1.25em}.cal-head span{color:#778}
.cal-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);gap:3px;margin:0 6% 6%;background:repeating-linear-gradient(180deg,transparent 0 calc(100%/6 - 1px),#e7ecf2 calc(100%/6 - 1px) calc(100%/6))}
.cal-grid i{border-radius:5px;animation:rise var(--t-slow) var(--ease) both}
.c-mail{position:absolute;inset:0;padding:8%;background:#fff;color:#334}
.c-mail p{margin:0 0 .5em}.c-mail .to span{color:#889;margin-right:.4em}.c-mail .subj{font-weight:600;border-bottom:1px solid #eef1f5;padding-bottom:.5em}
.c-mail .body{line-height:1.45}
.c-files{position:absolute;inset:0;padding:8%;background:#fff}
.c-files p{display:flex;align-items:center;gap:.6em;margin:0 0 .4em;padding:.45em .5em;border-radius:.5em;color:#445}
.c-files p i{width:1.1em;height:1.3em;border-radius:.2em;background:#8bb6fb}
.c-files p.hit{background:#eaf1ff}
.c-editor{position:absolute;inset:0;padding:8%;background:#1d2433;color:#d6e2ff;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.92em}
.c-editor p{margin:0 0 .4em;white-space:pre;min-height:1em}
.c-photos{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#fff}
.c-photos .ph{border-radius:6px}
.c-camera{position:absolute;inset:0;background:#0d1015}
.c-camera .vf{position:absolute;inset:0 0 22% 0;background-image:var(--wallpaper);background-size:cover;background-position:40% 30%}
.c-camera .shutter{position:absolute;left:50%;bottom:6%;width:3.6em;height:3.6em;margin-left:-1.8em;border-radius:50%;background:#fff;box-shadow:0 0 0 .3em #0d1015,0 0 0 .45em #fff}
.c-list{position:absolute;inset:0;padding:4% 6%;background:#fff}
.c-list p{display:flex;justify-content:space-between;margin:0;padding:.9em .2em;border-bottom:1px solid #eef1f5;color:#2c3340}
.c-list p span{color:#aab}
.c-big{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:linear-gradient(180deg,#f7f9fc,#eaf0f7)}
.c-big b{font-size:4em;font-weight:300;letter-spacing:-.04em}.c-big span{color:#5b6680}
.c-msg{position:absolute;inset:0;padding:8%;background:#fff;display:flex;flex-direction:column;gap:.6em}
.c-msg p{margin:0;padding:.6em .9em;border-radius:1.1em;max-width:75%}
.c-msg .in{background:#eef2f7;align-self:flex-start}.c-msg .out{background:#3d7df2;color:#fff;align-self:flex-end}
.c-music{position:absolute;inset:0;display:grid;justify-items:center;align-content:center;gap:.4em;background:linear-gradient(180deg,#fff,#f1f4f9)}
.c-music .art{width:62%;aspect-ratio:1;border-radius:12px;box-shadow:0 10px 24px rgba(25,45,80,.2)}
.c-music span{color:#5b6680}
.hbody .c-browser,.hbody .c-list,.hbody .c-photos,.hbody .c-camera,.hbody .c-big,.hbody .c-msg,.hbody .c-music,.hbody .c-notes,.hbody .c-mail,.hbody .c-files,.hbody .c-editor,.hbody .c-cal,.hbody .c-maps{border-radius:14px}
.hbody{position:relative}
.static-motion .caret,.static-motion .pointer,.static-motion .working .wire path{animation:none!important}

/* ---------- Review fixes (notices, legibility, materials, targets, focus) ---------- */
.screen.locked .notices{top:300px;z-index:58}
.screen[data-view=rose] .notices{left:132px;justify-items:end}
.notice{text-align:left}
.notice>span:last-child{min-width:0;flex:1}
.app .label{text-shadow:0 0 2px rgba(8,22,45,.9),0 1px 3px rgba(8,22,45,.75),0 2px 12px rgba(8,22,45,.55)}
.home-date{text-shadow:0 0 2px rgba(8,22,45,.6),0 1px 14px rgba(8,22,45,.55)}
.home-page.full .app-grid{top:auto;bottom:196px}
.device.unfolded .wall{background-position:center 12%}
/* Brushed metal: visible horizontal grain plus one diagonal specular from the upper left. */
.tray{background:linear-gradient(100deg,transparent 28%,rgba(255,255,255,.55) 44%,transparent 60%),var(--brush),linear-gradient(180deg,#f6f7f9 0%,#e3e7eb 38%,#cfd5db 62%,#e8ebee 100%);
  background-size:100% 100%,180px 7px,100% 100%;background-blend-mode:normal,overlay,normal}
/* Recessed pocket around each glass lens. */
.well{box-shadow:inset 0 2px 1px rgba(255,255,255,.95),inset 0 -4px 8px rgba(70,92,125,.22),inset 0 0 0 1px rgba(255,255,255,.65),0 0 0 1px rgba(95,115,142,.42),0 0 0 4px rgba(198,206,215,.9),0 0 0 5px rgba(120,135,155,.35),0 1px 0 5px rgba(255,255,255,.75)}
.well:active,.well.pressed{box-shadow:inset 0 3px 8px rgba(60,80,110,.3),inset 0 -1px 2px rgba(255,255,255,.6),0 0 0 1px rgba(95,115,142,.42),0 0 0 4px rgba(198,206,215,.9),0 0 0 5px rgba(120,135,155,.35)}
.well.selected{box-shadow:inset 0 2px 1px rgba(255,255,255,.95),inset 0 -4px 8px rgba(70,92,125,.18),0 0 0 1px rgba(80,140,255,.7),0 0 0 4px rgba(198,206,215,.9),0 0 16px rgba(80,140,255,.55)}
span.well{cursor:default}
/* Switcher shadows have room; agent cards too. */
.sw-human{top:48px;height:520px;padding-bottom:64px;padding-top:36px}
.hcard{box-shadow:0 0 0 1px rgba(120,140,170,.16),0 12px 26px rgba(25,45,80,.18),0 2px 6px rgba(25,45,80,.1)}
.sw-agent{padding-bottom:26px;height:196px}
.wire.idle path{animation:none;stroke:rgba(80,100,130,.25)}
/* Focus rings drawn inside clipped cards. */
.hopen:focus-visible,.wopen:focus-visible{outline-offset:-4px;border-radius:22px}
/* 44 px targets. */
.page-dots{gap:0;bottom:134px}
.page-dots button{width:44px;height:44px}
.home-bar{height:44px;bottom:0}
.hbtn{min-height:44px}
.hcheck{min-height:44px}
.screen img{-webkit-user-drag:none}
/* Window cards: browser content fits small windows. */
.wcard .c-browser .hero{height:34%}
.wcard .c-browser p,.wcard .c-browser h4{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Attention choice in window detail. */
.choice{margin-top:12px;padding:14px 16px;border-radius:20px;background:#fff8ec;box-shadow:inset 0 0 0 1px rgba(230,162,58,.35)}
.choice p{margin:0 0 10px;font-size:15px;font-weight:550}
.choice div{display:flex;gap:8px}
.choice .sbtn{min-height:44px;font-size:14px;background:#fff}
.detail-frame{height:400px}
@media (max-width:820px){
  body{overflow:auto}
  .page{height:auto;display:block}
  .stage{height:auto}
  .harness{max-height:none}
}
/* Clip (not hidden) so focusing an off-screen control can never scroll the phone itself. */
.screen,.home-pages,.stage{overflow:clip}
.view{overflow:clip}

/* ---------- Glass sheen over the display (decorative; never intercepts input) ---------- */
.glass{position:absolute;inset:0;z-index:90;pointer-events:none;border-radius:inherit;--sx:0;--sy:0;
  background:
    linear-gradient(118deg,transparent 0 31%,rgba(255,255,255,.04) 33%,rgba(255,255,255,.26) 36.5%,rgba(255,255,255,.07) 39%,transparent 43%,transparent 61%,rgba(255,255,255,.10) 63.5%,transparent 66%),
    radial-gradient(55% 28% at 6% 0%,rgba(255,255,255,.20),transparent 70%);
  background-size:240% 240%,100% 100%;
  background-position:calc(38% + var(--sx)*12%) calc(38% + var(--sy)*8%),0 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 1px 0 0 rgba(255,255,255,.22);
  transition:background-position 600ms var(--ease)}
.device{box-shadow:0 0 0 1px #6b7078 inset,0 0 0 2px #0b0c0e inset,inset 2px 2px 1px rgba(255,255,255,.28),inset -1px -1px 1px rgba(255,255,255,.12),0 40px 80px rgba(20,35,55,.35),0 12px 24px rgba(20,35,55,.25)}
.static-motion .glass{transition:none}
/* Gloss strength follows the surface: vivid over imagery, faint over reading surfaces. */
.glass{opacity:1;transition:background-position 600ms var(--ease),opacity var(--t-slow) var(--ease)}
.screen[data-view=rose] .glass,.screen[data-view=agents] .glass,.screen[data-view=app] .glass,.screen[data-view=window] .glass{opacity:.4}
.screen[data-view=home] .glass,.screen.locked .glass{filter:brightness(1.35)}

/* ---------- Second-pass fixes ---------- */
.rose-fly{position:absolute;left:0;top:0;z-index:42;pointer-events:none;transform-origin:center}
.rose-fly canvas,.rose-fly .rose-fallback{position:absolute;inset:0;width:100%!important;height:100%!important;transform:none!important}
.home-date{top:140px}
.screen[data-view=rose] .notices{left:auto;right:var(--margin);width:auto;max-width:calc(100% - 132px)}
.screen[data-view=rose] .notice{white-space:nowrap}
.screen[data-view=rose] .notice small{display:none}
.wcard .wstate{font-size:11.5px}
.wcard.small .c-browser p{display:none}
.wcard.small .c-browser h4{font-size:1.1em}
.detail:has(.choice) .detail-frame{height:290px}
.detail{padding-bottom:64px}
.sw-human:focus-visible,.sw-agent:focus-visible{outline-offset:-6px;border-radius:26px}

/* ---------- Plan-reference materials: brushed aluminium tray, raised glass domes, clear glass tiles ---------- */
.tray{border-radius:18px;height:96px;
  background:linear-gradient(100deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.22) 42%,rgba(255,255,255,0) 64%),
    var(--brush),
    linear-gradient(180deg,#eceef1 0%,#dcdfe3 48%,#d3d7dc 52%,#e2e5e8 100%);
  background-size:100% 100%,240px 120px,100% 100%;background-blend-mode:normal,overlay,normal;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -2px 0 rgba(95,105,120,.35),inset 1.5px 0 0 rgba(255,255,255,.55),inset -1.5px 0 0 rgba(120,130,145,.3),
    0 0 0 1px rgba(70,85,105,.5),0 14px 26px rgba(10,28,55,.32),0 3px 6px rgba(10,28,55,.22)}
.well{width:110px;height:74px;border-radius:50%;color:#273246;
  background:
    radial-gradient(42% 30% at 70% 86%,rgba(255,236,214,.55),rgba(255,236,214,0) 70%),
    radial-gradient(80% 70% at 50% 40%,rgba(255,255,255,.10),rgba(255,255,255,.28) 72%,rgba(255,255,255,.6) 96%),
    rgba(232,238,245,.22);
  -webkit-backdrop-filter:blur(1.2px) brightness(1.07);backdrop-filter:blur(1.2px) brightness(1.07);
  box-shadow:inset 0 0 0 1.4px rgba(255,255,255,.95),inset 0 0 0 2.6px rgba(150,185,230,.38),inset 0 -7px 10px -2px rgba(255,255,255,.65),inset 0 8px 12px -6px rgba(90,110,140,.28),
    0 0 0 1px rgba(80,98,124,.45),3px 7px 9px rgba(25,40,65,.30),1px 2px 2px rgba(25,40,65,.22)}
.well::before{content:'';position:absolute;inset:-1px;border-radius:50%;padding:2px;pointer-events:none;
  background:conic-gradient(from 210deg,rgba(255,255,255,.95),rgba(140,185,255,.9) 18%,rgba(255,255,255,.95) 34%,rgba(255,200,160,.75) 52%,rgba(255,255,255,.9) 66%,rgba(150,190,255,.85) 84%,rgba(255,255,255,.95));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.85}
.well::after{left:13%;right:13%;top:6%;height:40%;border-radius:50%/60% 60% 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.35) 55%,rgba(255,255,255,0));z-index:2}
.well:active,.well.pressed{transform:translateY(1.5px) scale(.97);box-shadow:inset 0 0 0 1.4px rgba(255,255,255,.95),inset 0 0 0 2.6px rgba(150,185,230,.38),inset 0 -5px 8px -2px rgba(255,255,255,.55),inset 0 10px 14px -6px rgba(90,110,140,.36),0 0 0 1px rgba(80,98,124,.45),1px 3px 4px rgba(25,40,65,.28)}
.well.selected{box-shadow:inset 0 0 0 1.4px rgba(255,255,255,.95),inset 0 0 0 2.6px rgba(90,150,255,.55),inset 0 -7px 10px -2px rgba(255,255,255,.65),0 0 0 1px rgba(70,130,240,.75),0 0 18px rgba(80,140,255,.6),3px 7px 9px rgba(25,40,65,.28)}
.tray:not(.two) .well{width:96px;height:70px}
.well svg{width:30px;height:30px;filter:drop-shadow(0 1.5px 1px rgba(20,30,50,.3))}
.well svg.solid{width:32px;height:32px}
.well .end svg{color:#d4563f;filter:drop-shadow(0 1.5px 1px rgba(120,40,20,.25))}
.well[data-muted=true]{color:#57627a}
.overview-glyph{gap:5px}
.overview-glyph i{width:12px;height:30px;border-radius:6px;background:linear-gradient(90deg,#d9dfe6,#ffffff 40%,#f2f5f8 60%,#c6ced8);
  box-shadow:inset 0 1px 0 #fff,inset 0 -2px 2px rgba(100,115,140,.3),0 0 0 .8px rgba(110,125,150,.55),1px 3px 3px rgba(25,40,65,.3)}
.overview-glyph i:nth-child(2){height:38px}
.overview-glyph i:last-child{height:30px;background:linear-gradient(90deg,#2a62d6,#5c9bff 40%,#4a8af7 62%,#1d55c9);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -2px 2px rgba(10,40,120,.35),0 0 0 .8px rgba(20,70,190,.7),1px 3px 3px rgba(20,50,120,.35)}
/* Clear glass app tiles with a thick bright rim. */
.tile{width:66px;height:66px;border-radius:17px;
  background:linear-gradient(155deg,rgba(255,255,255,.34),rgba(255,255,255,.08) 42%,rgba(255,255,255,.05) 60%,rgba(255,255,255,.2));
  -webkit-backdrop-filter:blur(3px) brightness(1.1) saturate(1.15);backdrop-filter:blur(3px) brightness(1.1) saturate(1.15);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.78),inset 0 2px 0 rgba(255,255,255,.9),inset 0 -4px 7px -2px rgba(255,255,255,.45),inset 4px 4px 8px -4px rgba(255,255,255,.4),
    0 0 0 .6px rgba(30,60,100,.45),2px 7px 12px rgba(8,25,55,.30)}
.tile::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:linear-gradient(140deg,#fff,rgba(255,255,255,.2) 35%,rgba(255,255,255,.1) 60%,rgba(255,255,255,.75));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.tile::after{inset:2px 2px 55% 2px;background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0))}

<script>// Rose HiFi — pure state model. No DOM access; exercised directly by verify.cjs.
// Axes that must stay independent: connection, microphone mute, Rose speech,
// background tasks and navigation. Only explicit task events change tasks.
'use strict';

const APPS = {
  firefox: { name: 'Firefox', kind: 'browser' },
  thunderbird: { name: 'Thunderbird', kind: 'mail' },
  vlc: { name: 'VLC', kind: 'media' },
  camera: { name: 'Camera', kind: 'camera' },
  settings: { name: 'Settings', kind: 'settings' },
  photos: { name: 'Photos', kind: 'photos' },
  maps: { name: 'Maps', kind: 'maps' },
  notes: { name: 'Notes', kind: 'notes' },
  calendar: { name: 'Calendar', kind: 'calendar' },
  files: { name: 'Files', kind: 'files' },
  clock: { name: 'Clock', kind: 'clock' },
  weather: { name: 'Weather', kind: 'weather' },
  messages: { name: 'Messages', kind: 'messages' },
  music: { name: 'Music', kind: 'music' },
  calculator: { name: 'Calculator', kind: 'calculator' },
  contacts: { name: 'Contacts', kind: 'contacts' },
  editor: { name: 'Editor', kind: 'editor' },
  phone: { name: 'Phone', kind: 'phone' },
};

const HOME_PAGES = [
  ['vlc', 'camera', 'settings', 'firefox', 'thunderbird'],
  ['firefox', 'thunderbird', 'vlc', 'camera', 'settings', 'photos', 'maps', 'notes',
    'calendar', 'files', 'clock', 'weather', 'messages', 'music', 'calculator', 'contacts',
    'editor', 'phone'],
  ['photos', 'maps', 'notes', 'calendar'],
];

// One task can use several windows; eight windows are not eight tasks.
const TASKS = {
  saturday: { title: 'Plan a quiet Saturday', windows: ['w-browser', 'w-maps', 'w-notes', 'w-calendar'] },
  reply: { title: 'Draft a reply to Jamie', windows: ['w-mail', 'w-files'] },
  compare: { title: 'Compare two cafés', windows: ['w-research', 'w-editor'] },
};

const WINDOWS = {
  'w-browser': { app: 'firefox', task: 'saturday', label: 'Garden hours' },
  'w-maps': { app: 'maps', task: 'saturday', label: 'Walking route' },
  'w-notes': { app: 'notes', task: 'saturday', label: 'Saturday list' },
  'w-calendar': { app: 'calendar', task: 'saturday', label: 'Saturday' },
  'w-mail': { app: 'thunderbird', task: 'reply', label: 'Reply to Jamie' },
  'w-files': { app: 'files', task: 'reply', label: 'Weekend notes' },
  'w-research': { app: 'firefox', task: 'compare', label: 'Café reviews' },
  'w-editor': { app: 'editor', task: 'compare', label: 'Comparison' },
};
const WINDOW_ORDER = Object.keys(WINDOWS);

const STOPPABLE = ['running', 'attention'];
const CONVERSATION_CUES = ['Connected', 'Muted', 'Unmuted', 'Call ended'];
const MAX_STEP = 8;

function initialState() {
  const tasks = {};
  for (const id of Object.keys(TASKS)) tasks[id] = { state: 'idle', step: 0 };
  return {
    layout: 'folded',
    view: 'home',            // home | rose | switcher | agents | app | window
    back: [],                // navigation stack of {view, app, window}
    homePage: 0,
    app: null,
    window: null,
    connection: 'disconnected', // disconnected | connecting | connected
    muted: false,
    speaking: false,
    result: null,            // id of formatted result shown in Rose
    tasks,
    pendingStop: null,
    locked: false,
    notices: [],             // {id, kind:'cue'|'task', text, task?}
    noticeSerial: 0,
    humanCarousel: 0,
    agentCarousel: 0,
    recentApps: ['photos', 'firefox', 'camera'],
  };
}

const clone = (s) => JSON.parse(JSON.stringify(s));

function voiceSurround(s) {
  if (s.connection !== 'connected') return 'quiet';
  if (s.speaking) return 'speaking';
  return s.muted ? 'quiet' : 'listening';
}

// Exact WebGL mapping from prototypes/rose-three-dimensions (README):
// mic on → rose metal, muted → silver; connected joined, connecting narrow gap,
// disconnected wide gap; surround quiet / listening close / speaking broad.
function rendererSignals(s) {
  return {
    mic: s.muted ? 0 : 1,
    connection: s.connection,
    voice: voiceSurround(s),
  };
}

function taskActivity(s) {
  const active = [];
  for (const [id, t] of Object.entries(s.tasks)) if (t.state === 'running') active.push(id);
  return active;
}

function transition(previous, event) {
  const s = clone(previous);
  const effects = [];
  const notice = (kind, text, task) => {
    if (kind === 'cue' && !CONVERSATION_CUES.includes(text)) throw new Error('Unapproved conversation cue: ' + text);
    s.noticeSerial += 1;
    s.notices = s.notices.filter((n) => n.kind !== kind || kind === 'task').concat({ id: s.noticeSerial, kind, text, task: task || null });
    if (s.notices.length > 3) s.notices = s.notices.slice(-3);
    effects.push({ type: 'notice', id: s.noticeSerial, kind, text });
  };
  const go = (view, extra) => {
    if (s.view !== view || (extra && (extra.app !== s.app || extra.window !== s.window))) {

    { sky: ['#9cc9f2', '#e6f2fb'], far: '#8fb3a0', mid: '#5f9a5c', near: '#3f7b42', water: false, path: true, flowers: '#ef8fb0', trees: [[18, 46, 9], [80, 44, 11]] },
    { sky: ['#a9d1f4', '#eef6fc'], far: '#9db9ab', mid: '#6aa25f', near: '#4b8a4a', water: true, path: false, flowers: null, trees: [[12, 42, 8], [30, 44, 6], [88, 41, 10]] },
    { sky: ['#b3d6f2', '#f3f8fc'], far: '#a5bfb0', mid: '#6f9f63', near: '#3e7342', water: false, path: true, flowers: '#b391e3', trees: [[50, 38, 14]] },
    { sky: ['#8fc0ec', '#e3f0fa'], far: '#93b4a6', mid: '#5b955a', near: '#447f46', water: true, path: false, flowers: '#f3c25d', trees: [[70, 43, 9], [86, 45, 7]] },
    { sky: ['#a2cdf3', '#eaf4fb'], far: '#9ab8a5', mid: '#64a05e', near: '#3a7440', water: false, path: false, flowers: '#ec7a8f', trees: [[20, 40, 12], [62, 44, 8]] },
    { sky: ['#b8d9f3', '#f5f9fd'], far: '#a7c1b2', mid: '#73a668', near: '#4a8549', water: true, path: true, flowers: null, trees: [[8, 44, 7], [92, 42, 9]] },
  ];
  function landscape(i) {
    const s = SCENES[i % SCENES.length], id = 'g' + i;
    let svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 75" preserveAspectRatio="xMidYMid slice">' +
      '<defs><linearGradient id="' + id + 's" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + s.sky[0] + '"/><stop offset="1" stop-color="' + s.sky[1] + '"/></linearGradient>' +
      '<linearGradient id="' + id + 'n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + s.mid + '"/><stop offset="1" stop-color="' + s.near + '"/></linearGradient></defs>' +
      '<rect width="100" height="75" fill="url(#' + id + 's)"/>' +
      '<ellipse cx="30" cy="14" rx="14" ry="3.2" fill="#fff" opacity=".7"/><ellipse cx="74" cy="10" rx="10" ry="2.4" fill="#fff" opacity=".55"/>' +
      '<path d="M0 40 C18 31 32 35 50 33 S82 29 100 36 V75 H0Z" fill="' + s.far + '" opacity=".85"/>' +
      '<path d="M0 46 C20 40 40 44 60 42 S88 40 100 44 V75 H0Z" fill="url(#' + id + 'n)"/>';
    for (const [x, y, r] of s.trees) svg += '<ellipse cx="' + x + '" cy="' + (y - r * 0.6) + '" rx="' + r * 0.62 + '" ry="' + r + '" fill="#2f5e35"/><ellipse cx="' + (x - r * 0.18) + '" cy="' + (y - r * 0.9) + '" rx="' + r * 0.3 + '" ry="' + r * 0.5 + '" fill="#4e8a4f" opacity=".7"/>';
    if (s.water) svg += '<path d="M-5 58 C25 50 45 62 70 54 S100 52 105 55 V64 C80 60 60 70 35 64 S5 66 -5 66Z" fill="#8cc3ea"/><path d="M10 58 C25 55 40 60 55 57" stroke="#fff" stroke-width=".6" opacity=".6" fill="none"/>';
    if (s.path) svg += '<path d="M44 75 C48 64 54 56 62 48 L64 48 C60 57 58 66 60 75Z" fill="#d8c6a2"/>';
    if (s.flowers) for (let k = 0; k < 26; k++) { const fx = (k * 37 + i * 11) % 100, fy = 60 + ((k * 23 + i * 7) % 14); svg += '<circle cx="' + fx + '" cy="' + fy + '" r="' + (0.9 + (k % 3) * 0.35) + '" fill="' + s.flowers + '" opacity=".9"/>'; }
    svg += '</svg>';
    return "url('data:image/svg+xml," + encodeURIComponent(svg) + "') center/cover";
  }
  const PHOTO = SCENES.map((_, i) => landscape(i));
  const photo = (i, cls) => '<i class="ph ' + (cls || '') + '" style="background:' + PHOTO[i % PHOTO.length] + '"></i>';
  function typed(text, step, per) { return esc(text.slice(0, Math.max(0, Math.min(text.length, step * per)))); }

  function content(kind, step, opts) {
    const live = opts && opts.live;
    const caret = live ? '<b class="caret" aria-hidden="true"></b>' : '';
    switch (kind) {
      case 'browser': {
        const q = 'botanic garden opening hours';
        return '<div class="c-browser"><div class="url">' + (step ? typed(q, step, 6) + caret : 'Search or enter address') + '</div>' +
          photo(0, 'hero') + '<h4>' + (step < 3 ? 'Search' : 'Botanic Garden') + '</h4>' +
          (step >= 3 ? '<p>Open daily · 9:00 – 17:00</p>' : '') + (step >= 5 ? '<p>Rose garden · lakeside path</p>' : '') +
          (live && step < 8 ? '<span class="pointer" style="left:' + (30 + (step % 3) * 18) + '%;top:' + (54 + (step % 2) * 14) + '%"></span>' : '') + '</div>';
      }
      case 'maps': {
        const dash = Math.max(0, 1 - step / 8);
        // Portrait-authored map so the destination pin survives every window crop.
        return '<div class="c-maps"><svg viewBox="0 0 120 150" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect x="-200" y="-200" width="520" height="550" fill="#eef2ea"/>' +
          '<path d="M-200 40h520M-200 92h520M-200 128h520M-40 -200v550M24 -200v550M70 -200v550M104 -200v550M150 -200v550" stroke="#dde3d8" stroke-width="3.2"/>' +
          '<path d="M-200 170C-80 150 -20 130 10 116C28 104 32 92 44 78s40-30 50-46 30-40 60-46 80-20 160-30" stroke="#9cc6ef" stroke-width="15" fill="none"/>' +
          '<rect x="76" y="100" width="30" height="24" rx="5" fill="#cfe5c4"/><rect x="8" y="16" width="26" height="18" rx="4" fill="#cfe5c4"/>' +
          '<path class="route" d="M30 132C38 120 46 112 56 104s14-22 22-36 8-24 12-32" pathLength="1" stroke="#2f6be6" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0.04 0.03" fill="none" style="opacity:' + (step ? 1 : 0) + ';clip-path:inset(' + (dash * 100).toFixed(0) + '% 0 0 0)"/>' +
          '<circle cx="30" cy="132" r="5" fill="#2f6be6" stroke="#fff" stroke-width="2"/>' +
          '<path d="M90 22a7 7 0 0 1 7 7c0 5-7 12-7 12s-7-7-7-12a7 7 0 0 1 7-7z" fill="#e5533e"/><circle cx="90" cy="29" r="2.4" fill="#fff"/></svg>' +
          '<span class="pill">' + (step >= 4 ? '12 min walk' : 'Finding route') + '</span></div>';
      }
      case 'notes': {
        const lines = ['Garden at 9:00', 'Riverside walk', 'Bring a book', 'Leave the afternoon open'];
        return '<div class="c-notes"><h4>Saturday</h4>' + lines.map((l, i) => '<p><i class="box"></i>' + typed(l, step - i * 1.5, 7) + (live && Math.floor(step - i * 1.5) > 0 && step - i * 1.5 < 4 ? caret : '') + '</p>').join('') + '</div>';
      }
      case 'calendar': {
        const blocks = [[1, 1, 2, '#c9dbff'], [2, 3, 1, '#d4f0d8'], [1, 4, 2, '#c9dbff'], [3, 2, 1, '#fde7b0'], [2, 5, 1, '#d4f0d8']];
        return '<div class="c-cal"><div class="cal-head"><b>Sat 31</b><span>Oct</span></div><div class="cal-grid">' +
          blocks.slice(0, Math.min(blocks.length, Math.ceil(step / 1.6))).map((b) => '<i style="grid-column:' + (b[0] + 1) + ';grid-row:' + b[1] + ' / span ' + b[2] + ';background:' + b[3] + '"></i>').join('') + '</div></div>';
      }
      case 'mail': {
        const body = 'Hi Jamie — Saturday works for me. Shall we meet at the garden gate at ten? We could walk along the river after.';
        return '<div class="c-mail"><p class="to"><span>To</span> Jamie</p><p class="subj">Re: Saturday</p><p class="body">' + typed(body, step, 15) + caret + '</p><span class="pill">Draft · not sent</span></div>';
      }
      case 'files': {
        const f = ['Weekend ideas.md', 'Places.md', 'Garden map.pdf', 'Café notes.md'];
        return '<div class="c-files">' + f.map((n, i) => '<p class="' + (i < Math.ceil(step / 2) ? 'hit' : '') + '"><i></i>' + esc(n) + '</p>').join('') + '</div>';
      }
      case 'editor': {
        const code = ['const cafes = [', '  { name: "Fern House", seats: 40 },', '  { name: "Harbor Cup", seats: 18 },', '];', 'quietest(cafes) // Fern House'];
        return '<div class="c-editor">' + code.map((l, i) => '<p>' + typed(l, step - i, 12) + '</p>').join('') + caret + '</div>';
      }
      case 'photos': return '<div class="c-photos">' + [0, 1, 2, 3, 4, 5].map((i) => photo(i)).join('') + '</div>';
      case 'camera': return '<div class="c-camera"><i class="vf"></i><span class="shutter"></span></div>';
      case 'settings': return '<div class="c-list">' + ['Network & internet', 'Connected devices', 'Display', 'Sound & vibration', 'Privacy', 'Rose'].map((x) => '<p>' + x + '<span>›</span></p>').join('') + '</div>';
      case 'clock': return '<div class="c-big"><b>9:41</b><span>Thursday, October 29</span></div>';
      case 'weather': return '<div class="c-big"><b>18°</b><span>Clear · light wind</span></div>';
      case 'messages': return '<div class="c-msg"><p class="in">Saturday still good?</p><p class="out">Yes — garden at ten?</p><p class="in">Perfect.</p></div>';
      case 'music': return '<div class="c-music">' + photo(4, 'art') + '<b>Morning Walk</b><span>Quiet Tracks</span></div>';
      case 'calculator': return '<div class="c-big"><b>42</b><span>6 × 7</span></div>';
      case 'contacts': return '<div class="c-list">' + ['Alex Rivera', 'Jamie Chen', 'Morgan Lee', 'Sam Ortiz'].map((x) => '<p>' + x + '</p>').join('') + '</div>';
      case 'phone': return '<div class="c-list">' + ['Jamie Chen · yesterday', 'Morgan Lee · Tuesday', 'Garden café · Monday'].map((x) => '<p>' + x + '</p>').join('') + '</div>';
      case 'media': return '<div class="c-music">' + photo(1, 'art') + '<b>Riverside.mp4</b><span>2:14 / 6:30</span></div>';
      default: return '<div class="c-list"><p>Ready</p></div>';
    }
  }
  const kindOf = (appId) => ctx.M.APPS[appId].kind;
  const windowContent = (wid, s, live) => {
    const w = ctx.M.WINDOWS[wid], t = s.tasks[w.task];
    return content(kindOf(w.app), t.state === 'idle' ? 0 : t.step, { live: live && t.state === 'running' && !ctx.reduced() });
  };

  // ---------- Shared pieces ----------
  function stopButton(taskId, s, extra) {
    const t = s.tasks[taskId], title = ctx.M.TASKS[taskId].title;
    const can = ctx.M.STOPPABLE.includes(t.state);
    return '<button class="stop-btn ' + (extra || '') + '" data-stop="' + taskId + '" ' + (can ? '' : 'disabled') + ' aria-label="Stop ' + esc(title) + '">' + ctx.I.UI.stop + '</button>';
  }
  const dot = (state) => '<span class="sdot" data-state="' + state + '" aria-hidden="true"></span>';
  function windowCard(wid, s, cls) {
    const w = ctx.M.WINDOWS[wid], t = s.tasks[w.task], app = ctx.M.APPS[w.app];
    return '<article class="wcard ' + (cls || '') + '" data-window="' + wid + '" data-state="' + t.state + '">' +
      '<button class="wopen" data-open-window="' + wid + '" aria-label="Inspect ' + esc(app.name + ' — ' + w.label + ', ' + ctx.M.TASKS[w.task].title + ', ' + LABEL[t.state]) + '"></button>' +
      '<header><span class="mini-ico">' + ctx.I.appArt(w.app) + '</span><span class="wl">' + esc(w.label) + '</span></header>' +
      '<div class="wbody" aria-hidden="true">' + windowContent(wid, s, true) + '</div>' +
      '<footer>' + dot(t.state) + '<span class="wstate">' + esc(SHORT[t.state]) + '</span>' + stopButton(w.task, s) + '</footer></article>';
  }
  function visibleWindows(s) { return ctx.M.WINDOW_ORDER.filter((wid) => s.tasks[ctx.M.WINDOWS[wid].task].state !== 'idle'); }

  // ---------- Build static scaffolds once ----------
  function build() {
    const { $ } = ctx;
    $('v-switcher').innerHTML =
      '<div class="wall" aria-hidden="true"></div><div class="sw-veil" aria-hidden="true"></div>' +
      '<div class="sw-human" id="sw-human" role="list" aria-label="Your apps" tabindex="0"></div>' +
      '<svg class="links" id="sw-links" aria-hidden="true"><defs><linearGradient id="link-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8fa3"/><stop offset=".45" stop-color="#9fb8ff"/><stop offset="1" stop-color="#5d8dff"/></linearGradient></defs><g id="sw-routes"></g></svg>' +
      '<div class="sw-link"><div class="sw-rose"><span class="sw-halo" aria-hidden="true"></span><div class="rose-slot" id="slot-switcher"></div></div>' +
      '<span class="sw-link-label" id="sw-link-label"></span></div>' +
      '<div class="sw-agent" id="sw-agent" role="list" aria-label="Rose’s background apps" tabindex="0"></div>';
    $('v-agents').innerHTML =
      '<div class="ivory-bg" aria-hidden="true"></div><div class="surface agents-surface"><h2 class="sr">Rose’s apps</h2><div class="agrid" id="agrid"></div><p class="a-empty" id="a-empty">Rose isn’t using any apps right now.</p></div>' +
      '<div class="tray" role="toolbar" aria-label="Rose’s apps controls"><button class="well" id="ag-back" aria-label="Back">' + ctx.I.UI.back + '</button><button class="well" id="ag-mid"></button><span class="well selected" id="ag-self" role="img" aria-label="Rose’s apps, current screen">' + ctx.I.UI.grid + '</span></div>';
    $('v-window').innerHTML = '<div class="ivory-bg" aria-hidden="true"></div><div class="surface detail" id="wdetail"></div>';
    $('v-app').innerHTML = '<div class="ivory-bg" aria-hidden="true"></div><div class="surface detail" id="appdetail"></div>';

    $('ag-back').addEventListener('click', () => ctx.dispatch({ type: 'back' }));
    $('ag-mid').addEventListener('click', () => { const s = ctx.getState(); ctx.dispatch({ type: s.connection === 'disconnected' ? 'openRose' : 'endCall' }); });
    document.addEventListener('click', onClick);
    for (const id of ['sw-human', 'sw-agent']) bindCarousel($(id), id === 'sw-human' ? 'human' : 'agent');
    $('sw-agent').addEventListener('scroll', () => requestAnimationFrame(routeWire), { passive: true });
    $('v-switcher').addEventListener('click', (e) => { if (e.target.classList.contains('sw-veil') || e.target.classList.contains('wall')) ctx.dispatch({ type: 'back' }); });
    built = true;
  }

  function onClick(e) {
    const s = ctx.getState();
    if (s.locked) return;
    const stop = e.target.closest('[data-stop]');
    if (stop && !stop.disabled) { e.stopPropagation(); lastStopButton = stop.dataset.stop; const wc = stop.closest('[data-window]'); lastStopWindow = wc ? wc.dataset.window : null; ctx.dispatch({ type: 'askStop', id: stop.dataset.stop }); return; }
    const w = e.target.closest('[data-open-window]');
    if (w) { ctx.dispatch({ type: 'openWindow', value: w.dataset.openWindow }); return; }
    const h = e.target.closest('[data-open-app]');
    if (h) { ctx.dispatch({ type: 'openApp', value: h.dataset.openApp }); return; }
    if (e.target.closest('[data-back]')) { ctx.dispatch({ type: 'back' }); return; }
    const choose = e.target.closest('[data-choose]');
    if (choose) { ctx.dispatch({ type: 'taskEvent', id: choose.dataset.choose, value: 'resume' }); return; }
    if (e.target.closest('[data-confirm-stop]')) { ctx.dispatch({ type: 'confirmStop' }); return; }
    if (e.target.closest('[data-cancel-stop]')) { ctx.dispatch({ type: 'cancelStop' }); return; }
  }

  // Independent carousels: native scroll + snap; mouse drag; keyboard arrows.
  function bindCarousel(el, which) {
    let drag = null, block = false, raf = 0;
    el.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('.stop-btn')) return; drag = { x: e.clientX, left: el.scrollLeft, id: e.pointerId, moved: false }; });
    el.addEventListener('pointermove', (e) => {
      if (!drag) return; const dx = e.clientX - drag.x;
      if (!drag.moved && Math.abs(dx) > 6) { drag.moved = true; block = true; el.setPointerCapture(drag.id); el.classList.add('dragging'); }
      if (drag.moved) el.scrollLeft = drag.left - dx;
    });
    const end = () => { if (!drag) return; const moved = drag.moved; drag = null; el.classList.remove('dragging'); if (moved) snap(el); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('click', (e) => { if (block) { e.stopPropagation(); e.preventDefault(); block = false; } }, true);
    el.addEventListener('keydown', (e) => {
      if (e.target !== el || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
      e.preventDefault(); step(el, e.key === 'ArrowRight' ? 1 : -1);
    });
    el.addEventListener('scroll', () => {
      if (!raf) raf = requestAnimationFrame(() => { raf = 0; depth(el); const i = centerIndex(el); const s = ctx.getState(); const key = which === 'agent' ? 'agentCarousel' : 'humanCarousel'; if (i !== s[key]) ctx.dispatch({ type: 'carousel', which, value: i }); });
    }, { passive: true });
  }
  const cards = (el) => [...el.children].filter((c) => !c.hidden);
  // Human cards snap to the centre; agent cards snap to the leading edge.
  const startAligned = (el) => el.classList.contains('sw-agent');
  function anchor(el, card) {
    if (startAligned(el)) return card.offsetLeft - parseFloat(getComputedStyle(el).paddingLeft);
    return card.offsetLeft + card.offsetWidth / 2 - el.clientWidth / 2;
  }
  function centerIndex(el) {
    let best = 0, d = Infinity;
    cards(el).forEach((card, i) => { const m = Math.abs(anchor(el, card) - el.scrollLeft); if (m < d) { d = m; best = i; } });
    return best;
  }
  function scrollToIndex(el, i, instant) {
    const card = cards(el)[i]; if (!card) return;
    el.scrollTo({ left: anchor(el, card), behavior: instant || ctx.reduced() ? 'instant' : 'smooth' });
  }
  function step(el, dir) { scrollToIndex(el, Math.max(0, Math.min(cards(el).length - 1, centerIndex(el) + dir))); }
  function snap(el) { scrollToIndex(el, centerIndex(el)); }
  // Side cards turn away slightly, like the reference; transform-only for performance.
  function depth(el) {
    if (!el.classList.contains('sw-human')) return;
    const c = el.scrollLeft + el.clientWidth / 2;
    for (const card of cards(el)) {
      const off = (card.offsetLeft + card.offsetWidth / 2 - c) / card.offsetWidth;
      const k = Math.max(-1.4, Math.min(1.4, off));
      card.style.transform = ctx.reduced() ? '' : 'perspective(900px) rotateY(' + (-k * 22).toFixed(1) + 'deg) scale(' + (1 - Math.min(1, Math.abs(k)) * 0.12).toFixed(3) + ')';
      card.style.zIndex = String(10 - Math.round(Math.abs(k) * 4));
    }
  }

  // Connector: one route from Rose to every visible working card. Light packets flow
  // along each route (CSS dash animation, no JS loop) and a ring pulses where it lands.
  // Nothing moves unless a task is actually running.
  let lastRouteKey = '';
  function routeWire() {
    const { $ } = ctx;
    const view = $('v-switcher'), svg = $('sw-links'), g = $('sw-routes');
    if (!svg || !view.isConnected || view.dataset.active !== 'true') return;
    const vr = view.getBoundingClientRect();
    if (!vr.width) return;
    const k = vr.width / view.offsetWidth;
    const W = view.offsetWidth, H = view.offsetHeight;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    const rr = view.querySelector('.sw-rose').getBoundingClientRect(), ar = $('sw-agent').getBoundingClientRect();
    const ox = (rr.right - vr.left) / k - 10, oy = (rr.top + rr.height / 2 - vr.top) / k;
    const cards = [...$('sw-agent').querySelectorAll('.wcard[data-state=running]')].map((c) => c.getBoundingClientRect())
      .filter((r) => r.right > ar.left + 12 && r.left < ar.right - 12).slice(0, 3);
    const pts = cards.map((r) => ({ x: (Math.max(ar.left + 20, Math.min(ar.right - 20, r.left + r.width / 2)) - vr.left) / k, y: (r.top - vr.top) / k + 1 }));
    const key = pts.map((p) => p.x.toFixed(0) + ',' + p.y.toFixed(0)).join('|') + W;
    if (key === lastRouteKey) return;
    lastRouteKey = key;
    const grad = $('link-grad'); grad.setAttribute('x1', ox); grad.setAttribute('x2', W - 20);
    if (!pts.length) { g.innerHTML = '<path class="track idle" d="M' + ox + ' ' + oy + 'h48"/>'; return; }
    g.innerHTML = pts.map((p, i) => {
      // Horizontal run out of Rose, then a smooth bend down onto the card.
      const bend = Math.max(ox + 30, p.x - 34);
      const d = 'M' + ox.toFixed(1) + ' ' + oy.toFixed(1) + 'H' + bend.toFixed(1) + 'C' + (bend + 26).toFixed(1) + ' ' + oy.toFixed(1) + ' ' + p.x.toFixed(1) + ' ' + (oy + 8).toFixed(1) + ' ' + p.x.toFixed(1) + ' ' + p.y.toFixed(1);
      const delay = (-i * 0.37).toFixed(2) + 's';
      return '<path class="track" d="' + d + '"/>' +
        '<path class="glow" pathLength="100" style="animation-delay:' + delay + '" d="' + d + '"/>' +
        '<path class="pulse" pathLength="100" style="animation-delay:' + delay + '" d="' + d + '"/>' +
        '<path class="comet" pathLength="100" style="animation-delay:' + (-i * 0.6).toFixed(2) + 's" d="' + d + '"/>' +
        '<circle class="land" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="5"/><circle class="land-ring" style="animation-delay:' + delay + '" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="5"/>';
    }).join('');
  }
  window.addEventListener('resize', () => { lastRouteKey = ''; });

  // ---------- Renderers ----------
  let lastStopWindow = null, lastViewSeen = 'home';
  let lastHumanKey = '', lastAgentKey = '', lastGridKey = '', lastWindowKey = '', lastAppKey = '', lastStopButton = null, lastSheet = null;
  function renderSwitcher(s) {
    const { $ } = ctx;
    const hk = s.recentApps.join(',');
    const human = $('sw-human');
    if (hk !== lastHumanKey) {
      lastHumanKey = hk;
      human.innerHTML = s.recentApps.map((id) => '<div class="hcard" role="listitem"><button class="hopen" data-open-app="' + id + '" aria-label="Open ' + esc(ctx.M.APPS[id].name) + '"></button><header><span class="mini-ico">' + ctx.I.appArt(id) + '</span><span>' + esc(ctx.M.APPS[id].name) + '</span></header><div class="hbody" aria-hidden="true">' + content(kindOf(id), 8) + '</div></div>').join('');
      requestAnimationFrame(() => { scrollToIndex(human, Math.min(s.humanCarousel, s.recentApps.length - 1), true); depth(human); });
    }
    const vis = visibleWindows(s);
    const agent = $('sw-agent');
    const ak = vis.map((w) => w + ':' + s.tasks[ctx.M.WINDOWS[w].task].state + ':' + s.tasks[ctx.M.WINDOWS[w].task].step).join('|') + ctx.reduced();
    if (ak !== lastAgentKey) {

      el.hidden = !visible.has(n.id);
      host.appendChild(el); shownNotices.set(n.id, el);
      $('announcer').textContent = n.text;
      const dismiss = () => { if (el.matches(':hover,:focus-within')) later(dismiss, 1200); else dispatch({ type: 'dismissNotice', value: n.id }); };
      later(dismiss, n.kind === 'task' ? (/needs/.test(n.text) ? 6000 : 4200) : 2200);
    }
  }

  // ---------- Render ----------
  let wasLocked = false;
  function render() {
    if (shownView !== state.view) rememberFocus(shownView);
    device.classList.toggle('unfolded', state.layout === 'unfolded');
    document.documentElement.style.setProperty('--screen-w', state.layout === 'unfolded' ? '748px' : '384px');
    screen.classList.toggle('static-motion', reduced());
    showView(state.view);

    // Home
    $('home-track').style.transform = 'translateX(' + (-state.homePage * 100) + '%)';
    [...$('home-track').children].forEach((p, i) => { p.inert = i !== state.homePage; p.setAttribute('aria-hidden', String(i !== state.homePage)); });
    [...$('page-dots').children].forEach((d, i) => d.setAttribute('aria-current', String(i === state.homePage)));
    const callLive = state.connection !== 'disconnected';
    $('tray-rose').setAttribute('aria-label', callLive ? 'Return to Rose call' : 'Open Rose');

    // Rose
    const mic = $('rose-mic');
    mic.innerHTML = state.muted ? I.UI.micOff : I.UI.mic;
    mic.dataset.muted = String(state.muted);
    mic.setAttribute('aria-pressed', String(state.muted));
    mic.setAttribute('aria-label', 'Mute microphone');
    mic.disabled = state.connection !== 'connected';
    $('rose-end').innerHTML = '<span class="end">' + I.UI.end + '</span>';
    $('rose-end').disabled = !callLive;
    $('rose-agents').innerHTML = I.UI.grid;
    const caption = state.connection === 'connecting' ? 'Connecting…' : state.connection === 'connected' ? (state.speaking ? 'Rose speaking' : state.muted ? 'Microphone muted' : 'Listening') : '';
    $('rose-caption').textContent = caption;
    renderResult();
    renderNotices();

    // Lock
    $('lock').hidden = !state.locked;
    screen.classList.toggle('locked', state.locked);
    $('home-bar').inert = state.locked || !!state.pendingStop;
    $('notices').inert = state.locked || !!state.pendingStop;
    $('phone-views') && ($('phone-views').inert = state.locked);
    for (const v of ['home', 'rose', 'switcher', 'agents', 'app', 'window']) viewEl(v).inert = state.locked || !!state.pendingStop;

    // Renderer signals
    const sig = M.rendererSignals(state);
    renderer.setSignals(Object.assign(sig, { energy: 0.6 }));
    renderer.setReduced(reduced());

    // Harness
    $('h-folded').setAttribute('aria-pressed', String(state.layout === 'folded'));
    $('h-unfolded').setAttribute('aria-pressed', String(state.layout === 'unfolded'));
    $('h-lock').textContent = state.locked ? 'Unlock' : 'Lock';
    $('h-speak').disabled = state.connection !== 'connected';
    $('h-result').disabled = state.connection !== 'connected';
    $('h-tasklist').innerHTML = Object.entries(state.tasks).map(([id, t]) => '<div><span>' + M.TASKS[id].title + '</span><span>' + t.state + (t.state === 'running' ? ' · ' + t.step + '/' + M.MAX_STEP : '') + '</span></div>').join('');
    if (window.RoseViews) window.RoseViews.render(state, ctx);
    fit();
    if (pendingFocus) requestAnimationFrame(applyFocus);
    // Unlocking with a confirmation open returns focus to it.
    if (wasLocked && !state.locked && state.pendingStop) requestAnimationFrame(() => { const c = $('sheet-cancel'); if (c) c.focus({ preventScroll: true }); });
    if (!wasLocked && state.locked) requestAnimationFrame(() => $('unlock').focus({ preventScroll: true }));
    wasLocked = state.locked;
  }

  function updateRenderStatus() {
    const st = renderer.status();
    const f = st.frames.slice().sort((a, b) => a - b);
    const med = f.length > 20 ? f[Math.floor(f.length / 2)].toFixed(1) + ' ms' : '—';
    const p95 = f.length > 20 ? f[Math.floor(f.length * 0.95)].toFixed(1) + ' ms' : '—';
    const name = st.renderer ? st.renderer.replace(/^ANGLE \(/, '').replace(/\)$/, '').split(',').slice(0, 2).join(',') : '—';
    $('h-render').innerHTML = '<b>' + ({ webgl: 'WebGL live', 'static-forced': 'Static fallback (forced)', 'static-context-lost': 'Static fallback · context lost', 'static-unavailable': 'Static fallback · WebGL unavailable', starting: 'Starting' }[st.mode]) + '</b><br>' +
      'Renderer: ' + name + '<br>Canvas ' + st.canvas.width + '×' + st.canvas.height + ' · DPR ' + (window.devicePixelRatio || 1) + '<br>Frame interval median ' + med + ' · p95 ' + p95 + '<br><span>rAF timing, not GPU time or device proof.</span>';
  }
  setInterval(updateRenderStatus, 1000);

  // ---------- Effects & dispatch ----------
  let connectTimer, speechTimer, greetTimer;
  function dispatch(event) {
    const before = state;
    const out = M.transition(state, event);
    state = out.state;
    for (const fx of out.effects) {
      if (fx.type === 'connect') { cancel(connectTimer); connectTimer = later(() => dispatch({ type: 'connected' }), 1100); }
      if (fx.type === 'speech') { cancel(speechTimer); speechTimer = later(() => dispatch({ type: 'speechEnd' }), fx.ms); }
      if (fx.type === 'endVoice') { cancel(connectTimer); cancel(speechTimer); cancel(greetTimer); }
      if (fx.type === 'stopAck') later(() => dispatch({ type: 'stopAck', id: fx.id }), 1600);
      if (fx.type === 'reset') { epoch++; for (const t of timers) clearTimeout(t); timers.clear(); transitionToken++; settleViews(['home']); shownView = 'home'; viewEl('home').dataset.active = 'true'; screen.dataset.view = 'home'; flyRose($('slot-tray')); startClock(); }
    }
    // Task status announcements (not conversation cues).
    for (const id of Object.keys(state.tasks)) {
      const a = before.tasks[id].state, b = state.tasks[id].state;
      if (a === b) continue;
      const words = { stopping: 'stopping', stopped: 'stopped', running: a === 'attention' ? 'working again' : a === 'idle' ? 'started' : '' }[b];
      if (words) $('announcer').textContent = M.TASKS[id].title + ': ' + words + '.';
    }
    // First connection with an empty output: Rose answers with a formatted result.
    if (before.connection === 'connecting' && state.connection === 'connected' && !state.result) {
      cancel(greetTimer);
      greetTimer = later(() => { dispatch({ type: 'speak', ms: 4600 }); later(() => dispatch({ type: 'result', value: 'saturday' }), 700); }, 600);
    }
    render();
    return state;
  }
  function startClock() { later(() => { dispatch({ type: 'tick' }); startClock(); }, 2600); }
  const ctx = { dispatch, $, I, M, reduced, later, getState: () => state };

  // ---------- Events ----------
  document.addEventListener('click', (e) => {
    const app = e.target.closest('.app[data-app]');
    if (app) { dispatch({ type: 'openApp', value: app.dataset.app }); return; }
    const dot = e.target.closest('#page-dots button');
    if (dot) { dispatch({ type: 'homePage', value: +dot.dataset.page }); return; }
  });
  $('tray-rose').addEventListener('click', () => dispatch({ type: 'openRose' }));
  $('tray-overview').addEventListener('click', () => dispatch({ type: 'switcher' }));
  $('rose-mic').addEventListener('click', () => dispatch({ type: 'mute' }));
  $('rose-end').addEventListener('click', () => { dispatch({ type: 'endCall' }); if (state.view === 'home') $('tray-rose').focus({ preventScroll: true }); });
  $('rose-agents').addEventListener('click', () => dispatch({ type: 'agents' }));
  $('home-bar').addEventListener('click', () => dispatch({ type: 'home' }));
  $('unlock').addEventListener('click', () => dispatch({ type: 'unlock' }));
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || state.locked) return;
    if (state.pendingStop) dispatch({ type: 'cancelStop' });
    else if (state.view !== 'home') dispatch({ type: 'back' });
  });

  // Harness
  $('h-folded').onclick = () => dispatch({ type: 'layout', value: 'folded' });
  $('h-unfolded').onclick = () => dispatch({ type: 'layout', value: 'unfolded' });
  $('h-lock').onclick = () => dispatch({ type: state.locked ? 'unlock' : 'lock' });
  $('h-reset').onclick = () => { shownNotices.forEach((el) => el.remove()); shownNotices.clear(); renderedResult = undefined; dispatch({ type: 'reset' }); };
  $('h-speak').onclick = () => dispatch({ type: 'speak', ms: 4200 });
  $('h-result').onclick = () => { const i = RESULT_ORDER.indexOf(state.result); dispatch({ type: 'result', value: RESULT_ORDER[(i + 1) % RESULT_ORDER.length] }); };
  $('h-tasks').onclick = () => { for (const id of Object.keys(M.TASKS)) dispatch({ type: 'startTask', id }); };
  $('h-attn').onclick = () => dispatch({ type: 'taskEvent', id: 'reply', value: 'attention' });
  $('h-done').onclick = () => { const id = Object.keys(state.tasks).find((k) => M.STOPPABLE.includes(state.tasks[k].state)); if (id) dispatch({ type: 'taskEvent', id, value: 'done' }); };
  $('h-reduced').checked = media.matches;
  $('h-reduced').onchange = (e) => { reducedOverride = e.target.checked; render(); };
  media.addEventListener('change', () => { $('h-reduced').checked = media.matches || reducedOverride; render(); });
  $('h-static').onchange = (e) => renderer.setForcedFallback(e.target.checked);
  let lostExt = null;
  $('h-lose').onclick = () => {
    if (!lostExt) { lostExt = renderer.loseContext(); $('h-lose').textContent = lostExt ? 'Restore WebGL context' : 'Context loss unavailable'; }
    else { renderer.restoreContext(lostExt); lostExt = null; $('h-lose').textContent = 'Lose WebGL context'; }
  };

  // Fit device to available stage at ordinary laptop heights.
  function fit() {
    const stage = $('stage'), w = state.layout === 'unfolded' ? 748 : 384;
    const dw = w + 24, dh = 832 + 24;
    let k;
    if (window.innerWidth <= 820) {
      // Narrow screens: fit by width and let the page scroll to the controls below.
      k = Math.min(1, (window.innerWidth - 16) / dw);
      stage.style.height = Math.ceil(dh * k + 16) + 'px';
    } else {
      stage.style.height = '';
      k = Math.min(1, (stage.clientHeight - 32) / dh, (stage.clientWidth - 32) / dw);
    }
    const kk = Math.max(0.3, k).toFixed(4);
    if ($('fit').style.getPropertyValue('--fit') !== kk) { $('fit').style.setProperty('--fit', kk); renderer.refresh(); }
  }
  window.addEventListener('resize', fit);
  // Glass sheen follows the pointer slightly, like light across a real display.
  let sheenRaf = 0;
  $('stage').addEventListener('pointermove', (e) => {
    if (reduced() || sheenRaf) return;
    sheenRaf = requestAnimationFrame(() => {
      sheenRaf = 0;
      const r = device.getBoundingClientRect();
      const x = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - 0.5) * 2));
      const y = Math.max(-1, Math.min(1, ((e.clientY - r.top) / r.height - 0.5) * 2));
      const g = screen.querySelector('.glass'); g.style.setProperty('--sx', x.toFixed(3)); g.style.setProperty('--sy', y.toFixed(3));
    });
  });

  $('rose-stage').addEventListener('transitionend', () => renderer.refresh());
  window.addEventListener('pagehide', (e) => { if (!e.persisted) renderer.destroy(); });
  buildHome(); bindHomeGestures();
  renderer.attach($('slot-tray'));
  render(); startClock();
  window.__rose = { getState: () => state, dispatch, renderer, ctx };
})();
</script>
</body></html>
