self-hosted-runner:
  # Proposed repository-scoped runner on immortal-os-builder (not registered yet).
  labels:
    - roseos-frankel-builder
    # Proposed runtime runner on pixel-os-smoke-20261023-a, group roseos-alpha-runtime (INFRA-ALPHA-120; not registered).
    - roseos-cuttlefish-runtime
    # Dedicated signer runner, group roseos-signing (SIGN-021 .github/workflows/os-sign.yml).
    - roseos-dedicated-signer
    # Replacement-specific runner on the dedicated Yogi VM roseos-yogi-builder-20261105-b (runner 21, registered, disabled).
    - roseos-yogi-builder-20261105-b
paths:
  .github/workflows/os-release.yml:
    ignore:
      # GitHub supports concurrency queue (single|max; docs control-workflow-concurrency, @actions/workflow-parser
      # concurrency-queue); actionlint 1.7.12 does not know the key yet. Only this exact diagnostic is ignored.
      - 'unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"'
  .github/workflows/launcher3-compile.yml:
    ignore:
      # The same concurrency queue key (queue: max), for the harness's own queue; only this exact diagnostic.
      - 'unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"'
