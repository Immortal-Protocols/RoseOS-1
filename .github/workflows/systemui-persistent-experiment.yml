name: SystemUI persistent-app experiment

# OS-COMPONENT-EXP-004: manual-only, disposable emulator experiment with a synthetic persistent fixture
# (os/tests/persistent-app-experiment). EXP005-F1 installs the SDK emulator package first when the image lacks it.
# EXP006: only with the manual systemui input (default false) does it also run the image's own SystemUI stages, and
# report.py writes a bounded stage and cleanup summary. It never touches a phone, a builder or a release. The fixture
# is signed with one job-local test key created in RUNNER_TEMP and removed at the end. No licence is accepted and no
# SELinux or verity setting is changed: unavailable prerequisites are recorded as such. EXP006-KVM-001: only with
# the manual kvm_acl input (default false) does kvm_access.py add one ACL entry giving this job's own non-root user
# read/write on the KVM device, just before the run, and restore the exact original ACL from a trap and the cleanup
# step. A run with it needs the owner's approval of that exact delta. EXP006-STARTUP-003: only with the manual
# startup_diagnostic input (default false, never with systemui) does the run stop after environment, image and the
# first launch and boot wait, and report one fixed startup category from at most the first 16 KiB of its own new
# emulator output, with whether the AVD descriptor existed; no output text is reported or uploaded.
on:
  workflow_dispatch:
    inputs:
      systemui:
        description: 'Also run the opt-in SystemUI stages on the emulator image (EXP006)'
        type: boolean
        default: false
      kvm_acl:
        description: 'Grant this job user rw on the KVM device for the run and restore it (EXP006-KVM-001; approved runs only)'
        type: boolean
        default: false
      startup_diagnostic:
        description: 'Stop after the first emulator launch and report a fixed startup category (EXP006-STARTUP-003; not with systemui)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: systemui-persistent-experiment
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Static and unit checks
        run: |
          python3 os/tests/persistent-app-experiment/test_experiment.py -v
          python3 os/tests/persistent-app-experiment/test_setup_emulator.py -v
          python3 os/tests/persistent-app-experiment/test_report.py -v
          python3 os/tests/persistent-app-experiment/test_kvm_access.py -v
      - name: Build v1 and v2 (job-local test key)
        run: python3 os/tests/persistent-app-experiment/experiment.py build --sdk "$ANDROID_HOME" --work "$RUNNER_TEMP/pfx"
      - name: SDK emulator package (installed sdkmanager, already accepted licences only)
        # EXP005-F1: the runner image lacks emulator/emulator. stdin is closed, so no licence is answered; an
        # unavailable result is recorded and the experiment's environment stage still reports it. EXP006: a library
        # the emulator cannot load (libpulse.so.0 on ubuntu-24.04) comes from its official Ubuntu package, fetched
        # with apt-get download and unpacked under RUNNER_TEMP (no root, nothing installed system-wide).
        id: setup
        continue-on-error: true
        run: python3 os/tests/persistent-app-experiment/setup_emulator.py --sdk "$ANDROID_HOME" --record "$RUNNER_TEMP/pfx-evidence/emulator-setup.json" --library-dir "$RUNNER_TEMP/emulator-libs" --github-env "$GITHUB_ENV"
      - name: Run the experiment
        id: run
        env:
          SYSTEMUI: ${{ inputs.systemui }}
          KVM_ACL: ${{ inputs.kvm_acl }}
          STARTUP_DIAGNOSTIC: ${{ inputs.startup_diagnostic }}
        run: |
          flag=()
          if [ "$SYSTEMUI" = "true" ]; then flag=(--systemui); fi
          if [ "$STARTUP_DIAGNOSTIC" = "true" ]; then
            # Refused before any KVM grant or launch: the diagnostic never runs the SystemUI stages.
            if [ "$SYSTEMUI" = "true" ]; then echo "::error title=startup diagnostic::not with systemui"; exit 1; fi
            flag=(--startup-diagnostic)
          fi
          if [ "$KVM_ACL" = "true" ]; then
            # Granted immediately before the run; restored when this step ends, however it ends.
            trap 'python3 os/tests/persistent-app-experiment/kvm_access.py restore --state "$RUNNER_TEMP/kvm-state" --evidence "$RUNNER_TEMP/pfx-evidence"' EXIT INT TERM
            python3 os/tests/persistent-app-experiment/kvm_access.py grant --state "$RUNNER_TEMP/kvm-state" --evidence "$RUNNER_TEMP/pfx-evidence" || exit 1
          fi
          python3 os/tests/persistent-app-experiment/experiment.py run --sdk "$ANDROID_HOME" --work "$RUNNER_TEMP/pfx" --evidence "$RUNNER_TEMP/pfx-evidence" "${flag[@]}"
      - name: Evidence (allowlist only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: persistent-experiment-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pfx-evidence/
            ${{ runner.temp }}/pfx/apks.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove the test key and AVD
        id: cleanup
        if: always()
        env:
          KVM_ACL: ${{ inputs.kvm_acl }}
        run: |
          "$ANDROID_HOME/platform-tools/adb" -s emulator-5580 emu kill 2>/dev/null || true
          restored=0
          if [ "$KVM_ACL" = "true" ]; then
            # The fallback after the run step's trap: idempotent, verifies the exact original ACL.
            python3 os/tests/persistent-app-experiment/kvm_access.py restore --state "$RUNNER_TEMP/kvm-state" --evidence "$RUNNER_TEMP/pfx-evidence" || restored=1
          fi
          rm -rf "$RUNNER_TEMP/pfx/test-only.keystore" "$RUNNER_TEMP/pfx/avd" "$RUNNER_TEMP/pfx/emulator-home"
          exit "$restored"
      - name: Stage and cleanup summary (bounded, non-secret)
        if: always()
        env:
          SYSTEMUI: ${{ inputs.systemui }}
          KVM_ACL: ${{ inputs.kvm_acl }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: python3 os/tests/persistent-app-experiment/report.py --evidence "$RUNNER_TEMP/pfx-evidence" --work "$RUNNER_TEMP/pfx" --summary "$GITHUB_STEP_SUMMARY"
