name: Agent Beta auto-release

# AGENT-BETA-AUTO part B. After a successful push-to-main 'App offline tests' run (the Rose Agent suites), dispatch the
# existing os-release.yml app-only route once for that exact tested SHA with apps=auto (scripts/agent-beta-auto.py).
# Secret-free: only the job's short-lived GITHUB_TOKEN (actions:write, contents:read). Inert unless the repository variable
# AGENT_BETA_AUTO is 'on'. Releases are serialized with every OS run by os-release's FIFO queue and host lock.

on:
  workflow_run:
    workflows: ['App offline tests']
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  # One dispatcher at a time; a newer completion replaces a pending one (coalescing to the newest tested SHA).
  group: agent-beta-auto
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write  # owner-approved (Nathan, 2026-11-01): dispatch os-release.yml and read run state
      contents: read  # checkout of this private repository and the compare API for the unchanged-content skip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Dispatch the app-only route for the tested SHA (once)
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          AGENT_BETA_AUTO: ${{ vars.AGENT_BETA_AUTO }}
        run: python3 scripts/agent-beta-auto.py dispatch
