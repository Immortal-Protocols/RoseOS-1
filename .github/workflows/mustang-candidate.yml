name: Mustang unsigned candidate
run-name: Mustang unsigned candidate ${{ github.run_id }}

# Manual source/preparation/compile path. Signing stays unbound until a
# Mustang-specific existing authorization/profile is established. No phone action.
on:
  workflow_dispatch:

permissions:
  contents: read

# The original builder's shared non-cancelling FIFO, including other workflows.
concurrency:
  group: os-release-frankel
  cancel-in-progress: false
  queue: max

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.pin.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind one main revision and record omitted tests
        id: pin
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "source=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          python3 scripts/mustang-pipeline.py describe
          echo 'Focused, regression and full-suite CI tests omitted under Nathan’s Mustang sprint plan.' >> "$GITHUB_STEP_SUMMARY"

  controller:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      started: ${{ steps.ownership.outputs.started }}
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_CONTROLLER_SERVICE_ACCOUNT: ${{ vars.GCP_CONTROLLER_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.source }}
          persist-credentials: false
      - run: python3 scripts/release-pipeline.py preflight --job controller
      - run: python3 scripts/actions-gcp-login.py login "$GCP_CONTROLLER_SERVICE_ACCOUNT"
      - run: python3 scripts/release-pipeline.py start-builder --ownership-record "$RUNNER_TEMP/mustang-builder-ownership.json"
      - name: Builder ownership
        id: ownership
        if: always()
        run: python3 scripts/release-pipeline.py builder-ownership --ownership-record "$RUNNER_TEMP/mustang-builder-ownership.json" >> "$GITHUB_OUTPUT"
      - if: always()
        run: python3 scripts/actions-gcp-login.py logout

  candidate:
    needs: [source, controller]
    runs-on: [self-hosted, roseos-frankel-builder]
    # Original lifecycle fallback remains 12 h. This is an 11 h job cap,
    # independent of the four-hour delivery target, not a restarted deadline.
    timeout-minutes: 660
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare, allocate, integrate and compile Mustang once
        run: python3 scripts/mustang-pipeline.py run --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Collect allowlisted receipts
        if: always()
        run: python3 scripts/mustang-pipeline.py report --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/mustang-reports-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Private receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mustang-reports-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn

  cleanup:
    needs: [source, controller, candidate]
    if: always() && needs.controller.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_CONTROLLER_SERVICE_ACCOUNT: ${{ vars.GCP_CONTROLLER_SERVICE_ACCOUNT }}
      STARTED: ${{ needs.controller.outputs.started }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.source }}
          persist-credentials: false
      - run: python3 scripts/release-pipeline.py preflight --job cleanup
      - run: python3 scripts/actions-gcp-login.py login "$GCP_CONTROLLER_SERVICE_ACCOUNT"
      - run: python3 scripts/release-pipeline.py stop-builder --only-if-started "$STARTED"
      - if: always()
        run: python3 scripts/actions-gcp-login.py logout
