name: rose-auth (Project 1 authentication)

# Builds and tests workspace/rose-auth: the Rust server library and the pure-Java client core, both against
# vectors/rose-auth-v1.txt. Proves library behaviour on the host only: no server, endpoint, phone, secrets, cloud
# access, deployment or release interaction.
on:
  pull_request:
    paths:
      - 'workspace/rose-auth/**'
      - 'docs/ROSE-AUTH-V1.md'
      - '.github/workflows/rose-auth.yml'
  push:
    branches: [main]
    paths:
      - 'workspace/rose-auth/**'
      - 'docs/ROSE-AUTH-V1.md'
      - '.github/workflows/rose-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rose-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rose-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workspace/rose-auth
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rust 1.97.0
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
          rustup default 1.97.0
          rustc --version
          cargo --version
          java -version
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests (shared vectors, flow and security properties)
        run: cargo test --locked --no-fail-fast
      - name: Java client core (shared vectors, Java 8 source level, no android.*)
        run: bash java/test.sh
