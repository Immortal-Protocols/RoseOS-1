name: OS signing (dedicated signer)
run-name: OS signing ${{ inputs.request_id }}

# SIGN-021/022: one hash-bound signing job on the dedicated signer host (runner group roseos-signing). os-release
# dispatches this workflow from main naming its own run, the immutable unsigned-build artifact (id and digest) and the
# roseos.signing-job.v1 manifest's sha256. A secret-free hosted ingress job fetches and validates that artifact; the
# signing job stages the same-run bundle into $SIGNING_ROOT/inbox/<job>/ and validates it again before any credential.
# Signing runs in scripts/signing-job.py (isolated workspace, signing-only lock, durable outputs and receipt). No
# publishing authority.
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: The os-release run that built and uploaded the unsigned inputs
        required: true
      artifact_id:
        description: Its unsigned-input artifact id
        required: true
      artifact_digest:
        description: That artifact's digest (sha256:<hex>)
        required: true
      manifest_sha256:
        description: sha256 of the artifact's manifest.json
        required: true
      request_id:
        description: <source_run>.<source_attempt>.<device>-<build>; the run-name the caller correlates on
        required: true

permissions:
  contents: read

concurrency:
  group: roseos-signing
  cancel-in-progress: false

env:
  SIGNING_ROOT: /srv/rose-signing
  SOURCE_RUN: ${{ inputs.source_run }}
  ARTIFACT_ID: ${{ inputs.artifact_id }}
  ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
  MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
  REQUEST_ID: ${{ inputs.request_id }}
  # The approved federation for this exact workflow on main (OCT30 exact security decision); not repository variables.
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/1072799993443/locations/global/workloadIdentityPools/roseos-signing/providers/github
  SIGNER_SERVICE_ACCOUNT: roseos-dedicated-signer@protocols-465723.iam.gserviceaccount.com

jobs:
  # Hosted and secret-free: only this job's short-lived token with read access to Actions (approved 19:41), no id-token.
  ingress:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch and validate the bound unsigned-build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/signing-job.py ingress --source-run "$SOURCE_RUN" --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST" --manifest-sha256 "$MANIFEST_SHA256" --out "$RUNNER_TEMP/ingress" --signing-root "$SIGNING_ROOT" --request-id "$REQUEST_ID"
      - name: Hand the validated bundle to the signing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signing-ingress-${{ github.run_id }}
          path: ${{ runner.temp }}/ingress
          retention-days: 1
          if-no-files-found: error

  sign:
    needs: ingress
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on:
      group: roseos-signing
      labels: [self-hosted, linux, x64, roseos-dedicated-signer]
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signing-ingress-${{ github.run_id }}
          path: ${{ runner.temp }}/ingress
      - name: Stage the same-run bundle into its inbox job directory
        run: |
          set -euo pipefail
          manifest=$(python3 scripts/signing-job.py stage --bundle "$RUNNER_TEMP/ingress" --signing-root "$SIGNING_ROOT" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["manifest"])')
          echo "MANIFEST=$manifest" >> "$GITHUB_ENV"
      - name: Validate the manifest, inputs and config (before any credential)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, re, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('signing_job', 'scripts/signing-job.py')
          job = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(job)
          root, manifest, digest = Path(os.environ['SIGNING_ROOT']), os.environ['MANIFEST'], os.environ['MANIFEST_SHA256']
          inbox = root/'inbox'
          if not re.fullmatch(r'[0-9a-f]{64}', digest):
              sys.exit('manifest_sha256 must be a sha256')
          if not re.fullmatch(re.escape(str(inbox)) + r'/[A-Za-z0-9._-]+/manifest\.json', manifest) or '..' in manifest.split('/'):
              sys.exit('the manifest must be $SIGNING_ROOT/inbox/<job>/manifest.json')
          path = Path(manifest)
          if path.is_symlink() or not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
              sys.exit('the manifest is missing or differs from manifest_sha256')
          for name in ('jobs', 'outputs', 'src'):
              if not (root/name).is_dir():
                  sys.exit(f'signer host setup missing: {root/name}')
          try:
              m = job.load_manifest(path)
              for key, spec_ in m['inputs'].items():
                  real = os.path.realpath(spec_['path'])
                  if not real.startswith(str(path.parent) + '/') or real != spec_['path']:
                      sys.exit(f'inputs.{key} must be a plain file in the manifest directory')
              job.load_config(m)
              job.check_inputs(m)
          except (job.Refused, job.SetupMissing) as error:
              sys.exit(str(error))
          print(json.dumps({'validated': f"{m['device']}-{m['build']}", 'manifestSha256': digest}))
          PY
      - name: Signer access (dedicated signer service account)
        run: python3 scripts/actions-gcp-login.py login "$SIGNER_SERVICE_ACCOUNT"
      - name: Sign in an isolated job workspace under the signing lock
        run: |
          set -euo pipefail
          cd "$SIGNING_ROOT/src"
          python3 "$GITHUB_WORKSPACE/scripts/signing-job.py" run --manifest "$MANIFEST" \
            --jobs-root "$SIGNING_ROOT/jobs" --out-root "$SIGNING_ROOT/outputs" | tee "$RUNNER_TEMP/signing-result.json"
      - name: Drop signer access
        if: always()
        run: python3 scripts/actions-gcp-login.py logout
      - name: Check the committed outputs and stage the public files and receipt
        run: |
          set -euo pipefail
          out=$(python3 -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/signing-result.json"))["outputDir"])')
          python3 scripts/signing-job.py check --output-dir "$out" > /dev/null
          mkdir "$RUNNER_TEMP/signed-public"
          cp "$out/signing-receipt.json" "$RUNNER_TEMP/signed-public/"
          cp "$out"/public/* "$RUNNER_TEMP/signed-public/"
          echo "SIGNED_JOB=$(basename "$out")" >> "$GITHUB_ENV"
          # SIGN-023: the signed target-files for the caller's signed-candidate verification, private and hash-bound to the
          # identical receipt; never part of the public release assets.
          mkdir "$RUNNER_TEMP/signed-target"
          cp "$out/signing-receipt.json" "$out/signed-target_files.zip" "$RUNNER_TEMP/signed-target/"
          python3 - "$RUNNER_TEMP/signed-target" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          d = Path(sys.argv[1])
          receipt = json.loads((d/'signing-receipt.json').read_text())
          digest = hashlib.sha256()
          with open(d/'signed-target_files.zip', 'rb') as f:
              for block in iter(lambda: f.read(8 << 20), b''):
                  digest.update(block)
          if sorted(p.name for p in d.iterdir()) != ['signed-target_files.zip', 'signing-receipt.json'] \
                  or digest.hexdigest() != receipt['outputs']['signed-target_files.zip']:
              sys.exit('the staged signed target-files differs from its receipt')
          PY
      - name: Public outputs and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-${{ env.SIGNED_JOB }}-${{ github.run_id }}
          path: ${{ runner.temp }}/signed-public
          retention-days: 7
          if-no-files-found: error
      - name: Signed target-files for verification (private)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-target-${{ env.SIGNED_JOB }}-${{ github.run_id }}
          path: ${{ runner.temp }}/signed-target
          retention-days: 1
          if-no-files-found: error
