      - 'scripts/apply-os-changes.py'
      - 'scripts/background_apks.py'
      - 'workspace/rose-agent/app/AndroidManifest.xml'
      - 'workspace/pixel-calculator-agent/AndroidManifest.xml'
      - 'os/background-control/agent-pip/AndroidManifest.xml'
      - '.github/workflows/release-verification.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/release-manifest.py'
      - 'scripts/release-stage.py'
      - 'scripts/release_receipts.py'
      - 'scripts/release-pipeline.py'
      - 'scripts/actions-gcp-login.py'
      - 'scripts/github_release_publisher.py'
      - 'scripts/host-integrate.py'
      - 'scripts/host-sign.py'
      - 'scripts/host_secrets.py'
      - 'scripts/sign_trace.py'
      - 'scripts/host-app-build.py'
      - 'scripts/host-app-release.py'
      - 'scripts/app_release_publisher.py'
      - 'scripts/emulator-alpha.py'
      - 'scripts/alpha_source.py'
      - 'scripts/alpha_image.py'
      - 'scripts/permission_apex.py'
      - 'os/alpha/**'
      - 'os/pinned-manifest.xml'
      - 'workspace/rose-agent/delivery/catalog.mjs'
      - 'workspace/rose-agent/delivery/catalog.test.mjs'
      - 'workspace/rose-agent/server/delivery.mjs'
      - 'scripts/host-reconcile.py'
      - 'scripts/host-sdk-layout.py'
      - 'scripts/host-decrypt-keys.py'
      - 'scripts/check-public-assets.mjs'
      - 'scripts/os-release-stage.sh'
      - 'scripts/sign-apk.py'
      - 'scripts/prepare-background-policy.py'
      - 'os/release-pipeline/**'
      - '.github/workflows/os-release.yml'
      - 'scripts/tests/test_release_*.py'
      - 'scripts/tests/test_github_publisher.py'
      - 'scripts/tests/test_host_adapters.py'
      - 'scripts/tests/test_host_build_reconcile.py'
      - 'scripts/tests/test_actions_gcp_login.py'
      - 'scripts/tests/test_app_release.py'
      - 'scripts/tests/test_app_release_publisher.py'
      - 'scripts/tests/test_emulator_alpha.py'
      - 'scripts/tests/test_alpha_source.py'
      - 'scripts/tests/test_permission_apex.py'
      - 'scripts/tests/apex_fixture.py'
      - 'os/tests/fixtures/rose-home-role/**'
      - 'os/tests/test_cuttlefish_alpha_product.py'
      - 'os/tests/fixtures/cuttlefish-alpha/**'
      - 'scripts/tests/fixtures/**'
      - 'os/release-evidence/**'
      - 'os/release-notes/**'
      - 'os/patches/**'
      - 'os/tests/test_apply_os_changes.py'
      - 'scripts/apply-os-changes.py'
      - 'scripts/background_apks.py'
      - 'workspace/rose-agent/app/AndroidManifest.xml'
      - 'workspace/pixel-calculator-agent/AndroidManifest.xml'
      - 'os/background-control/agent-pip/AndroidManifest.xml'
      - '.github/workflows/release-verification.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Already-public pixel-ota release to verify (allowlisted)
        type: choice
        options:
          - frankel-2026102701

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Manifest and stage tests
        run: |
          set -euo pipefail
          python3 scripts/tests/test_release_manifest.py
          python3 scripts/tests/test_release_stage.py
          python3 scripts/tests/test_release_pipeline.py
          python3 scripts/tests/test_permission_apex.py
          python3 scripts/tests/test_release_candidate_contract.py
          python3 scripts/tests/test_github_publisher.py
          python3 scripts/tests/test_host_adapters.py
          python3 os/tests/test_apply_os_changes.py
          python3 scripts/tests/test_host_build_reconcile.py
          python3 scripts/tests/test_actions_gcp_login.py
          python3 scripts/tests/test_app_release.py
          python3 scripts/tests/test_app_release_publisher.py
          python3 scripts/tests/test_emulator_alpha.py
          python3 scripts/tests/test_alpha_source.py
          python3 os/tests/test_cuttlefish_alpha_product.py
          node --test workspace/rose-agent/delivery/catalog.test.mjs
          python3 -c "import sys; sys.path.insert(0, 'scripts'); import importlib.util as u; s = u.spec_from_file_location('m', 'scripts/release-manifest.py'); m = u.module_from_spec(s); s.loader.exec_module(m); [m.load_manifest(p) for p in sys.argv[1:]]" os/release-evidence/*/manifest.json

  public-distribution:
    if: github.event_name == 'workflow_dispatch'
    needs: offline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Fixed by the allowlisted choice input; never taken from free-form input.
      RELEASE: ${{ inputs.release }}
      EVIDENCE: os/release-evidence/${{ inputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the allowlisted public assets
        run: |
          set -euo pipefail
          case "$RELEASE" in frankel-2026102701) ;; *) echo "Release not allowlisted" >&2; exit 1;; esac
          test -f "$EVIDENCE/manifest.json"
          assets="$RUNNER_TEMP/assets"
          mkdir "$assets"
          # Exactly the manifest's asset names, each capped at its expected size. Public reads need no token.
          python3 -c 'import json,sys; [print(a["name"], a["size"]) for a in json.load(open(sys.argv[1]))["assets"]]' \
            "$EVIDENCE/manifest.json" > "$RUNNER_TEMP/asset-list"
          while read -r name size; do
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --retry 2 --connect-timeout 20 --max-time 1200 --max-filesize "$size" \
              --output "$assets/$name" \
              "https://github.com/Immortal-Protocols/pixel-ota/releases/download/$RELEASE/$name"
          done < "$RUNNER_TEMP/asset-list"
          ls -l "$assets"
      - name: Compare bytes with the reference manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 scripts/release-manifest.py verify-published "$EVIDENCE/manifest.json" \
            --dir "$RUNNER_TEMP/assets" \
            --source "https://github.com/Immortal-Protocols/pixel-ota/releases/tag/$RELEASE" \
            --receipt "$RUNNER_TEMP/evidence/delivery-verification.json"
          python3 scripts/release-manifest.py verify "$EVIDENCE/manifest.json" --dir "$RUNNER_TEMP/assets" \
            --expected-device frankel --expected-variant user --expected-channel beta \
            --expected-identities "$EVIDENCE/expected-identities.json" --no-baseline \
            --receipt "$RUNNER_TEMP/evidence/local-verification.json"
          (cd "$RUNNER_TEMP/assets" && sha256sum --strict -c SHA256SUMS) > "$RUNNER_TEMP/evidence/sha256sums-check.txt"
      - name: Derive public identities from the published files
        run: |
          set -euo pipefail
          # Reads data only; nothing downloaded is executed. A pin match is not OTA signature verification.
          python3 - "$RUNNER_TEMP/assets" "$EVIDENCE/expected-identities.json" "$RUNNER_TEMP/evidence/public-identities.json" <<'PY'
          import base64, hashlib, json, os, sys
          assets, expected, output = sys.argv[1], json.load(open(sys.argv[2])), sys.argv[3]
          pem = open(os.path.join(assets, 'releasekey.x509.pem')).read()
          body = pem.split('-----BEGIN CERTIFICATE-----')[1].split('-----END CERTIFICATE-----')[0]
          derived = {
              'otaCertificateSha256': hashlib.sha256(base64.b64decode(''.join(body.split()))).hexdigest(),
              'avbPublicKeySha256': hashlib.sha256(open(os.path.join(assets, 'avb_pkmd.bin'), 'rb').read()).hexdigest(),
          }
          result = {field: derived[field] == expected[field] for field in derived}
          report = {'receiptType': 'public-identity-derivation', 'derived': derived, 'matchesExpected': result,
              'verdict': 'PASS' if all(result.values()) else 'FAIL',
              'note': 'public certificate and AVB key bytes match pins; OTA and app signatures not verified here'}
          with open(output, 'x') as f:
              json.dump(report, f, indent=2, sort_keys=True)
          print(json.dumps(report, indent=2, sort_keys=True))
          sys.exit(0 if report['verdict'] == 'PASS' else 1)
          PY
      - name: Summarize
        if: always()
        run: |
          {
            echo "### Public distribution verification: $RELEASE"
            echo "Source revision of this workflow: $GITHUB_SHA"
            for f in "$RUNNER_TEMP"/evidence/*.json; do
              if [ -f "$f" ]; then
                echo "- $(basename "$f"): $(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("verdict"))' "$f")"
              fi
            done
            echo "Stage receipts are not recorded here: build and signing evidence is held by Dev Infra, and this job does not reconstruct it."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep small verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verification-${{ inputs.release }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
          if-no-files-found: warn
