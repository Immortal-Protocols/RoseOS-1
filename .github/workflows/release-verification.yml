      - 'os/release-pipeline/**'
      - '.github/workflows/os-release.yml'
      - 'scripts/tests/test_release_*.py'
      - 'scripts/tests/test_github_publisher.py'
      - 'scripts/tests/test_host_adapters.py'
      - 'scripts/tests/test_host_build_reconcile.py'
      - 'scripts/tests/test_actions_gcp_login.py'
      - 'scripts/tests/test_app_release.py'
      - 'scripts/tests/test_app_release_publisher.py'
      - 'scripts/tests/test_emulator_alpha.py'
      - 'scripts/tests/test_alpha_source.py'
      - 'scripts/tests/test_permission_apex.py'
      - 'scripts/tests/apex_fixture.py'
      - 'os/tests/fixtures/rose-home-role/**'
      - 'os/tests/test_cuttlefish_alpha_product.py'
      - 'os/tests/fixtures/cuttlefish-alpha/**'
      - 'scripts/tests/fixtures/**'
      - 'os/release-evidence/**'
      - 'os/release-notes/**'
      - 'os/patches/**'
