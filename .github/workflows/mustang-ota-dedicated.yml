# Manual only. The lane is identity-bound; runtime stays unbound, so guard refuses before any VM start.
# Builder job is self-hosted on roseos-mustang-builder and has no signer token.
# The signer job is stock ubuntu-24.04 and is the only job that may OIDC-login as the existing signer.
# Guard, controller, publisher and cleanup are GitHub-hosted.
# Lifetime is selected only by real registration evidence. The VM STOPs itself after four hours if cleanup does not.
# No provisioning, runner registration, key bootstrap or policy reclaim.
name: Mustang dedicated OTA
run-name: mustang-dedicated-ota ${{ github.run_id }}
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Public publication needs separate recorded authority; default is private
        type: boolean
        default: false
      dry_run:
        description: Enroll one ephemeral runner and host-check only; no compile, sign, or publication
        type: boolean
        default: false
      source_only:
        description: Sync the pinned tree on the guest only. The guest cannot stop the VM; cleanup does.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mustang-ota
  cancel-in-progress: false
env:
  MUSTANG_PUBLISH: ${{ inputs.publish }}
  MUSTANG_DRY_RUN: ${{ inputs.dry_run || inputs.source_only }}
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runner_group: ${{ steps.inputs.outputs.runner_group }}
      runner_label: ${{ steps.inputs.outputs.runner_label }}
    env:
      MUSTANG_CONTROLLER_SERVICE_ACCOUNT: ${{ vars.MUSTANG_CONTROLLER_SERVICE_ACCOUNT }}
      MUSTANG_CONTROLLER_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.MUSTANG_CONTROLLER_WORKLOAD_IDENTITY_PROVIDER }}
      MUSTANG_SIGNER_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.MUSTANG_SIGNER_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SIGNER_SERVICE_ACCOUNT: ${{ vars.GCP_SIGNER_SERVICE_ACCOUNT }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - id: inputs
      name: Admit exact manual run, routes and actual dedicated inputs before host start
      run: python3 scripts/mustang-dedicated.py guard
  controller:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      ownership: ${{ steps.ownership.outputs.ownership }}
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.MUSTANG_CONTROLLER_WORKLOAD_IDENTITY_PROVIDER }}
      MUSTANG_CONTROLLER_SERVICE_ACCOUNT: ${{ vars.MUSTANG_CONTROLLER_SERVICE_ACCOUNT }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - run: python3 scripts/actions-gcp-login.py login "$MUSTANG_CONTROLLER_SERVICE_ACCOUNT"
    - run: python3 scripts/mustang_controller.py start --ownership-record "$RUNNER_TEMP/mustang-owner.json"
    - name: Require this run's owned start, never adopt an active builder
      run: python3 scripts/mustang-dedicated.py require-owned --ownership-record "$RUNNER_TEMP/mustang-owner.json"
    - id: ownership
      if: always()
      run: python3 scripts/mustang-dedicated.py ownership-output --ownership-record "$RUNNER_TEMP/mustang-owner.json"
    - if: always()
      run: python3 scripts/actions-gcp-login.py logout
  enroll:
    needs:
    - guard
    - controller
    if: needs.controller.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.MUSTANG_CONTROLLER_WORKLOAD_IDENTITY_PROVIDER }}
      MUSTANG_CONTROLLER_SERVICE_ACCOUNT: ${{ vars.MUSTANG_CONTROLLER_SERVICE_ACCOUNT }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: login
      run: python3 scripts/actions-gcp-login.py login "$MUSTANG_CONTROLLER_SERVICE_ACCOUNT"
    - id: app
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        app-id: ${{ vars.MUSTANG_RUNNER_APP_ID }}
        private-key: ${{ secrets.MUSTANG_RUNNER_APP_PRIVATE_KEY }}
        owner: Immortal-Protocols
    - name: Mint one group 5 JIT config and store it only in a private file
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
      run: python3 scripts/mustang_ephemeral.py issue --execute --run-id "$GITHUB_RUN_ID" --out "$RUNNER_TEMP/mustang-jit"
    - name: Deliver the config through instance metadata from a file
      run: python3 scripts/mustang_ephemeral.py put-metadata --execute --file "$RUNNER_TEMP/mustang-jit"
    - name: Remove the metadata key as soon as the guest has fetched it
      run: python3 scripts/mustang_ephemeral.py wait-fetched --execute --file "$RUNNER_TEMP/mustang-jit"
    - name: Remove this run's offline group 5 runner if enrollment failed
      if: failure() && steps.app.outcome == 'success'
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
      run: python3 scripts/mustang_ephemeral.py sweep --execute --run-id "$GITHUB_RUN_ID"
    - if: always() && steps.login.outcome == 'success'
      name: Delete JIT metadata on success and on every enroll failure
      run: python3 scripts/mustang_ephemeral.py clear-metadata --execute
    - if: always()
      run: rm -f "$RUNNER_TEMP/mustang-jit"
    - if: always() && steps.login.outcome == 'success'
      run: python3 scripts/actions-gcp-login.py logout
  queue-watch:
    needs:
    - controller
    - enroll
    if: always() && needs.controller.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.MUSTANG_CONTROLLER_WORKLOAD_IDENTITY_PROVIDER }}
      MUSTANG_CONTROLLER_SERVICE_ACCOUNT: ${{ vars.MUSTANG_CONTROLLER_SERVICE_ACCOUNT }}
      MUSTANG_OWNER_B64: ${{ needs.controller.outputs.ownership }}
      ENROLL_RESULT: ${{ needs.enroll.result }}
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: login
      run: python3 scripts/actions-gcp-login.py login "$MUSTANG_CONTROLLER_SERVICE_ACCOUNT"
    - if: steps.login.outcome == 'success'
      name: Delete any JIT metadata before deciding the runner wait
      run: python3 scripts/mustang_ephemeral.py clear-metadata --execute
    - id: decision
      if: always()
      name: Stop immediately if enroll failed, otherwise bound the runner wait
      run: python3 scripts/mustang_ephemeral.py queue-watch --execute
    - if: always() && steps.decision.outputs.stop == 'true' && steps.login.outcome == 'success'
      run: python3 scripts/mustang-dedicated.py cleanup-prepare --ownership-record "$RUNNER_TEMP/mustang-owner.json"
    - if: always() && steps.decision.outputs.stop == 'true' && steps.login.outcome == 'success'
      run: python3 scripts/mustang_controller.py stop --ownership-record "$RUNNER_TEMP/mustang-owner.json"
    - if: always() && steps.login.outcome == 'success'
      run: python3 scripts/mustang_ephemeral.py clear-metadata --execute
    - if: always() && steps.login.outcome == 'success'
      run: python3 scripts/actions-gcp-login.py logout
    - if: always() && steps.decision.outputs.stop == 'true'
      name: Cancel only this run so a queued builder cannot attach to a later boot
      run: python3 scripts/mustang_ephemeral.py cancel --execute
  builder:
    needs:
    - guard
    - controller
    - enroll
    if: inputs.source_only == false
    runs-on:
      group: ${{ needs.guard.outputs.runner_group }}
      labels: ${{ needs.guard.outputs.runner_label }}
    timeout-minutes: 200
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify guest ID, mounted data disk, bytes/inodes and tools
      run: python3 scripts/mustang-dedicated.py host-check
    - name: Check actual baseline updater and trust before a new compile
      if: inputs.dry_run == false
      run: python3 scripts/mustang-dedicated.py baseline --out "$RUNNER_TEMP/mustang-baseline.json"
    - name: Admit exact fresh app artifact or prepositioned private archive
      if: inputs.dry_run == false
      id: apps
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/mustang-dedicated.py fetch-inputs --out "$RUNNER_TEMP/mustang-inputs"
    - name: Prepare, allocate, integrate and compile once on Mustang disk
      if: inputs.dry_run == false
      env:
        APP_INPUTS: ${{ steps.apps.outputs.inputs_dir }}
      run: python3 scripts/mustang-dedicated.py produce --dir "$APP_INPUTS"
    - name: Require unsigned raised-edge proof before the hosted signing bundle
      if: inputs.dry_run == false
      id: collect
      run: python3 scripts/mustang-dedicated.py collect
    - name: Bundle the same-run unsigned target-files, otatools, and JDK bytes
      if: inputs.dry_run == false
      run: python3 scripts/mustang_hosted_sign.py export-bundle --collection "${{ steps.collect.outputs.collection_receipt }}" --out "$RUNNER_TEMP/mustang-signing-bundle"
    - id: capacity
      if: inputs.dry_run == false
      run: python3 scripts/mustang_hosted_sign.py gate --bundle "$RUNNER_TEMP/mustang-signing-bundle"
    - if: inputs.dry_run == false
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mustang-signing-bundle-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/mustang-signing-bundle/mustang-signing-bundle.json
        retention-days: 14
        if-no-files-found: error
    - name: Upload the bundled inputs only after admission
      if: steps.capacity.outputs.admit == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mustang-signing-inputs-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/mustang-signing-bundle/inputs
        retention-days: 14
        if-no-files-found: error
    - if: always() && inputs.dry_run == false
      run: python3 scripts/mustang-dedicated.py report --out "$RUNNER_TEMP/mustang-receipts" --dir "$RUNNER_TEMP/mustang-baseline.json"
    - if: always() && inputs.dry_run == false
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mustang-dedicated-receipts-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/mustang-receipts
        retention-days: 14
        if-no-files-found: warn
  signer:
    needs:
    - builder
    if: inputs.dry_run == false && inputs.source_only == false && needs.builder.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.MUSTANG_SIGNER_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SIGNER_SERVICE_ACCOUNT: ${{ vars.GCP_SIGNER_SERVICE_ACCOUNT }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: mustang-signing-bundle-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/mustang-signing-bundle
    - id: capacity
      name: Fail closed on disk, closed admission, and trusted pins before any signer secret
      run: python3 scripts/mustang_hosted_sign.py preflight --bundle "$RUNNER_TEMP/mustang-signing-bundle"
    - name: Download the same-run input bytes only after admission
      if: steps.capacity.outputs.admit == 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: mustang-signing-inputs-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/mustang-signing-bundle/inputs
    - name: OIDC login only after the capacity gate admits this checkout
      if: steps.capacity.outputs.admit == 'true'
      id: login
      run: python3 scripts/actions-gcp-login.py login "$GCP_SIGNER_SERVICE_ACCOUNT"
    - name: Sign with the checkout entry point, never a guest-supplied executable
      if: steps.capacity.outputs.admit == 'true'
      run: python3 scripts/mustang_hosted_sign.py sign --bundle "$RUNNER_TEMP/mustang-signing-bundle" --out "$RUNNER_TEMP/mustang-hosted-signed"
    - if: always() && steps.login.outcome == 'success'
      run: python3 scripts/actions-gcp-login.py logout
    - name: Upload the hosted signed outputs
      if: steps.capacity.outputs.admit == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mustang-dedicated-ota-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/mustang-hosted-signed
        retention-days: 14
        if-no-files-found: error
  publisher:
    needs: signer
    if: inputs.publish && inputs.dry_run == false && needs.signer.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: mustang-dedicated-ota-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/mustang-ota
    - name: Require exact hosted signed outputs before publisher credentials
      run: python3 scripts/mustang_hosted_sign.py bind-outputs --dir "$RUNNER_TEMP/mustang-ota"
    - name: Verify same-run hashes and both proofs before publisher credentials
      run: python3 scripts/mustang-dedicated.py verify-staged --publish --dir "$RUNNER_TEMP/mustang-ota"
    - id: app
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        app-id: ${{ vars.PIXEL_OTA_APP_ID }}
        private-key: ${{ secrets.PIXEL_OTA_APP_PRIVATE_KEY }}
        owner: Immortal-Protocols
        repositories: pixel-ota
        permission-contents: write
    - name: Fresh OTA, metadata last, preserve Latest
      env:
        PIXEL_OTA_TOKEN: ${{ steps.app.outputs.token }}
      run: python3 scripts/mustang-dedicated.py publish --publish --dir "$RUNNER_TEMP/mustang-ota" --out "$RUNNER_TEMP/mustang-publication"
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: mustang-dedicated-publication-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/mustang-publication
        retention-days: 14
        if-no-files-found: warn
  source:
    needs:
    - guard
    - controller
    - enroll
    if: inputs.source_only
    runs-on:
      group: ${{ needs.guard.outputs.runner_group }}
      labels: ${{ needs.guard.outputs.runner_label }}
    timeout-minutes: 185
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Sync pinned source only; this process cannot stop the VM
      timeout-minutes: 180
      env:
        MUSTANG_SOURCE_ONLY: 'true'
      run: python3 scripts/mustang_source_sync.py run --execute
  cleanup:
    needs:
    - guard
    - controller
    - builder
    - signer
    - source
    - publisher
    if: always() && needs.controller.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.MUSTANG_CONTROLLER_WORKLOAD_IDENTITY_PROVIDER }}
      MUSTANG_CONTROLLER_SERVICE_ACCOUNT: ${{ vars.MUSTANG_CONTROLLER_SERVICE_ACCOUNT }}
      MUSTANG_OWNER_B64: ${{ needs.controller.outputs.ownership }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: owned
      name: Validate exact owner before login, independent of signing/input readiness
      run: python3 scripts/mustang-dedicated.py cleanup-prepare --ownership-record "$RUNNER_TEMP/mustang-owner.json"
    - id: login
      if: steps.owned.outputs.started == 'true'
      run: python3 scripts/actions-gcp-login.py login "$MUSTANG_CONTROLLER_SERVICE_ACCOUNT"
    - if: steps.owned.outputs.started == 'true'
      run: python3 scripts/mustang_controller.py stop --ownership-record "$RUNNER_TEMP/mustang-owner.json"
    - if: always() && steps.login.outcome == 'success'
      run: python3 scripts/mustang_ephemeral.py clear-metadata --execute
    - if: always() && steps.login.outcome == 'success'
      run: python3 scripts/actions-gcp-login.py logout
    - id: app
      if: always()
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        app-id: ${{ vars.MUSTANG_RUNNER_APP_ID }}
        private-key: ${{ secrets.MUSTANG_RUNNER_APP_PRIVATE_KEY }}
        owner: Immortal-Protocols
    - name: Remove this run's offline group 5 runner after the VM stop
      if: always() && steps.app.outcome == 'success'
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
      run: python3 scripts/mustang_ephemeral.py sweep --execute --run-id "$GITHUB_RUN_ID"
