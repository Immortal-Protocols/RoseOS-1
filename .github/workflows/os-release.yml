name: Build & publish latest Pixel 10
# RELEASE020: a campaign run carries its campaign in the run name; scripts/release-chain.py finds successors by it.
run-name: ${{ inputs.mode == 'mustang-build' && inputs.candidate_sha != '' && format('mustang-build auto-{0}', inputs.candidate_sha) || inputs.mode == 'mustang-delivery' && inputs.mustang_publish_ota && format('mustang-delivery ota-{0}', inputs.mustang_compile_run) || startsWith(inputs.mode, 'mustang-') && format('{0} {1}', inputs.mode, github.run_id) || inputs.campaign && format('Build & publish latest Pixel 10 - campaign {0}', inputs.campaign) || inputs.mode == 'app-only' && inputs.apps == 'auto' && format('Agent Beta auto {0}', inputs.candidate_sha) || 'Build & publish latest Pixel 10' }}

# Build, sign, verify and publish one Frankel candidate on the existing builder. The default mode, latest-beta, is the
# normal button (OCT30-INFRA-S014): it needs no input. Every other mode and input is advanced. Proposed setup is
# NOT applied: until the bootstrap inputs in os/release-pipeline/frankel.json exist, the guard job
# fails closed and names what is missing; no job reports a simulated success.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: latest-beta (default, the normal button) builds the main commit this run was started from for Pixel 10 (frankel) Beta with a freshly allocated build number, BUILD_DATETIME and app versions, signs and verifies it, publishes a PUBLIC pixel-ota release and makes it the Beta Latest only after verification and the download check (this is not the production channel; older releases stay for rollback); leave every other field at its default. Advanced modes - latest-draft uses the normal fresh allocator and leaves a verified unpublished draft, with no campaign or promotion; policy reclaim is skipped; os-release builds the whole candidate from explicit pins; app-only builds, signs and verifies Rose Agent alone; emulator-alpha builds an unsigned test-only Cuttlefish image of the bound retained tree (no OS signing, no publication); emulator-alpha-successor only moves the pinned alpha preparation to the configured delta, re-hashes and probes it (no compile, signing or publication); emulator-alpha-apk-diagnostic reads aapt evidence for three fixed APKs from the retained alpha super.img of run 40765631053 (build_timestamp = that run's BUILD_DATETIME; no compile, signing or publication); emulator-alpha-verify-retained re-runs the full alpha image gate on run 40765631053's retained output, bound to its measured super.img (build_timestamp 1793220134; no compile, signing or publication); emulator-alpha-export stages the retained alpha images and host package verified by run 40777816699 (build_timestamp 1793220134), re-hashed against that run's receipt, as a private artifact for the separate alpha-runtime.yml (no compile, signing, login or publication); app-reuse hands the signed Rose Agent a verified OS candidate bundled (candidate_sha, build_number, build_timestamp of that build, reuse_binding) to the app publisher unchanged (no app build, compile, signing, signer login or OS promotion); device-readiness reads metadata of the retained source tree for the fixed Pixel 10 targets of os/devices/pixel10.json under the shared lock (candidate_sha = this workflow commit; PARTIAL by design - no lunch, envsetup or vendor script is executed, so target results stay unknown; no make, signing, secrets, login, download or publication; admits no device); signing-bootstrap runs one reviewed os/signing-bootstrap profile under the shared lock (candidate_sha = this workflow commit; no build, OS signing or publication; admits no device; fails closed until the profile's tools, inventory and access are ready); models-sign signs the retained unsigned Models APK with the protected models-v0 bootstrap identity (candidate_sha = this workflow commit, models_bootstrap_run = the bootstrap run; no build, OS signing or publication; the hosted guard first reads and verifies the original pinned unsigned input with its own token; any ingress failure stops before a host starts); rango-retained checks the retained Rango (Pixel 10 Pro Fold) signing and separate-release bindings of os/retained-rango/release.json on the hosted guard only and only when every binding is bound signs it on the original builder under the shared lock, verifies it, and publishes a separate public rango-{build} release that never becomes Latest (refused before the controller while any binding is unbound); rango-factory-observe (manual only) runs scripts/rango-factory-observe.py on the original builder under the nonblocking shared lock and reads only the retained Rango build 2026103001 signed marker and target-files, the TRANSFER007 hash-bound input receipt and otatools and the committed contracts, and uploads only its three JSON receipts (candidate_sha = empty, the recipe is this workflow commit; no build, signing, secrets, login, download, enrollment, recovery or publication; Blazer is never observed); blazer-prep (manual only) runs one Pixel 10 Pro (blazer) preparation stage of scripts/blazer-build-only.py (blazer_prep_stage = source, download, vendor or lunch; source is a byte copy of the production working tree whose provenance stays unverified), or its metadata-only inspect (blazer_prep_stage = inspect; at most 20 minutes, no process, network, lock or write) or git-only inspect-git of the two fixed vendor/adevtool/.git targets (blazer_prep_stage = git-inspect; at most 13 minutes, no git process, lock or write) or the git-only inspect-git-set of the adevtool projects gitdir (blazer_prep_stage = git-inspect-set; the same bounds) or the metadata-only inspect-git-objects of the fixed adevtool objects directory (blazer_prep_stage = git-inspect-objects; at most 14 minutes, no file content, link, lock or write) or git-meta, genuine Git metadata of the seven pinned projects fetched depth 1 from the public pinned-manifest remote into the isolated tree (blazer_prep_stage = git-meta; at most 111 minutes, 8 GiB) or the read-only binding-observe of exactly the files, names and resources the blazer bindings still need (blazer_prep_stage = binding-observe; at most 19 minutes, no link, write, lock or tool invocation; the stage passes only for a complete observation with no problems) or the read-only ssh-keygen-observe of the builder's fixed /usr/bin/ssh-keygen identity and package-reported version for factory signing (blazer_prep_stage = ssh-keygen-observe, Signing's scripts/ssh-keygen-observe.py; at most 16 minutes; runs no program, reads only the tool and the package database files; the stage passes only for a complete observation that Signing's bind accepts), on the original builder in an isolated work tree under the nonblocking shared lock, with the committed os/build-only/blazer-prep-host.json inputs (refused before the controller while any is unbound), and uploads only its three JSON receipts (candidate_sha = empty; no compile, make, signing, secrets, login, enrollment, recovery or publication; it stops the builder afterwards only if its own controller started it); rango-factory-inspect (manual only) inspects the installer ZIP an earlier rango-factory-package run retained on the builder, without regeneration - under the nonblocking shared lock it verifies that ZIP and its package receipt against the committed identity (the committed identity of run 41515240855 attempt 1), then runs observe, the firmware observer and classify, and uploads only their JSON reports (no generation, export, signing, secrets, login, download, install, phone action or publication; it stops the builder afterwards only if its own controller started it); rango-factory-package (manual only) runs the packaging-only scripts/host-factory-package.py on the original builder for the retained signed Rango build 2026103001 with literal historical expected pins (checked before use; the helper holds the nonblocking shared lock), then inspects the generated install ZIP with scripts/factory-package.py observe and classify, keeping the ZIP, receipts and capped raw log in a new task directory on the builder and uploading only the package receipt, the observation, the classify report and the cleanup report (candidate_sha = empty; no signing, keys, secrets, signer login, download, install, phone action or publication; it stops the builder afterwards only if its own controller started it); launcher3-compile (manual only) compiles Launcher3QuickStepLib only, with scripts/launcher3-compile.py against OS Product's contract os/compile-contracts/launcher3-quickstep-lib.json and the committed os/build-only/launcher3-compile-host.json inputs (refused before the controller while any input of the bound branch is unbound) - a byte copy of the bound source tree into a new run root under the nonblocking shared lock, verifyIntegrated or verifyBaseApplyCandidate (the candidate delta is applied in that copy only, never the source tree), then a bounded `m Launcher3QuickStepLib` with both aconfig flag outputs; a frankel lunch first checks OS Product's pinned lunch inputs in the copy and needs an admitted adevtool public fetch (exactly the pinned commit, depth 1 over https from the pinned manifest's source, into the copy's vendor/adevtool/.git only, verified and removed on failure; refused before the controller unless the pinned os/compile-contracts/frankel-lunch-inputs.json admits it and adevtoolGit is bound); it uploads only report.json, classification.json and cleanup.json, removes its own copy and outputs, and proves compilation only (candidate_sha = empty; no packaging, signing, secrets, login, install, phone action or publication, and no download but that admitted fetch; it stops the builder afterwards only if its own controller started it); blazer-compile (manual only) runs one first build of the Pixel 10 Pro (blazer) target-files with scripts/blazer-build-only.py run --stage compile in the isolated blazer-prep work tree under the nonblocking shared lock, with the committed os/build-only/blazer-compile-host.json inputs (refused before the controller while any is unbound) and the one completed blazer-integrate of this same workflow commit, selected on the builder from its blazer-allocate reservation (none or several refuse before the helper) - the helper re-checks isolation, the admitted Rose integration of that tree, space against the reviewed first-build allowance and its own 8-hour cap, and uploads only its three JSON receipts with the collected output paths and hashes (candidate_sha = empty; no signing, packaging, secrets, login, download, install, phone action or publication; it stops the builder afterwards only if its own controller started it); blazer-integrate (manual only) integrates Rose into the isolated blazer-prep work tree after git-meta with scripts/blazer-integrate-wiring.py, chaining only the existing owners' commands in order and stopping at the first failure - the reconcile seed from the Frankel receipt that matches the copy, the already-signed candidate bundle, Flavors' admit and render, a local candidate checkout and the rendered host-reconcile apply under the nonblocking shared lock - with the committed os/build-only/blazer-integrate-host.json inputs (refused before the controller while any is unbound), and uploads only its JSON reports (candidate_sha = empty; no signing, compile, secrets, login, download, install, phone action or publication; it stops the builder afterwards only if its own controller started it); frankel-factory-observe (manual only) reads, without writing and under the nonblocking shared lock, the inputs one Frankel (Pixel 10) initial factory installer would use for the published Frankel build named by os/factory-package/frankel.json - that build's original attempt receipt chain, sign and verification receipts and signed target-files sha256, its signing release directory markers and the otatools copy its signing kept there with its bin/fastboot and device/common generator members, the release script and the free space - and uploads only its JSON receipt (candidate_sha = empty; refused before the controller while a value it needs is unbound; no packaging, signing, secrets, login, download, install, phone action or publication; it stops the builder afterwards only if its own controller started it); frankel-factory-package (manual only) packages that build's exact signed target-files into frankel-install-<build>.zip with the shared factory machinery (scripts/host-factory-package.py, then scripts/factory-package.py observe, the firmware observation and classify), stages it only after inspection as a private 3-day artifact labelled an unsigned intermediate (no archive signature, so signatureVerified is missing; not factory-ready and not the delivered installer) and uploads its JSON receipts (candidate_sha = empty; refused before the controller while any binding value is unbound; no signing, secrets, login, download, install, phone action or publication; it stops the builder afterwards only if its own controller started it); mustang-ota (manual only, the Mustang one-button OTA) builds, signs and publishes one newer Mustang OTA in one run - the existing mustang-build producer with a fresh allocation, then the existing signing and publication jobs bound to that same run's own successful producer, so no run id is typed - with mustang_publish_ota true and every other input at its default; the signing read-access window is checked at the start, after the compile and right before signer login; never Latest, nothing is retried (each of its jobs refuses a re-run attempt), and the automatic dispatcher stays off; app-inputs-export (manual only) re-checks, under the nonblocking shared lock on the original builder, the three signed Rose apps and the background policy of the one Frankel build named by build_number and its committed allocation record, and uploads them unchanged as a private artifact for another builder (no build, signing, secrets, login, download or publication; it stops the builder afterwards only if its own controller started it)
        # mustang-build prepares/integrates/compiles only; mustang-bootstrap creates the separately bound key set once; mustang-delivery signs/packages/exports privately.
        type: choice
        options: [latest-beta, os-release, device-readiness, app-only, emulator-alpha, signing-bootstrap, rango-factory-package, rango-factory-inspect, models-sign, rango-retained, blazer-prep, emulator-alpha-successor, emulator-alpha-apk-diagnostic, emulator-alpha-verify-retained, app-reuse, emulator-alpha-export, rango-factory-observe, launcher3-compile, blazer-compile, blazer-integrate, mustang-build, mustang-bootstrap, mustang-delivery, frankel-factory-observe, frankel-factory-package, mustang-ota, app-inputs-export, latest-draft]
        default: latest-beta
      device:
        description: Normal full-release selector (frankel only); mustang-* modes ignore this field and pin Pixel 10 Pro XL in their own recipe
        type: choice
        options: [frankel]
        default: frankel
      candidate_sha:
        description: Advanced, explicit modes only (empty for latest-beta) - RoseOS-1 commit to build (must be on main)
        required: false
        default: ''
      build_number:
        description: Advanced, explicit modes only (empty for latest-beta) - new monotonic ten-digit build number
        required: false
        default: ''
      build_timestamp:
        description: Advanced, explicit modes only (empty for latest-beta) - BUILD_DATETIME (UTC epoch) for the build
        required: false
        default: ''
      channel:
        type: choice
        options: [beta, prod]
        default: beta
      apps:
        description: 'Advanced, explicit modes only (empty for latest-beta) - JSON [[package, versionCode], ...] expected in the image; app-only also takes auto (a fresh Rose Agent version allocated on the builder, or nothing built when these sources are already published)'
        required: false
        default: ''
      promote:
        description: Advanced os-release only - promote the verified draft (beta means pixel-ota Latest); latest-beta promotes after verification; latest-draft never promotes
        type: boolean
        default: false
      resume_failed_stage:
        description: Resume the preserved attempt of this build number at its failed stage, without rebuilding
        type: choice
        options: [none, bytes-verify, sign, ota-verify]
        default: none
      resume_unsigned_sha256:
        description: With resume, the unsignedTargetFiles sha256 printed by the original build stage
        required: false
        default: ''
      resume_signed_sha256:
        description: With an ota-verify resume, the signedTargetFiles sha256 printed by the successful sign stage
        required: false
        default: ''
      resume_source_run:
        description: With resume, the run id of the resumed attempt that failed (empty = the original attempt)
        required: false
        default: ''
      app_publish:
        description: app-only and app-reuse only - publish the verified signed APK as its own pixel-ota prerelease (never Latest)
        type: boolean
        default: false
      reuse_binding:
        description: 'app-reuse only - JSON {"sourceRun": original os-release run id, "apkSha256", "unsignedTargetFilesSha256", "signedTargetFilesSha256"} from that run'
        required: false
        default: ''
      alpha_recover:
        description: emulator-alpha-successor only - continue an interrupted successor transition from its journal (exact preimage or postimage only)
        type: boolean
        default: false
      bootstrap_profile:
        description: signing-bootstrap only - reviewed profile in os/signing-bootstrap/profiles.json (not a device admission)
        type: choice
        options: [none, fold-rango-v1, models-v0, pro-blazer-v1, fold-rango-factory-v1, pro-blazer-factory-v1]
        default: none
      models_bootstrap_run:
        description: models-sign only - run id of the completed protected models-v0 bootstrap whose public receipt binds the signer
        required: false
        default: ''
      rango_publish:
        description: rango-retained only - also publish the verified signed build as a separate public rango-{build} release (never Latest); false signs and verifies only
        type: boolean
        default: false
      rango_recover_run:
        description: rango-retained only - packaging-only recovery of this earlier run's already signed and verified outputs (no signer login, signing, enrolment or verification); empty for a normal run
        required: false
        default: ''
      rango_first_use_enroll:
        description: rango-retained only, and only if os/retained-rango/release.json selects the first-use identity policy (not selected) - this run enrols the durable first-use identity record; false requires an existing matching record
        type: boolean
        default: false
      blazer_prep_stage:
        description: blazer-prep only - the one preparation stage this run executes (none for every other mode)
        type: choice
        options: [none, source, download, vendor, lunch, inspect, git-inspect, git-inspect-set, git-inspect-objects, git-meta, binding-observe, ssh-keygen-observe]
        default: none
      mustang_compile_run:
        description: mustang-delivery only - Mustang build run (the exact recorded make=0 collection fault is supported)
        default: ''
      mustang_bootstrap_run:
        description: mustang-delivery only - completed pro-mustang-v1 bootstrap run
        default: ''
      mustang_publish_ota:
        description: 'mustang-build: check baseline before compile; mustang-delivery: publish newer OTA after checks. Inactive until os/ota/mustang.json is enabled; never Latest.'
        type: boolean
        default: false
      campaign:
        description: latest-beta only - empty (default) is one run; 'start' begins a 24h back-to-back campaign in which each healthy run (publish and cleanup succeeded) dispatches the next fresh latest-beta run from main; '<id>.<deadline>.<generation>' is set by the chain itself. Stop with repository variable RELEASE_CAMPAIGN_STOP (campaign id or 'all') or by cancelling
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # One candidate at a time across the builder's source/output tree and the publisher. queue: max keeps every waiting
  # run (FIFO, up to 100) instead of the default single pending slot, where a newly queued run (e.g. a campaign
  # successor) cancels and replaces an unrelated pending one (e.g. a models-sign run).
  group: os-release-frankel
  cancel-in-progress: false
  queue: max

env:
  DRAFT_ONLY: ${{ inputs.mode == 'latest-draft' }}
  MODE: ${{ inputs.mode == 'latest-draft' && 'latest-beta' || inputs.mode }}
  MUSTANG_PUBLISH_OTA: ${{ inputs.mustang_publish_ota }}
  MUSTANG_COMPILE_RUN: ${{ inputs.mustang_compile_run }}
  MUSTANG_BOOTSTRAP_RUN: ${{ inputs.mustang_bootstrap_run }}
  # Read by release-pipeline.py, which admits only its SUPPORTED_DEVICES; the guard checks it before the controller.
  ROSE_DEVICE: ${{ inputs.device || 'frankel' }}
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  BUILD_NUMBER: ${{ inputs.build_number }}
  BUILD_TIMESTAMP: ${{ inputs.build_timestamp }}
  CHANNEL: ${{ inputs.channel }}
  APPS: ${{ inputs.apps }}
  RESUME_STAGE: ${{ inputs.resume_failed_stage }}
  RESUME_UNSIGNED_SHA256: ${{ inputs.resume_unsigned_sha256 }}
  RESUME_SOURCE_RUN: ${{ inputs.resume_source_run }}
  RESUME_SIGNED_SHA256: ${{ inputs.resume_signed_sha256 }}
  REUSE_BINDING: ${{ inputs.reuse_binding }}
  BOOTSTRAP_PROFILE: ${{ inputs.bootstrap_profile || 'none' }}
  MODELS_BOOTSTRAP_RUN: ${{ inputs.models_bootstrap_run }}
  ROSE_RANGO_PUBLISH: ${{ inputs.rango_publish }}
  ROSE_FIRST_USE_ENROLL: ${{ inputs.rango_first_use_enroll }}
  ROSE_RECOVER_RUN: ${{ inputs.rango_recover_run }}
  CAMPAIGN: ${{ inputs.campaign }}
  BLAZER_PREP_STAGE: ${{ inputs.blazer_prep_stage || 'none' }}

jobs:
  guard:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # emulator-alpha-export and models-sign only: fixed original artifacts are read from their own runs
    outputs:
      mustang_skip: ${{ steps.mustang-auto-admit.outputs.skip }}
      mustang_compile_source: ${{ steps.mustang-binding.outputs.compile_source }}
      mustang_compile_recovery: ${{ steps.mustang-binding.outputs.compile_recovery }}
      mustang_bootstrap_source: ${{ steps.mustang-binding.outputs.bootstrap_source }}
      blazer_prep_outer_seconds: ${{ steps.blazer-prep.outputs.outer_seconds }}
      blazer_prep_job_minutes: ${{ steps.blazer-prep.outputs.job_minutes }}
      factory_package_seconds: ${{ steps.factory-package.outputs.package_seconds }}
      factory_observe_seconds: ${{ steps.factory-package.outputs.observe_seconds }}
      factory_firmware_seconds: ${{ steps.factory-package.outputs.firmware_seconds }}
      factory_classify_seconds: ${{ steps.factory-package.outputs.classify_seconds }}
      factory_stage_seconds: ${{ steps.factory-package.outputs.stage_seconds }}
      factory_job_minutes: ${{ steps.factory-package.outputs.job_minutes }}
      inspect_outer_seconds: ${{ steps.factory-inspect.outputs.outer_seconds }}
      inspect_job_minutes: ${{ steps.factory-inspect.outputs.job_minutes }}
      launcher3_outer_seconds: ${{ steps.launcher3-compile.outputs.outer_seconds }}
      launcher3_finish_seconds: ${{ steps.launcher3-compile.outputs.finish_seconds }}
      launcher3_job_minutes: ${{ steps.launcher3-compile.outputs.job_minutes }}
      blazer_compile_outer_seconds: ${{ steps.blazer-compile.outputs.outer_seconds }}
      blazer_compile_job_minutes: ${{ steps.blazer-compile.outputs.job_minutes }}
      blazer_integrate_outer_seconds: ${{ steps.blazer-integrate.outputs.outer_seconds }}
      blazer_integrate_job_minutes: ${{ steps.blazer-integrate.outputs.job_minutes }}
      frankel_observe_inputs_seconds: ${{ steps.frankel-factory-observe.outputs.observe_inputs_seconds }}
      frankel_observe_job_minutes: ${{ steps.frankel-factory-observe.outputs.job_minutes }}
      frankel_package_seconds: ${{ steps.frankel-factory-package.outputs.package_seconds }}
      frankel_observe_seconds: ${{ steps.frankel-factory-package.outputs.observe_seconds }}
      frankel_firmware_seconds: ${{ steps.frankel-factory-package.outputs.firmware_seconds }}
      frankel_classify_seconds: ${{ steps.frankel-factory-package.outputs.classify_seconds }}
      frankel_stage_seconds: ${{ steps.frankel-factory-package.outputs.stage_seconds }}
      frankel_package_job_minutes: ${{ steps.frankel-factory-package.outputs.job_minutes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Candidate is an exact commit on main
        env:
          PROMOTE: ${{ inputs.promote }}
          APP_PUBLISH: ${{ inputs.app_publish }}
          ALPHA_RECOVER: ${{ inputs.alpha_recover }}
        run: |
          set -euo pipefail
          # Private candidates use the same allocator and receipt chain, never a campaign or explicit promotion.
          [[ "${DRAFT_ONLY:-false}" == false || "${DRAFT_ONLY:-false}" == true ]]
          [[ "${DRAFT_ONLY:-false}" != true || ( "$MODE" == latest-beta && -z "${CAMPAIGN:-}" && "$PROMOTE" == false ) ]]
          [[ "$MUSTANG_PUBLISH_OTA" != true || "$MODE" == mustang-build || "$MODE" == mustang-delivery || "$MODE" == mustang-ota ]]
          if [[ "$MODE" == latest-beta ]]; then
            # The normal button: no pins at all. The dispatch commit (GITHUB_SHA, on main) is the captured source; the
            # builder allocates the build number, BUILD_DATETIME and app versions from it under the shared lock.
            [[ -z "$CANDIDATE_SHA" && -z "$BUILD_NUMBER" && -z "$BUILD_TIMESTAMP" && -z "$APPS" ]]
            [[ "$CHANNEL" == beta && "$ROSE_DEVICE" == frankel && "$PROMOTE" == false && "$RESUME_STAGE" == none ]]
            [[ -z "$RESUME_SOURCE_RUN" && -z "$RESUME_UNSIGNED_SHA256" && -z "$RESUME_SIGNED_SHA256" ]]
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          elif [[ "$MODE" == rango-retained ]]; then
            # The retained Rango route pins its device, product and build in os/retained-rango/release.json; no input pins.
            [[ -z "$CANDIDATE_SHA" && -z "$BUILD_NUMBER" && -z "$BUILD_TIMESTAMP" && -z "$APPS" ]]
            [[ "$PROMOTE" == false && "$RESUME_STAGE" == none && -z "$RESUME_SOURCE_RUN" ]]
          elif [[ "$MODE" == app-only && "$APPS" == auto ]]; then
            # AGENT-BETA-AUTO: the dispatched app route pins exactly one main commit; the builder allocates the Rose Agent
            # version under the shared lock and no OS build identity exists, so no build number or BUILD_DATETIME pin is
            # admitted. The exact-commit-on-main check below still applies.
            [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && -z "$BUILD_NUMBER" && -z "$BUILD_TIMESTAMP" ]]
          elif [[ "$MODE" == rango-factory-observe ]]; then
            # FOLD-OBSERVE-WIRE-001: read-only observation; every binding is committed, the recipe is this workflow commit.
            # No pins, resume, promotion, campaign, publication, signing profile, enrollment or recovery input is admitted.
            [[ -z "$CANDIDATE_SHA" && -z "$BUILD_NUMBER" && -z "$BUILD_TIMESTAMP" && -z "$APPS" ]]
            [[ "$PROMOTE" == false && "$RESUME_STAGE" == none && -z "$RESUME_SOURCE_RUN" && -z "$RESUME_UNSIGNED_SHA256" && -z "$RESUME_SIGNED_SHA256" ]]
            [[ -z "${CAMPAIGN:-}" && "$APP_PUBLISH" == false && "${ROSE_RANGO_PUBLISH:-false}" == false && "${ROSE_FIRST_USE_ENROLL:-false}" == false && -z "${ROSE_RECOVER_RUN:-}" ]]
            [[ "${BOOTSTRAP_PROFILE:-none}" == none && -z "${MODELS_BOOTSTRAP_RUN:-}" && -z "$REUSE_BINDING" && "$ALPHA_RECOVER" == false && "$ROSE_DEVICE" == frankel ]]
          elif [[ "$MODE" == rango-factory-package || "$MODE" == rango-factory-inspect ]]; then
            # FOLD-FACTORY-PACKAGE: packaging plus inspection of the retained signed build; every pin is committed, the
            # recipe is this workflow commit. No pins, resume, promotion, campaign, publication, signing profile,
            # enrollment, recovery or preparation stage is admitted.
            [[ -z "$CANDIDATE_SHA" && -z "$BUILD_NUMBER" && -z "$BUILD_TIMESTAMP" && -z "$APPS" ]]
            [[ "$PROMOTE" == false && "$RESUME_STAGE" == none && -z "$RESUME_SOURCE_RUN" && -z "$RESUME_UNSIGNED_SHA256" && -z "$RESUME_SIGNED_SHA256" ]]
            [[ -z "${CAMPAIGN:-}" && "$APP_PUBLISH" == false && "${ROSE_RANGO_PUBLISH:-false}" == false && "${ROSE_FIRST_USE_ENROLL:-false}" == false && -z "${ROSE_RECOVER_RUN:-}" ]]
            [[ "${BOOTSTRAP_PROFILE:-none}" == none && -z "${MODELS_BOOTSTRAP_RUN:-}" && -z "$REUSE_BINDING" && "$ALPHA_RECOVER" == false && "$ROSE_DEVICE" == frankel ]]
          elif [[ "$MODE" == frankel-factory-observe || "$MODE" == frankel-factory-package ]]; then
            # FRANKEL-FACTORY: the published Frankel build and every pin come from the committed
            # os/factory-package/frankel.json; the recipe is this workflow commit. No pins, resume, promotion,
            # campaign, publication, signing profile, enrollment, recovery or preparation stage is admitted.
            [[ -z "$CANDIDATE_SHA" && -z "$BUILD_NUMBER" && -z "$BUILD_TIMESTAMP" && -z "$APPS" ]]
            [[ "$PROMOTE" == false && "$RESUME_STAGE" == none && -z "$RESUME_SOURCE_RUN" && -z "$RESUME_UNSIGNED_SHA256" && -z "$RESUME_SIGNED_SHA256" ]]
            [[ -z "${CAMPAIGN:-}" && "$APP_PUBLISH" == false && "${ROSE_RANGO_PUBLISH:-false}" == false && "${ROSE_FIRST_USE_ENROLL:-false}" == false && -z "${ROSE_RECOVER_RUN:-}" ]]
            [[ "${BOOTSTRAP_PROFILE:-none}" == none && -z "${MODELS_BOOTSTRAP_RUN:-}" && -z "$REUSE_BINDING" && "$ALPHA_RECOVER" == false && "$ROSE_DEVICE" == frankel ]]
          elif [[ "$MODE" == launcher3-compile || "$MODE" == blazer-compile || "$MODE" == blazer-integrate ]]; then
            # LAUNCHER3-COMPILE: compile-only; every input is committed, the recipe is this workflow commit.
            # No pins, resume, promotion, campaign, publication, signing profile, enrollment, recovery or stage is admitted.
            [[ -z "$CANDIDATE_SHA" && -z "$BUILD_NUMBER" && -z "$BUILD_TIMESTAMP" && -z "$APPS" ]]
            [[ "$PROMOTE" == false && "$RESUME_STAGE" == none && -z "$RESUME_SOURCE_RUN" && -z "$RESUME_UNSIGNED_SHA256" && -z "$RESUME_SIGNED_SHA256" ]]
            [[ -z "${CAMPAIGN:-}" && "$APP_PUBLISH" == false && "${ROSE_RANGO_PUBLISH:-false}" == false && "${ROSE_FIRST_USE_ENROLL:-false}" == false && -z "${ROSE_RECOVER_RUN:-}" ]]
            [[ "${BOOTSTRAP_PROFILE:-none}" == none && -z "${MODELS_BOOTSTRAP_RUN:-}" && -z "$REUSE_BINDING" && "$ALPHA_RECOVER" == false && "$ROSE_DEVICE" == frankel ]]
          elif [[ "$MODE" == app-inputs-export ]]; then
            # APP-INPUTS-EXPORT: build_number names one Frankel build whose committed allocation record is the producer;
            # the recipe is this workflow commit. No candidate, timestamp, apps, resume, promotion, campaign, publication,
            # signing profile, enrollment, recovery or preparation stage is admitted.
            [[ -z "$CANDIDATE_SHA" && "$BUILD_NUMBER" =~ ^[1-9][0-9]{9}$ && -z "$BUILD_TIMESTAMP" && -z "$APPS" ]]
            [[ "$PROMOTE" == false && "$RESUME_STAGE" == none && -z "$RESUME_SOURCE_RUN" && -z "$RESUME_UNSIGNED_SHA256" && -z "$RESUME_SIGNED_SHA256" ]]
            [[ -z "${CAMPAIGN:-}" && "$APP_PUBLISH" == false && "${ROSE_RANGO_PUBLISH:-false}" == false && "${ROSE_FIRST_USE_ENROLL:-false}" == false && -z "${ROSE_RECOVER_RUN:-}" ]]
            [[ "${BOOTSTRAP_PROFILE:-none}" == none && -z "${MODELS_BOOTSTRAP_RUN:-}" && -z "$REUSE_BINDING" && "$ALPHA_RECOVER" == false && "$ROSE_DEVICE" == frankel ]]
          elif [[ "$MODE" == mustang-build || "$MODE" == mustang-bootstrap || "$MODE" == mustang-delivery || "$MODE" == mustang-ota ]]; then
            # Optional candidate_sha pins the tested main source for automatic unsigned builds.
            # MUSTANG-OTA (one button): the dispatch commit is the source, publication is the point, and the producer
            # run is this run itself, so no candidate or run pin is admitted.
            [[ "$MODE" != mustang-ota || "$MUSTANG_PUBLISH_OTA" == true ]]
            # mustang-ota runs once: a re-run attempt is refused here, in mustang-build, mustang-ota-bind and
            # mustang-signer, so nothing in the chain is retried.
            [[ "$MODE" != mustang-ota || "${GITHUB_RUN_ATTEMPT:-}" == 1 ]]
            [[ -z "$BUILD_NUMBER" && -z "$BUILD_TIMESTAMP" && -z "$APPS" ]]
            if [[ "$MODE" == mustang-build ]]; then
              [[ -z "$CANDIDATE_SHA" || "$CANDIDATE_SHA" == "$GITHUB_SHA" ]]
            else
              [[ -z "$CANDIDATE_SHA" ]]
            fi
            [[ "$PROMOTE" == false && "$RESUME_STAGE" == none && -z "$RESUME_SOURCE_RUN" && -z "$RESUME_UNSIGNED_SHA256" && -z "$RESUME_SIGNED_SHA256" ]]
            [[ -z "${CAMPAIGN:-}" && "$APP_PUBLISH" == false && "${ROSE_RANGO_PUBLISH:-false}" == false && "${ROSE_FIRST_USE_ENROLL:-false}" == false && -z "${ROSE_RECOVER_RUN:-}" ]]
            [[ "${BOOTSTRAP_PROFILE:-none}" == none && -z "${MODELS_BOOTSTRAP_RUN:-}" && -z "$REUSE_BINDING" && "$ALPHA_RECOVER" == false && "$ROSE_DEVICE" == frankel ]]
            if [[ "$MODE" == mustang-delivery ]]; then
              [[ "$MUSTANG_COMPILE_RUN" =~ ^[1-9][0-9]{0,19}$ && "$MUSTANG_BOOTSTRAP_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
            else
              [[ -z "$MUSTANG_COMPILE_RUN" && -z "$MUSTANG_BOOTSTRAP_RUN" ]]
            fi
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          elif [[ "$MODE" == blazer-prep ]]; then
            # BLAZER-PREP: one preparation stage; every input is committed, the recipe is this workflow commit.
            # No pins, resume, promotion, campaign, publication, signing profile, enrollment or recovery input is admitted.
            [[ -z "$CANDIDATE_SHA" && -z "$BUILD_NUMBER" && -z "$BUILD_TIMESTAMP" && -z "$APPS" ]]
            [[ "$PROMOTE" == false && "$RESUME_STAGE" == none && -z "$RESUME_SOURCE_RUN" && -z "$RESUME_UNSIGNED_SHA256" && -z "$RESUME_SIGNED_SHA256" ]]
            [[ -z "${CAMPAIGN:-}" && "$APP_PUBLISH" == false && "${ROSE_RANGO_PUBLISH:-false}" == false && "${ROSE_FIRST_USE_ENROLL:-false}" == false && -z "${ROSE_RECOVER_RUN:-}" ]]
            [[ "${BOOTSTRAP_PROFILE:-none}" == none && -z "${MODELS_BOOTSTRAP_RUN:-}" && -z "$REUSE_BINDING" && "$ALPHA_RECOVER" == false && "$ROSE_DEVICE" == frankel ]]
            [[ "${BLAZER_PREP_STAGE:-none}" =~ ^(source|download|vendor|lunch|inspect|git-inspect|git-inspect-set|git-inspect-objects|git-meta|binding-observe|ssh-keygen-observe)$ ]]
          else
            [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$BUILD_NUMBER" =~ ^[0-9]{10}$ && "$BUILD_TIMESTAMP" =~ ^[0-9]{10}$ ]]
          fi
          [[ "$MODE" == mustang-delivery || ( -z "$MUSTANG_COMPILE_RUN" && -z "$MUSTANG_BOOTSTRAP_RUN" ) ]]
          # A preparation stage is selectable only in blazer-prep mode.
          [[ "$MODE" == blazer-prep || "${BLAZER_PREP_STAGE:-none}" == none ]]
          # The device names attempt directories and artifacts: a plain codename, admitted by the pipeline's allowlist.
          [[ "$ROSE_DEVICE" =~ ^[a-z][a-z0-9]{1,31}$ ]]
          python3 -c 'import importlib.util, os; s = importlib.util.spec_from_file_location("p", "scripts/release-pipeline.py"); m = importlib.util.module_from_spec(s); s.loader.exec_module(m); m.resolve_device(os.environ["ROSE_DEVICE"])'
          # Every mode other than os-release (app, alpha, reuse) is bound to frankel's records.
          [[ "$MODE" == os-release || "$ROSE_DEVICE" == frankel ]]
          # Rango publication is selectable only in its own mode.
          [[ "$MODE" == rango-retained || "${ROSE_RANGO_PUBLISH:-false}" == false ]]
          [[ "$MODE" == rango-retained || "${ROSE_FIRST_USE_ENROLL:-false}" == false ]]
          [[ -z "${ROSE_RECOVER_RUN:-}" || ( "$MODE" == rango-retained && "$ROSE_RECOVER_RUN" =~ ^[1-9][0-9]{0,19}$ && "${ROSE_FIRST_USE_ENROLL:-false}" == false ) ]]
          [[ "$MODE" == latest-beta || "$MODE" == rango-retained || "$MODE" == rango-factory-package || "$MODE" == rango-factory-inspect || "$MODE" == blazer-prep || "$MODE" == rango-factory-observe || "$MODE" == launcher3-compile || "$MODE" == blazer-compile || "$MODE" == blazer-integrate || "$MODE" == mustang-build || "$MODE" == mustang-bootstrap || "$MODE" == mustang-delivery || "$MODE" == frankel-factory-observe || "$MODE" == frankel-factory-package || "$MODE" == mustang-ota || "$MODE" == app-inputs-export || ( "$MODE" == app-only && "$APPS" == auto ) ]] || python3 -c 'import json, os, re; apps = json.loads(os.environ["APPS"]); assert apps and all(re.fullmatch(r"[a-z][\w.]+", p) and isinstance(v, int) and v > 0 for p, v in apps)'
          [[ "$MODE" == latest-beta || "$MODE" == rango-retained || "$MODE" == rango-factory-package || "$MODE" == rango-factory-inspect || "$MODE" == blazer-prep || "$MODE" == rango-factory-observe || "$MODE" == launcher3-compile || "$MODE" == blazer-compile || "$MODE" == blazer-integrate || "$MODE" == mustang-build || "$MODE" == mustang-bootstrap || "$MODE" == mustang-delivery || "$MODE" == frankel-factory-observe || "$MODE" == frankel-factory-package || "$MODE" == mustang-ota || "$MODE" == app-inputs-export ]] || git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          [[ "$RESUME_STAGE" == none || "$RESUME_UNSIGNED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ -z "$RESUME_SOURCE_RUN" || ( "$RESUME_STAGE" != none && "$RESUME_SOURCE_RUN" =~ ^[0-9]+$ ) ]]
          [[ "$RESUME_STAGE" != ota-verify || ( "$RESUME_SIGNED_SHA256" =~ ^[0-9a-f]{64}$ && -n "$RESUME_SOURCE_RUN" ) ]]
          # app-only and emulator-alpha: no resume and no promotion (neither reaches the publisher); app-only is exactly Rose Agent.
          [[ "$MODE" == os-release || ( "$RESUME_STAGE" == none && -z "$RESUME_SOURCE_RUN" && "$PROMOTE" == false ) ]]
          # Public app publication exists only in app-only and app-reuse modes.
          [[ "$APP_PUBLISH" == false || "$MODE" == app-only || "$MODE" == app-reuse ]]
          # Successor recovery exists only in emulator-alpha-successor mode.
          [[ "$ALPHA_RECOVER" == false || "$MODE" == emulator-alpha-successor ]]
          # device-readiness: the candidate is this exact workflow recipe; the probe takes no other input.
          [[ "$MODE" != device-readiness || "$CANDIDATE_SHA" == "$GITHUB_SHA" ]]
          # signing-bootstrap: bound to this workflow recipe; a bootstrap profile exists only in that mode.
          [[ "$MODE" != signing-bootstrap || "$CANDIDATE_SHA" == "$GITHUB_SHA" ]]
          [[ ( "$MODE" == signing-bootstrap && "${BOOTSTRAP_PROFILE:-none}" != none ) || ( "$MODE" != signing-bootstrap && "${BOOTSTRAP_PROFILE:-none}" == none ) ]]
          # models-sign: bound to this workflow recipe and one numeric bootstrap run; the run input exists only there.
          [[ "$MODE" != models-sign || "$CANDIDATE_SHA" == "$GITHUB_SHA" ]]
          [[ ( "$MODE" == models-sign && "${MODELS_BOOTSTRAP_RUN:-}" =~ ^[1-9][0-9]{0,19}$ ) || ( "$MODE" != models-sign && -z "${MODELS_BOOTSTRAP_RUN:-}" ) ]]
          [[ "$MODE" != app-only || "$APPS" == auto ]] || python3 -c 'import json, os; apps = json.loads(os.environ["APPS"]); assert len(apps) == 1 and apps[0][0] == "dev.pixel.voice"'
          # app-reuse: exactly Rose Agent and an explicit binding to the original run; the binding exists only there.
          [[ -z "$REUSE_BINDING" || "$MODE" == app-reuse ]]
          [[ "$MODE" != app-reuse ]] || python3 -c 'import json, os, re; apps = json.loads(os.environ["APPS"]); b = json.loads(os.environ["REUSE_BINDING"]); assert len(apps) == 1 and apps[0][0] == "dev.pixel.voice" and sorted(b) == ["apkSha256", "signedTargetFilesSha256", "sourceRun", "unsignedTargetFilesSha256"] and type(b["sourceRun"]) is int and b["sourceRun"] > 0 and all(isinstance(b[k], str) and re.fullmatch("[0-9a-f]{64}", b[k]) for k in b if k != "sourceRun")'
          # RELEASE020: a campaign chains latest-beta runs only; its input shape is checked before any host starts.
          python3 scripts/release-chain.py check --campaign "${CAMPAIGN:-}"
          [[ -z "${CAMPAIGN:-}" || "$MODE" == latest-beta ]]
      # rango-retained (OCT30-INFRA-S015): every real binding is checked here, before the controller; unbound ones exit 4.
      - name: Retained Rango preflight
        if: inputs.mode == 'rango-retained'
        run: python3 scripts/rango-retained.py preflight --job guard
      # OCT30-INFRA-S017-FIX001: the builder has no Actions read access, so the permitted bootstrap run is checked here
      # (first-use policy selected only; bootstrap-receipt mode records checked=false without any call).
      - name: Retained Rango bootstrap-run provenance
        if: inputs.mode == 'rango-retained'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/rango-provenance"
          python3 scripts/rango-retained.py check-bootstrap-run --out "$RUNNER_TEMP/rango-provenance/first-use-provenance.json"
          if [[ -n "${ROSE_RECOVER_RUN:-}" ]]; then
            python3 scripts/rango-retained.py check-recovery-run --run-id "$ROSE_RECOVER_RUN" --out "$RUNNER_TEMP/rango-provenance/recovery-evidence.json"
          fi
      - name: Hand the provenance receipt to the Rango builder
        if: inputs.mode == 'rango-retained'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rango-first-use-provenance-${{ github.run_id }}
          path: ${{ runner.temp }}/rango-provenance
          retention-days: 1
          if-no-files-found: error
      - name: Mustang OTA activation and installed baseline preflight
        if: inputs.mustang_publish_ota
        run: python3 scripts/mustang_ota.py guard
      - name: Recheck unchanged content after FIFO admission before starting the builder
