name: Private Pixel Voice restoration signing
run-name: Sign private Pixel Voice restoration candidate
on:
  workflow_dispatch:
concurrency:
  group: private-pixel-classic-signing
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SIGNER_SERVICE_ACCOUNT: ${{ vars.GCP_SIGNER_SERVICE_ACCOUNT }}
      INPUT_SHA256: 1a54277f0c6b36e51e66e04d94aaea3b24542f724ae888d9bc33cb3a21774c82
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read the fixed private restoration input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/restore-input" "$RUNNER_TEMP/restore-output"
          gh release download pixel-classic-signing-input-20261106 --repo "$GITHUB_REPOSITORY" --pattern pixel-voice-classic-unsigned.apk --pattern signing-input.json --dir "$RUNNER_TEMP/restore-input"
          printf '%s  %s\n' "$INPUT_SHA256" "$RUNNER_TEMP/restore-input/pixel-voice-classic-unsigned.apk" | sha256sum -c -
      - name: Validate APK identity and prepare existing Android tools
        run: |
          set -euo pipefail
          command -v gcloud
          test -d "$ANDROID_HOME/build-tools"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$tools/apksigner"
          test -x "$tools/aapt"
          "$tools/aapt" dump badging "$RUNNER_TEMP/restore-input/pixel-voice-classic-unsigned.apk" > "$RUNNER_TEMP/restore-input/apk-metadata.txt"
          grep -q "package: name='dev.pixel.voice' versionCode='354'" "$RUNNER_TEMP/restore-input/apk-metadata.txt"
          mkdir -p "$RUNNER_TEMP/restore-sdk/build-tools"
          ln -s "$tools" "$RUNNER_TEMP/restore-sdk/build-tools/android-15"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/restore-sdk" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Use the existing release signing identity
        run: python3 scripts/actions-gcp-login.py login "$GCP_SIGNER_SERVICE_ACCOUNT"
      - name: Sign only the verified restoration candidate
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/restore-signing-private"
          mkdir "$private"
          trap 'rm -rf "$private"' EXIT
          gcloud secrets versions access 1 --secret=PIXEL_APP_SIGNING_KEYSTORE --project=protocols-465723 --out-file="$private/keystore"
          gcloud secrets versions access 1 --secret=PIXEL_APP_SIGNING_CONFIG --project=protocols-465723 --out-file="$private/config"
          gcloud secrets versions access 1 --secret=PIXEL_APP_SIGNING_STORE_PASSWORD --project=protocols-465723 --out-file="$private/store-password"
          gcloud secrets versions access 1 --secret=PIXEL_APP_SIGNING_KEY_PASSWORD --project=protocols-465723 --out-file="$private/key-password"
          python3 scripts/sign-apk.py "$RUNNER_TEMP/restore-input/pixel-voice-classic-unsigned.apk" --keystore "$private/keystore" --config "$private/config" --store-password-file "$private/store-password" --key-password-file "$private/key-password" --output "$RUNNER_TEMP/restore-output/pixel-voice-classic.apk" --expected-cert-sha256 650d47f91b7f5af3c530fef53fe92018aa4521efba065bcb1d6fc9b699060bfb
          cp "$RUNNER_TEMP/restore-input/signing-input.json" "$RUNNER_TEMP/restore-output/"
      - name: Remove temporary signer credentials
        if: always()
        run: python3 scripts/actions-gcp-login.py logout
      - name: Return the signed APK privately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pixel-voice-classic-signed
          path: ${{ runner.temp }}/restore-output
          retention-days: 3
          if-no-files-found: error
