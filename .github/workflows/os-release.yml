        run: python3 scripts/alpha-export.py check-original --receipt-dir "$RUNNER_TEMP/alpha-original"
      - name: Hand the checked receipt to the export job
        if: inputs.mode == 'emulator-alpha-export'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha-retained-verification-${{ github.run_id }}
