        run: python3 scripts/mustang-delivery.py guard --mode "$MUSTANG_MODE" --compile-run "$MUSTANG_COMPILE_RUN" --bootstrap-run "$MUSTANG_BOOTSTRAP_RUN" --out "$RUNNER_TEMP/mustang-binding.json"

  controller:
    needs: guard
    if: needs.guard.outputs.mustang_skip != 'true'
    runs-on: ubuntu-24.04
