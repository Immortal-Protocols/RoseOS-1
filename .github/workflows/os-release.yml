        if: inputs.mode == 'frankel-factory-observe'
        run: python3 scripts/frankel-factory-package-wiring.py check --stage observe >> "$GITHUB_OUTPUT"
      - name: Frankel factory package check
        id: frankel-factory-package
        if: inputs.mode == 'frankel-factory-package'
        run: python3 scripts/frankel-factory-package-wiring.py check --stage package >> "$GITHUB_OUTPUT"
      - name: Blazer integrate check
        id: blazer-integrate
        if: inputs.mode == 'blazer-integrate'
        run: python3 scripts/blazer-integrate-wiring.py check >> "$GITHUB_OUTPUT"
      - name: Blazer compile check
        id: blazer-compile
        if: inputs.mode == 'blazer-compile'
        run: python3 scripts/blazer-compile-wiring.py check >> "$GITHUB_OUTPUT"
      - name: Blazer preparation check
        id: blazer-prep
        if: inputs.mode == 'blazer-prep'
        run: python3 scripts/blazer-prep-wiring.py check --stage "$BLAZER_PREP_STAGE" >> "$GITHUB_OUTPUT"
      # Fails closed before the controller starts unless the profile is resource-bound with an approved inventory, tool
