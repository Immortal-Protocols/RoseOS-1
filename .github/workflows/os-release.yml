      - name: Bootstrap preflight
        if: ${{ !startsWith(inputs.mode, 'mustang-') }}
        env:
          ROSEOS_BUILDER_RUNNER_READY: ${{ vars.ROSEOS_BUILDER_RUNNER_READY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_CONTROLLER_SERVICE_ACCOUNT: ${{ vars.GCP_CONTROLLER_SERVICE_ACCOUNT }}
          GCP_SIGNER_SERVICE_ACCOUNT: ${{ vars.GCP_SIGNER_SERVICE_ACCOUNT }}
          PIXEL_OTA_PUBLISHER: ${{ vars.PIXEL_OTA_PUBLISHER }}
          PIXEL_OTA_APP_ID: ${{ vars.PIXEL_OTA_APP_ID }}
          # Presence only; the key itself is read solely by the publisher job's token step.
          PIXEL_OTA_APP_KEY_PRESENT: ${{ secrets.PIXEL_OTA_APP_PRIVATE_KEY != '' }}
        run: python3 scripts/release-pipeline.py preflight --job guard
      # Fails closed (exit 4) until the checked-in sourceBinding and hostEvidence exist, before the builder starts.
      - name: Emulator-alpha preflight
        if: inputs.mode == 'emulator-alpha'
        run: python3 scripts/emulator-alpha.py preflight --job guard
      # Only the pinned predecessor, the contract's incremental delta and the bound base candidate and apps are admitted.
      - name: Emulator-alpha successor preflight
        if: inputs.mode == 'emulator-alpha-successor'
        run: python3 scripts/emulator-alpha.py preflight --job successor-guard --candidate-sha "$CANDIDATE_SHA" --apps "$APPS"
      # The diagnostic reads the same pinned alpha output as the alpha build; its config gate is the alpha guard.
      - name: Emulator-alpha APK diagnostic preflight
        if: inputs.mode == 'emulator-alpha-apk-diagnostic'
        run: python3 scripts/emulator-alpha.py preflight --job guard
      - name: Emulator-alpha retained verification preflight
        if: inputs.mode == 'emulator-alpha-verify-retained'
        run: python3 scripts/emulator-alpha.py preflight --job guard
      # INFRA-ALPHA-120: the verification run's attempt directory is gone; its receipt exists only as its private artifact,
      # fetched here by the workflow's own artifact step with the job token and checked before the builder starts.
      - name: Emulator-alpha export preflight
        if: inputs.mode == 'emulator-alpha-export'
        run: python3 scripts/emulator-alpha.py preflight --job guard
      - name: Device-readiness contract check
        if: inputs.mode == 'device-readiness'
        run: python3 scripts/device-readiness.py check
      # FOLD-OBSERVE-WIRE-001: the committed observation bindings, hosted-only (no host path read), before any host starts.
      - name: Rango factory observation check
        if: inputs.mode == 'rango-factory-observe'
        run: python3 scripts/rango-factory-observe.py check
      # BLAZER-PREP: recipe drift, the committed host binding (unbound exits 4) and the stage bounds, hosted-only (no host
      # path read), before any host starts.
      # FOLD-FACTORY-PACKAGE: the literal pins against their committed sources and the step bounds, hosted-only (no
      # host path read), before any host starts.
      - name: Rango factory package check
        id: factory-package
        if: inputs.mode == 'rango-factory-package'
        run: python3 scripts/rango-factory-package-wiring.py check >> "$GITHUB_OUTPUT"
      # FOLD-FACTORY-INSPECT: the package-mode pins plus the retained-installer identity (unbound exits 4), hosted-only.
      - name: Rango factory inspect check
        id: factory-inspect
        if: inputs.mode == 'rango-factory-inspect'
        run: python3 scripts/rango-factory-inspect-wiring.py check >> "$GITHUB_OUTPUT"
      # LAUNCHER3-COMPILE: the pinned contract, the committed binding (an unbound input of the bound branch exits 4) and
      # the bounds, hosted-only (no host path read), before any host starts.
      - name: Launcher3 compile check
        id: launcher3-compile
        if: inputs.mode == 'launcher3-compile'
        run: python3 scripts/launcher3-compile.py check >> "$GITHUB_OUTPUT"
      # BLAZER-COMPILE: the recipe, the committed compile binding (unbound exits 4) and the bounds, hosted-only (no host
      # path read), before any host starts.
      # BLAZER-INTEGRATE: the committed integration binding (unbound exits 4) and the bounds, hosted-only (no host path
      # read), before any host starts.
      # FRANKEL-FACTORY: the committed binding and every derived pin against their sources, and the stage bounds,
