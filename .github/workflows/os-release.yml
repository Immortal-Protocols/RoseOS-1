        if: inputs.mode == 'models-sign'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: models-input-${{ github.run_id }}
          path: ${{ runner.temp }}/models-input
          retention-days: 1
          if-no-files-found: error
      - name: Fetch the original verification receipt (run 40777816699)
        if: inputs.mode == 'emulator-alpha-export'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: emulator-alpha-verification-40777816699
          run-id: 40777816699
          github-token: ${{ github.token }}
