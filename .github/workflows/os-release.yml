      - run: python3 scripts/release-pipeline.py preflight --job controller
      - run: python3 scripts/actions-gcp-login.py login "$GCP_CONTROLLER_SERVICE_ACCOUNT"
      - if: inputs.mode != 'blazer-prep' && inputs.mode != 'rango-factory-package' && inputs.mode != 'rango-factory-inspect' && inputs.mode != 'launcher3-compile' && inputs.mode != 'blazer-compile' && inputs.mode != 'blazer-integrate' && inputs.mode != 'mustang-build' && inputs.mode != 'mustang-bootstrap' && inputs.mode != 'mustang-delivery' && inputs.mode != 'mustang-ota' && inputs.mode != 'frankel-factory-observe' && inputs.mode != 'frankel-factory-package' && inputs.mode != 'app-inputs-export'
        run: python3 scripts/release-pipeline.py start-builder
      # The owned-builder modes this condition names only: record, before any start request, whether this operation is the one
      # starting the builder.
      - if: inputs.mode == 'blazer-prep' || inputs.mode == 'rango-factory-package' || inputs.mode == 'rango-factory-inspect' || inputs.mode == 'launcher3-compile' || inputs.mode == 'blazer-compile' || inputs.mode == 'blazer-integrate' || inputs.mode == 'mustang-build' || inputs.mode == 'mustang-bootstrap' || inputs.mode == 'mustang-delivery' || inputs.mode == 'mustang-ota' || inputs.mode == 'frankel-factory-observe' || inputs.mode == 'frankel-factory-package' || inputs.mode == 'app-inputs-export'
        run: python3 scripts/release-pipeline.py start-builder --ownership-record "$RUNNER_TEMP/builder-ownership.json"
      - name: Builder ownership
        id: ownership
        if: always() && (inputs.mode == 'blazer-prep' || inputs.mode == 'rango-factory-package' || inputs.mode == 'rango-factory-inspect' || inputs.mode == 'launcher3-compile' || inputs.mode == 'blazer-compile' || inputs.mode == 'blazer-integrate' || inputs.mode == 'mustang-build' || inputs.mode == 'mustang-bootstrap' || inputs.mode == 'mustang-delivery' || inputs.mode == 'mustang-ota' || inputs.mode == 'frankel-factory-observe' || inputs.mode == 'frankel-factory-package' || inputs.mode == 'app-inputs-export')
        run: python3 scripts/release-pipeline.py builder-ownership --ownership-record "$RUNNER_TEMP/builder-ownership.json" >> "$GITHUB_OUTPUT"
      - if: always()
        run: python3 scripts/actions-gcp-login.py logout

  builder:
    needs: controller
    if: inputs.mode == 'os-release' || (inputs.mode == 'latest-beta' || inputs.mode == 'latest-draft')
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 600
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SIGNER_SERVICE_ACCOUNT: ${{ vars.GCP_SIGNER_SERVICE_ACCOUNT }}
      # RELEASE020 M2c (default-off): latest-beta signs on the dedicated signer only when ROSE_SIGNING_TRANSPORT=dedicated.
      ROSE_DEDICATED_SIGNER: ${{ (inputs.mode == 'latest-beta' || inputs.mode == 'latest-draft') && vars.ROSE_SIGNING_TRANSPORT == 'dedicated' }}
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      build_number: ${{ steps.candidate.outputs.build_number }}
      build_timestamp: ${{ steps.candidate.outputs.build_timestamp }}
      apps: ${{ steps.candidate.outputs.apps }}
      channel: ${{ steps.candidate.outputs.channel }}
      dedicated: ${{ env.ROSE_DEDICATED_SIGNER }}
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
      signing_job: ${{ steps.package.outputs.job_dir }}
      signing_artifact_id: ${{ steps.upload-job.outputs.artifact-id }}
      signing_artifact_digest: ${{ steps.upload-job.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # the integration adapter checks out the exact candidate commit
          persist-credentials: false
      - run: python3 scripts/release-pipeline.py preflight --job builder
      # BUILDER-RECLAIM: before a space-hungry route writes, reclaim only the regenerable data that
      # os/release-pipeline/storage/builder-reclaim.json names, under the shared builder lock (a busy lock reclaims nothing).
      # Receipts: rose-actions/reclaim. The app-builder and mustang-build jobs run the same step.
      - name: Reclaim regenerable build data
        if: inputs.mode != 'latest-draft'
        run: python3 scripts/builder-reclaim.py apply --current-run "$GITHUB_RUN_ID" --label "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-builder"
      # latest-beta: one fresh candidate from the dispatch commit (scripts/release-allocate.py), reserved under the shared
      # lock before any identity is used. Its version-only delta is a deterministic local commit over that source, never
      # pushed; later main changes never reach it. The explicit os-release mode passes its pins through unchanged.
      - name: Candidate identity (allocated for latest-beta)
        id: candidate
        run: |
          set -euo pipefail
          if [[ "$MODE" == latest-beta ]]; then
            python3 scripts/release-allocate.py latest --out "$RUNNER_TEMP/allocation.json"
          else
            printf 'candidate_sha=%s\nbuild_number=%s\nbuild_timestamp=%s\n' "$CANDIDATE_SHA" "$BUILD_NUMBER" "$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          fi
      - name: Allocation record
        if: (inputs.mode == 'latest-beta' || inputs.mode == 'latest-draft')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: os-release-allocation-${{ github.run_id }}
          path: ${{ runner.temp }}/allocation.json
          retention-days: 7
          if-no-files-found: error
      - name: Prepare stage receipts
        run: |
          set -euo pipefail
          base="$HOME/rose-actions/$ROSE_DEVICE-$BUILD_NUMBER"
          if [[ "$RESUME_STAGE" == none ]]; then
            test ! -e "$base" || { echo "::error::$base already exists; use a new build number" >&2; exit 1; }
            python3 scripts/release-stage.py init --state "$base/stages" --source-revision "$CANDIDATE_SHA" --device "$ROSE_DEVICE" --build-number "$BUILD_NUMBER"
          else
            # The preserved attempt is only read: its build outputs are copied into a new attempt directory,
            # hashed into a new receipt chain bound to the old one, and the failed stage runs again there.
            source="$base${RESUME_SOURCE_RUN:+-resume-$RESUME_SOURCE_RUN}"
            base="$base-resume-$GITHUB_RUN_ID"
            test ! -e "$base"
            mkdir -p "$base/release"
            for name in unsigned-target_files.zip background-policy.json resolved-manifest.xml; do
              cp "$source/release/$name" "$base/release/$name"
            done
            carried=(--artifact "$base/release/unsigned-target_files.zip" --artifact "$base/release/background-policy.json"
              --artifact "$base/release/resolved-manifest.xml")
            if [[ "$RESUME_STAGE" == ota-verify ]]; then
              # The successful signed outputs are copied, never regenerated; the signing receipt binds them.
              mkdir "$base/release/public"
              cp "$source/release/signed-target_files.zip" "$source/release/sign-receipt.json" "$base/release/"
              cp "$source/release/public/"* "$base/release/public/"
              carried+=(--artifact "$base/release/signed-target_files.zip" --artifact "$base/release/sign-receipt.json"
                --expect "signed-target_files.zip=$RESUME_SIGNED_SHA256" --bind-receipt "$base/release/sign-receipt.json")
              for file in "$base/release/public/"*; do carried+=(--artifact "$file"); done
            fi
            python3 scripts/release-stage.py resume "$RESUME_STAGE" --from "$source/stages" --state "$base/stages" \
              --source-revision "$CANDIDATE_SHA" --expect "unsigned-target_files.zip=$RESUME_UNSIGNED_SHA256" "${carried[@]}"
          fi
          echo "ROSE_BASE=$base" >> "$GITHUB_ENV"
      # Signer access exists only around the two stages that need it; the pipeline drops it as soon
      # as each lead-managed entry point returns, and the final logout always runs.
      - name: Signer access for app signing
        if: inputs.resume_failed_stage == 'none'
        run: python3 scripts/actions-gcp-login.py login "$GCP_SIGNER_SERVICE_ACCOUNT"
      - name: Integrate (apps signed first) and build
        if: inputs.resume_failed_stage == 'none'
        run: bash scripts/os-release-stage.sh build build
      - name: Verify the unsigned build
        if: inputs.resume_failed_stage == 'none' || inputs.resume_failed_stage == 'bytes-verify'
        run: bash scripts/os-release-stage.sh bytes-verify verify-build
      # RELEASE020 M2 (opt-in, repository variable ROSE_SIGNING_TRANSPORT=package): package the verified unsigned build as
      # a hash-bound roseos.signing-job.v1 job for the dedicated signer (os-sign.yml) beside the attempt. Local only:
      # nothing is uploaded or sent and this run still signs on its existing route below.
      - name: Package the signing job for the dedicated signer (opt-in)
        id: package
        if: (inputs.mode == 'latest-beta' || inputs.mode == 'latest-draft') && (vars.ROSE_SIGNING_TRANSPORT == 'package' || vars.ROSE_SIGNING_TRANSPORT == 'dedicated')
        run: |
          set -euo pipefail
          read -r src otatools < <(python3 -c 'import json; h = json.load(open("os/release-pipeline/frankel.json"))["host"]; print(h["sourceRoot"], h["outDir"] + "/" + h["sign"]["otatools"])')
          git show "$CANDIDATE_SHA:os/release-notes/$ROSE_DEVICE-$BUILD_NUMBER.md" > "$RUNNER_TEMP/UPDATE.md"
          python3 scripts/release-transport.py package --release-dir "$ROSE_BASE/release" --otatools "$src/$otatools" \
            --device "$ROSE_DEVICE" --build "$BUILD_NUMBER" --timestamp "$BUILD_TIMESTAMP" --candidate "$CANDIDATE_SHA" \
            --notes "$RUNNER_TEMP/UPDATE.md" --config os/release-pipeline/frankel.json \
            --job-id "$ROSE_DEVICE-$BUILD_NUMBER-$GITHUB_RUN_ID" --out "$ROSE_BASE/signing-jobs" | tee "$RUNNER_TEMP/signing-job.json"
          job="$ROSE_BASE/signing-jobs/$ROSE_DEVICE-$BUILD_NUMBER-$GITHUB_RUN_ID"
          mkdir "$RUNNER_TEMP/signing-manifest" && cp "$job/manifest.json" "$RUNNER_TEMP/signing-manifest/"
          printf 'manifest_sha256=%s\njob_dir=%s\n' "$(python3 -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/signing-job.json"))["manifestSha256"])')" "$job" >> "$GITHUB_OUTPUT"
      # Dedicated mode: the hash-bound job goes to os-sign through normal same-repository Actions artifacts, and this
      # builder signs nothing (the dedicated route's signed outputs return through request-signing and signed-builder).
      - name: Signing job artifact for the dedicated signer
        id: upload-job
        if: env.ROSE_DEDICATED_SIGNER == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signing-job-${{ env.ROSE_DEVICE }}-${{ steps.candidate.outputs.build_number }}-${{ github.run_id }}
          path: ${{ steps.package.outputs.job_dir }}
          retention-days: 1
          if-no-files-found: error
      - name: Signing job manifest for acceptance
        if: env.ROSE_DEDICATED_SIGNER == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signing-manifest-${{ env.ROSE_DEVICE }}-${{ steps.candidate.outputs.build_number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/signing-manifest
          retention-days: 1
          if-no-files-found: error
      - name: Signer access for OS signing
        if: inputs.resume_failed_stage != 'ota-verify' && env.ROSE_DEDICATED_SIGNER != 'true'
        run: python3 scripts/actions-gcp-login.py login "$GCP_SIGNER_SERVICE_ACCOUNT"
      - name: Sign
        if: inputs.resume_failed_stage != 'ota-verify' && env.ROSE_DEDICATED_SIGNER != 'true'
        env:
          # Only a sign resume may move a failed attempt's task-owned partial release output aside (never deleted).
          ROSE_SIGN_RESUME_ARCHIVE: ${{ inputs.resume_failed_stage == 'sign' && format('failed-sign-{0}', github.run_id) || '' }}
        run: bash scripts/os-release-stage.sh sign sign
      - name: Drop signer access
        if: always()
        run: python3 scripts/actions-gcp-login.py logout
      - name: Verify the signed candidate
        if: env.ROSE_DEDICATED_SIGNER != 'true'
        run: bash scripts/os-release-stage.sh ota-verify verify-signed
      - name: Stage only public files and receipts
        if: env.ROSE_DEDICATED_SIGNER != 'true'
        run: bash scripts/os-release-stage.sh transfer stage-artifact --artifact-dir "$ROSE_BASE/artifact"
      - name: Transfer
        if: env.ROSE_DEDICATED_SIGNER != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: os-release-${{ env.ROSE_DEVICE }}-${{ steps.candidate.outputs.build_number }}
          path: ${{ env.ROSE_BASE }}/artifact
          retention-days: 3
          if-no-files-found: error

  # RELEASE020 M2c: the dedicated signer (default-off). Secret-free and OIDC-free; actions:write is the owner-approved
  # (19:41:06 UTC) permission to dispatch os-sign.yml@main once and read its outputs. Exactly the two canonical artifacts
  # of the one matching run are accepted against this job's manifest before anything reaches the builder again.
  request-signing:
    needs: builder
    if: (inputs.mode == 'latest-beta' || inputs.mode == 'latest-draft') && needs.builder.outputs.dedicated == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      JOB_ID: ${{ inputs.device || 'frankel' }}-${{ needs.builder.outputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Dispatch os-sign and wait for the one matching run
        id: sign
        run: |
          set -euo pipefail
          python3 scripts/release-transport.py request --source-run "$GITHUB_RUN_ID" \
            --artifact-id "${{ needs.builder.outputs.signing_artifact_id }}" \
            --artifact-digest "sha256:${{ needs.builder.outputs.signing_artifact_digest }}" \
            --manifest-sha256 "${{ needs.builder.outputs.manifest_sha256 }}" \
            --request-id "$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT.$JOB_ID" --job-id "$JOB_ID"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signing-manifest-${{ env.JOB_ID }}-${{ github.run_id }}
          path: ${{ runner.temp }}/job
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.sign.outputs.public_artifact_id }}
          run-id: ${{ steps.sign.outputs.sign_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/accepted/signed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.sign.outputs.target_artifact_id }}
          run-id: ${{ steps.sign.outputs.sign_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/accepted/target
      - name: Accept both signer artifacts against this job
        run: |
          set -euo pipefail
          python3 scripts/release-transport.py accept --job "$RUNNER_TEMP/job" --signed "$RUNNER_TEMP/accepted/signed" \
            --target "$RUNNER_TEMP/accepted/target"
          cp "$RUNNER_TEMP/job/manifest.json" "$RUNNER_TEMP/accepted/"
      - name: Accepted signer outputs for the builder
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-accepted-${{ env.JOB_ID }}-${{ github.run_id }}
          path: ${{ runner.temp }}/accepted
          retention-days: 1
          if-no-files-found: error

  # The dedicated route's remaining builder stages on the original builder: its sign stage installs the accepted bytes
  # (release-transport.py place, re-accepted against the builder's own job manifest), then the unchanged signed-candidate
  # verification, public staging and transfer run exactly as on the existing route. No credential or signer access.
  signed-builder:
    needs: [builder, request-signing]
    if: (inputs.mode == 'latest-beta' || inputs.mode == 'latest-draft') && needs.request-signing.result == 'success'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ needs.builder.outputs.candidate_sha }}
      BUILD_NUMBER: ${{ needs.builder.outputs.build_number }}
      BUILD_TIMESTAMP: ${{ needs.builder.outputs.build_timestamp }}
      APPS: ${{ needs.builder.outputs.apps }}
      CHANNEL: ${{ needs.builder.outputs.channel }}
      SIGNING_JOB: ${{ needs.builder.outputs.signing_job }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # No builder preflight: it requires the signer service-account binding this job deliberately lacks.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-accepted-${{ env.ROSE_DEVICE }}-${{ needs.builder.outputs.build_number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/accepted
      - name: Sign stage (install the accepted dedicated-signer outputs)
        run: |
          set -euo pipefail
          base="$HOME/rose-actions/$ROSE_DEVICE-$BUILD_NUMBER"
          test -d "$base/stages" && test -f "$SIGNING_JOB/manifest.json"
          cmp "$SIGNING_JOB/manifest.json" "$RUNNER_TEMP/accepted/manifest.json"
          echo "ROSE_BASE=$base" >> "$GITHUB_ENV"
          python3 scripts/release-stage.py run --state "$base/stages" --source-revision "$CANDIDATE_SHA" sign -- \
            python3 scripts/release-transport.py place --job "$SIGNING_JOB" --signed "$RUNNER_TEMP/accepted/signed" \
            --target "$RUNNER_TEMP/accepted/target" --release-dir "$base/release"
      - name: Verify the signed candidate
        run: bash scripts/os-release-stage.sh ota-verify verify-signed
      - name: Stage only public files and receipts
        run: bash scripts/os-release-stage.sh transfer stage-artifact --artifact-dir "$ROSE_BASE/artifact"
      - name: Transfer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: os-release-${{ env.ROSE_DEVICE }}-${{ needs.builder.outputs.build_number }}
          path: ${{ env.ROSE_BASE }}/artifact
          retention-days: 3
          if-no-files-found: error

  # Rose Agent alone from the exact candidate: no reconcile, make or OS signing, no OS secrets, no controller or Calculator.
  # Only the verified signed APK, its nonsecret receipt and SHA256SUMS leave the builder, as a private Actions artifact.
  app-builder:
    needs: controller
    if: inputs.mode == 'app-only'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      candidate_sha: ${{ steps.allocate.outputs.candidate_sha }}
      apps: ${{ steps.allocate.outputs.apps }}
      app_skip: ${{ steps.allocate.outputs.app_skip }}
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SIGNER_SERVICE_ACCOUNT: ${{ vars.GCP_SIGNER_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # the app release checks out the exact candidate commit as a worktree
          persist-credentials: false
      - run: python3 scripts/release-pipeline.py preflight --job builder
      - name: Reclaim regenerable build data
        run: python3 scripts/builder-reclaim.py apply --current-run "$GITHUB_RUN_ID" --label "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-app-builder"
      - run: python3 scripts/host-app-release.py --check
      - name: Prepare the app attempt
        run: |
          set -euo pipefail
          base="$HOME/rose-actions/app-$GITHUB_RUN_ID"
          test ! -e "$base"
          mkdir -p "$base"
          echo "ROSE_BASE=$base" >> "$GITHUB_ENV"
      # AGENT-BETA-AUTO (apps=auto): under the shared lock, before any signer access, allocate one fresh Rose Agent version
      # above every consumed one from the dispatched main commit, or skip when these sources are already published.
      # Exports CANDIDATE_SHA (the version-only derived candidate), APPS and APP_SKIP.
      - name: Allocate Rose Agent (apps=auto)
        id: allocate
        if: env.APPS == 'auto'
        run: python3 scripts/release-allocate.py app --out "$ROSE_BASE/app-allocation.json"
      - name: Signer access for app signing
        if: env.APP_SKIP != 'true'
        run: python3 scripts/actions-gcp-login.py login "$GCP_SIGNER_SERVICE_ACCOUNT"
      - name: Build, sign and verify Rose Agent
        if: env.APP_SKIP != 'true'
        run: ROSE_CANDIDATE_SHA="$CANDIDATE_SHA" ROSE_RELEASE_DIR="$ROSE_BASE/work" python3 scripts/host-app-release.py --artifact-dir "$ROSE_BASE/artifact"
      - name: Drop signer access
        if: always()
        run: python3 scripts/actions-gcp-login.py logout
      - name: Private Actions artifact
        if: env.APP_SKIP != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-release-dev.pixel.voice-${{ github.run_id }}
          path: ${{ env.ROSE_BASE }}/artifact
          retention-days: 3
          if-no-files-found: error
      - name: Remove the app attempt from the builder
        if: always()
        run: test -z "${ROSE_BASE:-}" || rm -rf "$ROSE_BASE"

  # Unsigned, test-only Cuttlefish build of the retained tree bound to the candidate (os/release-pipeline/cuttlefish-alpha.json):
  # own OUT_DIR under the shared lock; no reconcile, signing, secrets, publication or clean. Only the receipt leaves the builder.
  alpha-builder:
    needs: controller
    if: inputs.mode == 'emulator-alpha'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 600
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/emulator-alpha.py preflight --job builder
      - name: Prepare the alpha attempt
        run: |
          set -euo pipefail
          base="$HOME/rose-actions/cf-alpha-$GITHUB_RUN_ID"
          test ! -e "$base"
          mkdir -p "$base"
          echo "ROSE_BASE=$base" >> "$GITHUB_ENV"
      - name: Build the Cuttlefish alpha
        run: python3 scripts/emulator-alpha.py build --candidate-sha "$CANDIDATE_SHA" --apps "$APPS" --run-id "$GITHUB_RUN_ID" --build-timestamp "$BUILD_TIMESTAMP" --receipt-dir "$ROSE_BASE/receipt"
      - name: Receipt only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulator-alpha-receipt-${{ github.run_id }}
          path: ${{ env.ROSE_BASE }}/receipt
          retention-days: 7
          if-no-files-found: error
      - name: Remove the alpha attempt directory (the images stay in the alpha OUT_DIR)
        if: always()
        run: test -z "${ROSE_BASE:-}" || rm -rf "$ROSE_BASE"

  # Host preparation only (INFRA-ALPHA-108): the pinned alpha preparation moves in place to the configured delta by the
  # contract's one-file incremental patch, then a full re-hash and a probe (lunch only). No make, signing, secrets,
  # cloud identity, publication or config write; only the sanitized evidence leaves the builder, as a private artifact.
  alpha-successor:
    needs: controller
    if: inputs.mode == 'emulator-alpha-successor'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/emulator-alpha.py preflight --job successor-builder --candidate-sha "$CANDIDATE_SHA" --apps "$APPS"
      - name: Prepare the successor attempt
        run: |
          set -euo pipefail
          base="$HOME/rose-actions/cf-alpha-successor-$GITHUB_RUN_ID"
          test ! -e "$base"
          mkdir -p "$base"
          echo "ROSE_BASE=$base" >> "$GITHUB_ENV"
      - name: Transition, full re-hash and probe
        env:
          ALPHA_RECOVER: ${{ inputs.alpha_recover && '--recover' || '' }}
        run: python3 scripts/emulator-alpha.py successor-run --candidate-sha "$CANDIDATE_SHA" --apps "$APPS" --run-id "$GITHUB_RUN_ID" --build-timestamp "$BUILD_TIMESTAMP" --evidence-dir "$ROSE_BASE/evidence" $ALPHA_RECOVER
      - name: Sanitized evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulator-alpha-successor-${{ github.run_id }}
          path: ${{ env.ROSE_BASE }}/evidence
          retention-days: 7
          if-no-files-found: error
      - name: Remove the attempt directory (the successor and probe receipts stay beside the predecessor)
        if: always()
        run: test -z "${ROSE_BASE:-}" || rm -rf "$ROSE_BASE"

  # INFRA-ALPHA-116-DIAG: aapt evidence for system/priv-app/Shell, system/priv-app/IntentResolver and
  # system_ext/priv-app/Settings from the retained alpha super.img of run 40765631053, under the shared lock. No lunch,
  # make, signing, secrets, cloud identity or publication; the image gate is unchanged and nothing is marked verified.
  # Only the nonsecret diagnostic JSON leaves the builder, as a private artifact; the temporary extraction is removed.
  alpha-apk-diagnostic:
    needs: controller
    if: inputs.mode == 'emulator-alpha-apk-diagnostic'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/emulator-alpha.py preflight --job builder
      - name: Prepare the diagnostic attempt
        run: |
          set -euo pipefail
          base="$HOME/rose-actions/cf-alpha-apk-diagnostic-$GITHUB_RUN_ID"
          test ! -e "$base"
          mkdir -p "$base"
          echo "ROSE_BASE=$base" >> "$GITHUB_ENV"
      - name: Collect the three fixed APKs' aapt evidence
        run: python3 scripts/alpha-apk-diagnostic.py run --candidate-sha "$CANDIDATE_SHA" --apps "$APPS" --run-id "$GITHUB_RUN_ID" --build-timestamp "$BUILD_TIMESTAMP" --evidence-dir "$ROSE_BASE/evidence"
      - name: Diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulator-alpha-apk-diagnostic-${{ github.run_id }}
          path: ${{ env.ROSE_BASE }}/evidence
          retention-days: 7
          if-no-files-found: warn
      - name: Remove the diagnostic attempt directory
        if: always()
        run: test -z "${ROSE_BASE:-}" || rm -rf "$ROSE_BASE"

  # INFRA-ALPHA-117: the full alpha image gate (corrected Updater package scan) on run 40765631053's retained output,
  # bound to the super.img the ALPHA-116 diagnostic measured. No lunch, make, signing, secrets, cloud identity or
  # publication; only the verification receipt leaves the builder, as a private artifact.
  alpha-verify-retained:
    needs: controller
    if: inputs.mode == 'emulator-alpha-verify-retained'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/emulator-alpha.py preflight --job builder
      - name: Prepare the verification attempt
        run: |
          set -euo pipefail
          base="$HOME/rose-actions/cf-alpha-verify-retained-$GITHUB_RUN_ID"
          test ! -e "$base"
          mkdir -p "$base"
          echo "ROSE_BASE=$base" >> "$GITHUB_ENV"
      - name: Verify the retained alpha output (full image gate)
        run: python3 scripts/alpha-verify-retained.py run --candidate-sha "$CANDIDATE_SHA" --apps "$APPS" --run-id "$GITHUB_RUN_ID" --build-timestamp "$BUILD_TIMESTAMP" --receipt-dir "$ROSE_BASE/receipt"
      - name: Verification receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulator-alpha-verification-${{ github.run_id }}
          path: ${{ env.ROSE_BASE }}/receipt
          retention-days: 7
          if-no-files-found: warn
      - name: Remove the verification attempt directory (the images stay in the alpha OUT_DIR)
        if: always()
        run: test -z "${ROSE_BASE:-}" || rm -rf "$ROSE_BASE"

  # INFRA-ALPHA-120: the retained alpha images and host package run 40777816699 verified, re-read under the shared lock and
  # re-hashed against that run's checked receipt (alpha-export.py). No lunch, make, signing, secrets, login or publication;
  # only those files, the original receipt and a sanitized export receipt leave the builder, as a private artifact for
  # the separate alpha-runtime.yml workflow. The retained tree is only read; the attempt directory is removed.
  alpha-export:
    needs: controller
    if: inputs.mode == 'emulator-alpha-export'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/emulator-alpha.py preflight --job builder
      - name: Prepare the export attempt
        run: |
          set -euo pipefail
          base="$HOME/rose-actions/cf-alpha-export-$GITHUB_RUN_ID"
          test ! -e "$base"
          mkdir -p "$base"
          echo "ROSE_BASE=$base" >> "$GITHUB_ENV"
      - name: The receipt the guard checked
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: alpha-retained-verification-${{ github.run_id }}
          path: ${{ env.ROSE_BASE }}/original
      - name: Re-read the verified images against the original receipt and stage them
        run: python3 scripts/alpha-export.py export --receipt-dir "$ROSE_BASE/original" --export-dir "$ROSE_BASE/export" --candidate-sha "$CANDIDATE_SHA" --apps "$APPS" --run-id "$GITHUB_RUN_ID" --build-timestamp "$BUILD_TIMESTAMP"
      - name: Private Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulator-alpha-export-${{ github.run_id }}
          path: ${{ env.ROSE_BASE }}/export
          retention-days: 3
          if-no-files-found: error
      - name: Remove the export attempt directory (the retained images stay in the alpha OUT_DIR)
        if: always()
        run: test -z "${ROSE_BASE:-}" || rm -rf "$ROSE_BASE"

  # INFRA-APP-118: the signed Rose Agent a verified OS candidate bundled, read unchanged from that build's original attempt
  # under the shared lock (host-app-reuse.py). No app build, OS compile, signing, secrets, signer login or cloud identity;
  # only the APK, its nonsecret receipt and SHA256SUMS leave the builder, as the same private artifact app-only uploads.
  app-reuse:
    needs: controller
    if: inputs.mode == 'app-reuse'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # the candidate's own AndroidManifest.xml is read at the candidate commit
          persist-credentials: false
      - run: python3 scripts/host-app-reuse.py --check
      - name: Prepare the reuse attempt
        run: |
          set -euo pipefail
          base="$HOME/rose-actions/app-reuse-$GITHUB_RUN_ID"
          test ! -e "$base"
          mkdir -p "$base"
          echo "ROSE_BASE=$base" >> "$GITHUB_ENV"
      - name: Check the original build's receipts and copy only its signed Rose Agent
        run: python3 scripts/host-app-reuse.py --artifact-dir "$ROSE_BASE/artifact"
      - name: Private Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-release-dev.pixel.voice-${{ github.run_id }}
          path: ${{ env.ROSE_BASE }}/artifact
          retention-days: 3
          if-no-files-found: error
      - name: Remove the reuse attempt from the builder (the original attempt is untouched)
        if: always()
        run: test -z "${ROSE_BASE:-}" || rm -rf "$ROSE_BASE"

  # APP-INPUTS-EXPORT: the three signed Rose apps and the background policy of one recorded Frankel build, re-checked and
  # copied unchanged from its original attempt under the shared lock (host-app-inputs-export.py) for another builder
  # (Yogi, or Mustang on its own capacity), so it needs no new Frankel compile. Only those nine app files, the policy,
  # the export receipt and SHA256SUMS leave, privately. No app build, OS compile, signing, secrets, signer login, cloud
  # identity, download or publication; it stops the builder afterwards only if its own controller started it.
  app-inputs-export:
    needs: controller
    if: inputs.mode == 'app-inputs-export'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/host-app-inputs-export.py --check
      - name: Prepare the export attempt
        run: |
          set -euo pipefail
          base="$HOME/rose-actions/app-inputs-export-$GITHUB_RUN_ID"
          test ! -e "$base"
          mkdir -p "$base"
          echo "ROSE_BASE=$base" >> "$GITHUB_ENV"
      - name: Re-check the recorded build's signed apps and policy and copy them unchanged
        run: python3 scripts/host-app-inputs-export.py --artifact-dir "$ROSE_BASE/artifact"
      - name: Private Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-inputs-frankel-${{ inputs.build_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ROSE_BASE }}/artifact
          retention-days: 14
          if-no-files-found: error
      - name: Remove the export attempt from the builder (the original attempt is untouched)
        if: always()
        run: test -z "${ROSE_BASE:-}" || rm -rf "$ROSE_BASE"

  # FAM-HOST-READINESS-S002 (FIX001): one bounded, metadata-only inspection of the retained tree for frankel, blazer and
  # rango under the shared lock (scripts/device-readiness.py). contents: read only - no OIDC token, signer login, secret or
  # publisher. Filesystem bytes, bounded usage, pinned HEADs, hashes of required product, generated vendor and lunch-chain
  # files and factory presence. Nothing from the tree is executed (no envsetup, lunch, vendorsetup or cmds-for-envsetup:
  # no supported mechanism confines them), so the receipt is PARTIAL with lunch and target results unknown. No make,
  # download, sync, generation or clean. Only the sanitized receipt leaves; this attempt's own task root is removed.
  device-readiness:
    needs: controller
    if: inputs.mode == 'device-readiness'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Inspect the retained tree (bounded, under the shared lock)
        run: python3 scripts/device-readiness.py run --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --recipe-sha "$GITHUB_SHA" --evidence-dir "$RUNNER_TEMP/device-readiness"
      - name: Sanitized receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/device-readiness
          retention-days: 7
          if-no-files-found: warn
      - name: Remove only this attempt's task root
        if: always()
        run: python3 scripts/device-readiness.py cleanup --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

  # FOLD-OBSERVE-WIRE-001: read-only factory observation of the retained Rango build 2026103001 on the original builder
  # (scripts/rango-factory-observe.py; its own nonblocking shared lock, fixed committed read set, first-use material,
  # secrets, held artifacts and Blazer excluded). contents: read only - no OIDC token, signer login, secret or publication.
  # Bounds: the helper's internal 18 min, the outer timeout 20 min (+5 s kill), the job 22 min. LIMITATION: these do NOT
  # guarantee the builder VM stops within 30 minutes if scheduling, the control plane or cleanup fails; no independent
  # stop within that window is established (the existing 12h automatic STOP is the only fallback). Runtime is not approved.
  rango-factory-observe:
    needs: controller
    if: inputs.mode == 'rango-factory-observe'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: New task directory for this attempt
        run: |
          set -euo pipefail
          task="$RUNNER_TEMP/rango-factory-observe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$task"
          mkdir -m 0700 "$task"
          { echo "TASK_ROOT=$task"; echo "TASK_OUTPUT=$task/output"; echo "TASK_RECEIPTS=$task/receipts"; } >> "$GITHUB_ENV"
      - name: Observe the retained Rango build (bounded, under the shared lock)
        run: timeout --kill-after=5s 20m python3 scripts/rango-factory-observe.py run --run-id "$GITHUB_RUN_ID" --recipe-sha "$GITHUB_SHA" --out "$TASK_OUTPUT"
      - name: Allowlisted JSON receipts only
        if: always()
        run: |
          set -euo pipefail
          test -n "${TASK_ROOT:-}" || exit 0
          mkdir -m 0700 "$TASK_RECEIPTS"
          for name in rango-factory-observe.json target-files-observation.json firmware-members.json; do
            if [[ -f "$TASK_OUTPUT/$name" && ! -L "$TASK_OUTPUT/$name" ]]; then cp -- "$TASK_OUTPUT/$name" "$TASK_RECEIPTS/$name"; fi
          done
      - name: Receipts artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rango-factory-observe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TASK_RECEIPTS }}
          retention-days: 7
          if-no-files-found: warn
      - name: Remove this attempt's task directory
        if: always()
        run: test -z "${TASK_ROOT:-}" || rm -rf -- "$TASK_ROOT"

  blazer-prep:
    # BLAZER-PREP: one Pixel 10 Pro preparation stage (source, download, vendor or lunch) of scripts/blazer-build-only.py on the
    # original builder, with the committed os/build-only/blazer-prep-host.json inputs, in an isolated work tree (never the
    # production source root), under the nonblocking shared lock. The helper refuses symlinks, the production tree,
    # existing outputs, a held lock and insufficient space before a stage; vendor/lunch byte bounds are checked only
    # after execution (not an enforced quota), and descendant cleanup on timeout is not yet proven. No compile, make,
    # signing, secret, OIDC token or publication; contents: read only. Time: the helper's own stage timeout, the outer
    # timeout (+300 s, +30 s kill) and the job (+10 min), all derived from os/build-only/blazer.json by the hosted guard.
    # inspect (metadata only): the helper's --max-seconds 900, the outer 960 s (+30 s kill) and a 20-minute job; it passes
    # the bound host facts (receipt 41473133543's, re-checked by the helper) and the proposed --candidate-root of this run (never a binding; refused when no
    # candidates are committed), and its stdout is the write-once inspection.json receipt. git-inspect (metadata only):
    # `blazer-build-only.py inspect-git --host immortal-os-builder`, nothing else; the helper reads one level of the two
    # recipe-fixed vendor/adevtool/.git targets and at most 65 bytes of each HEAD within its own 60 s, takes no lock,
    # writes nothing and runs no git process; the outer 120 s (+30 s kill) and a 13-minute job; its stdout is the
    # write-once git-inspection.json receipt. git-inspect-set: `inspect-git-set --host immortal-os-builder --target-set
    # adevtool-projects-gitdir` (#443; the production .repo/projects/vendor/adevtool.git only), the same bounds, into the
    # write-once git-target-set-inspection.json receipt. git-inspect-objects (O2, #448): `inspect-git-objects --host
    # immortal-os-builder` only; the helper walks the fixed production .repo/project-objects/adevtool.git/objects through
    # no-follow directory descriptors (100000 entries, depth 3, cooperative 120 s, at most 64 KiB of JSON), opens no file
    # content, follows no link and takes no lock; the outer 180 s (+30 s kill) and a 14-minute job; its stdout is the
    # write-once git-objects-inspection.json receipt.
    # source: the helper's 7200 s copy (own-staging cleanup within its 240 s), the outer 7500 s (+30 s kill) and a 136-min
    # job. Exit 0 with complete:true means the byte copy finished, nothing more: provenance stays a production working-tree
    # snapshot with project revisions and the pinned manifest unverified. Exit 1 is refused/stopped (completed.json names
    # any staging left); 124/137 or a missing completed.json is UNKNOWN and never usable. Stage order is the helper's.
    # Cleanup stops the builder only if this run's controller started it. Runtime is not approved.
    needs: [guard, controller]
    if: inputs.mode == 'blazer-prep'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: ${{ fromJSON(needs.guard.outputs.blazer_prep_job_minutes || '1') }}
    permissions:
      contents: read
    env:
      OUTER_SECONDS: ${{ needs.guard.outputs.blazer_prep_outer_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: New task directory for this attempt
        run: |
          set -euo pipefail
          task="$RUNNER_TEMP/blazer-prep-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$task"
          mkdir -m 0700 "$task"
          { echo "TASK_ROOT=$task"; echo "TASK_RUN=$task/run"; echo "TASK_RECEIPTS=$task/receipts"; } >> "$GITHUB_ENV"
      - name: Preparation stage (bounded, under the shared lock)
        run: |
          set -euo pipefail
          [[ "$OUTER_SECONDS" =~ ^[1-9][0-9]{0,5}$ ]]
          python3 scripts/blazer-prep-wiring.py check --stage "$BLAZER_PREP_STAGE" | grep -qx "outer_seconds=$OUTER_SECONDS"
          timeout --kill-after=30s "${OUTER_SECONDS}s" python3 scripts/blazer-prep-wiring.py run --stage "$BLAZER_PREP_STAGE" --receipt-dir "$TASK_RUN" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          # An observer exits 0 whenever it printed a report, complete or not: the verdict decides the stage.
          timeout --kill-after=5s 60s python3 scripts/blazer-prep-wiring.py verdict --stage "$BLAZER_PREP_STAGE" --receipt-dir "$TASK_RUN"
      - name: Allowlisted JSON receipts only
        if: always()
        run: |
          set -euo pipefail
          test -n "${TASK_ROOT:-}" || exit 0
          mkdir -m 0700 "$TASK_RECEIPTS"
          for name in preflight.json started.json completed.json inspection.json git-inspection.json git-target-set-inspection.json git-objects-inspection.json binding-observation.json ssh-keygen-observation.json ssh-keygen-bind.json; do
            if [[ -f "$TASK_RUN/$name" && ! -L "$TASK_RUN/$name" ]]; then cp -- "$TASK_RUN/$name" "$TASK_RECEIPTS/$name"; fi
          done
      - name: Receipts artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blazer-prep-${{ inputs.blazer_prep_stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TASK_RECEIPTS }}
          retention-days: 7
          if-no-files-found: warn
      - name: Remove this attempt's task directory
        if: always()
        run: test -z "${TASK_ROOT:-}" || rm -rf -- "$TASK_ROOT"

  rango-factory-package:
    # FOLD-FACTORY-PACKAGE: packaging-only install ZIP of the retained signed Rango build 2026103001 by the Signing helper
    # scripts/host-factory-package.py (it holds the nonblocking shared builder lock for its whole run), then the existing
    # inspection commands of scripts/factory-package.py (observe; then Signing's scripts/rango-firmware-observe.py, whose
    # observation classify receives only when it exited 0 with its output, its refusal otherwise kept truthfully; then
    # classify; exit 3 with signatureVerified:false is the expected truthful result). The pins in
    # scripts/rango-factory-package-wiring.py are historical expected values checked before use, not current byte
    # proof. Everything stays in a new task directory under /home/pixelbuild/rose-actions (a proposed parent, refused
    # when absent). Two private run artifacts leave: the reports (package receipt, target-files observation, firmware
    # observation and its attempt record, classify report, cleanup report, and the package attempt record, which keeps the exit code and the helper's one-line JSON result when it
    # refuses before its receipt exists; 7 days) and, only after inspection reported and the ZIP's regular-file, size (proposed 8 GiB cap) and
    # sha256 checks against the helper receipt pass, the installer (exactly SHA256SUMS and the ZIP; 3 days). Never the
    # capped raw log or the target-files; nothing is published. contents: read only: no OIDC token, signer login, secret,
    # signing, download, install, phone action or publication. Time: per-step wrapper ceilings from the hosted guard
    # (package 5100 s, observe 600 s, firmware 570 s, classify 7200 s, stage 900 s, each +30 s kill; upload 45 min; job
    # 297 min), not
    # measurements or a guaranteed stop. 128 GiB free is the helper's precondition, not a usage cap. Cleanup stops the
    # builder only if this run's controller started it.
    # Runtime is not approved.
    needs: [guard, controller]
    if: inputs.mode == 'rango-factory-package'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: ${{ fromJSON(needs.guard.outputs.factory_job_minutes || '1') }}
    permissions:
      contents: read
    env:
      PACKAGE_SECONDS: ${{ needs.guard.outputs.factory_package_seconds }}
      OBSERVE_SECONDS: ${{ needs.guard.outputs.factory_observe_seconds }}
      FIRMWARE_SECONDS: ${{ needs.guard.outputs.factory_firmware_seconds }}
      CLASSIFY_SECONDS: ${{ needs.guard.outputs.factory_classify_seconds }}
      STAGE_SECONDS: ${{ needs.guard.outputs.factory_stage_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recheck the pins and bounds on the builder
        run: |
          set -euo pipefail
          for bound in "$PACKAGE_SECONDS" "$OBSERVE_SECONDS" "$FIRMWARE_SECONDS" "$CLASSIFY_SECONDS" "$STAGE_SECONDS"; do [[ "$bound" =~ ^[1-9][0-9]{0,5}$ ]]; done
          python3 scripts/rango-factory-package-wiring.py check > "$RUNNER_TEMP/factory-package-bounds"
          grep -qx "package_seconds=$PACKAGE_SECONDS" "$RUNNER_TEMP/factory-package-bounds"
          grep -qx "observe_seconds=$OBSERVE_SECONDS" "$RUNNER_TEMP/factory-package-bounds"
          grep -qx "firmware_seconds=$FIRMWARE_SECONDS" "$RUNNER_TEMP/factory-package-bounds"
          grep -qx "classify_seconds=$CLASSIFY_SECONDS" "$RUNNER_TEMP/factory-package-bounds"
          grep -qx "stage_seconds=$STAGE_SECONDS" "$RUNNER_TEMP/factory-package-bounds"
      - name: Package the install archive (bounded, under the helper's shared lock)
        run: timeout --kill-after=30s "${PACKAGE_SECONDS}s" python3 scripts/rango-factory-package-wiring.py package --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --attempt-record "$RUNNER_TEMP/rango-factory-package-attempt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Observe the signed target-files (bounded)
        run: timeout --kill-after=30s "${OBSERVE_SECONDS}s" python3 scripts/rango-factory-package-wiring.py observe --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Observe the firmware-carried partitions (bounded)
        run: timeout --kill-after=30s "${FIRMWARE_SECONDS}s" python3 scripts/rango-factory-package-wiring.py firmware-observe --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Classify the install archive (bounded)
        run: timeout --kill-after=30s "${CLASSIFY_SECONDS}s" python3 scripts/rango-factory-package-wiring.py classify --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Stage the installer for the private artifact (bounded)
        id: installer
        run: timeout --kill-after=30s "${STAGE_SECONDS}s" python3 scripts/rango-factory-package-wiring.py stage-installer --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Private installer artifact (exactly SHA256SUMS and the ZIP)
        id: installer-artifact
        timeout-minutes: 45
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rango-install-2026103001-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.installer.outputs.root }}/SHA256SUMS
            ${{ steps.installer.outputs.root }}/package/rango-install-2026103001.zip
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
      - name: Cleanup report and allowlisted receipts
        if: always()
        env:
          INSTALLER_UPLOAD: ${{ steps.installer-artifact.outcome || 'skipped' }}
        run: python3 scripts/rango-factory-package-wiring.py report --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --upload-dir "$RUNNER_TEMP/rango-factory-package-upload-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --installer-upload "$INSTALLER_UPLOAD" --attempt-record "$RUNNER_TEMP/rango-factory-package-attempt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Receipts artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rango-factory-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rango-factory-package-upload-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn

  frankel-factory-observe:
    # FRANKEL-FACTORY-OBSERVE: read-only measurement of the inputs a frankel-factory-package run would use, for the one
    # published Frankel (Pixel 10) build named in the committed os/factory-package/frankel.json (build,
    # buildTimestamp, candidate, sourceRun and signedTargetFilesSha256 must be bound there; the hosted guard exits 4
    # otherwise and no host starts). One bounded command (scripts/frankel-factory-package-wiring.py observe-inputs) takes
    # the existing shared builder lock (an existing regular file: never created, never waited on) and records, against
    # the binding: the original attempt /home/pixelbuild/rose-actions/frankel-<build> (its receipt chain complete through
    # transfer, not a resume), its sign receipt, its passing non-simulated verification receipt, the signed
    # target-files' own sha256 and the AVB key the package helper derives from it; the build's signing release directory
    # <sourceRoot>/releases/<build> (its owner and signed markers) and the otatools copy signing kept there (never the
    # shared OUT_DIR copy): its sha256 and size, its bin/fastboot member's sha256, its device/common generator members
    # against the flavor's generatorFixture pins and the helper's member refusals; the release script, and the one the
    # sign receipt records, against the provenance pin; and the free bytes the package helper's 128 GiB precondition
    # needs. sourceRun and publication are not verified (the receipt says so). It writes only frankel-factory-inputs.json in a new
    # task directory; nothing is packaged, copied, signed or changed. That receipt (7 days) is the only upload, and
    # otatoolsSha256 and fastbootSha256 are bound from it by a reviewed commit, never by this run. contents: read only:
    # no OIDC token, signer login, secret, signing, download, install, phone action or publication. Time: the
    # observation's own 900 s, the wrapper 1020 s (+30 s kill) and a 28-minute job, from the hosted guard; ceilings, not
    # measurements. Cleanup stops the builder only if this run's controller started it. Runtime is not approved.
    needs: [guard, controller]
    if: inputs.mode == 'frankel-factory-observe'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: ${{ fromJSON(needs.guard.outputs.frankel_observe_job_minutes || '1') }}
    permissions:
      contents: read
    env:
      OBSERVE_INPUTS_SECONDS: ${{ needs.guard.outputs.frankel_observe_inputs_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: New task directory for this attempt
        run: |
          set -euo pipefail
          task="$RUNNER_TEMP/frankel-factory-observe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$task"
          mkdir -m 0700 "$task"
          { echo "TASK_ROOT=$task"; echo "TASK_OUTPUT=$task/output"; echo "TASK_RECEIPTS=$task/receipts"; } >> "$GITHUB_ENV"
      - name: Recheck the binding and bounds on the builder
        run: |
          set -euo pipefail
          [[ "$OBSERVE_INPUTS_SECONDS" =~ ^[1-9][0-9]{0,5}$ ]]
          python3 scripts/frankel-factory-package-wiring.py check --stage observe > "$TASK_ROOT/bounds"
          grep -qx "observe_inputs_seconds=$OBSERVE_INPUTS_SECONDS" "$TASK_ROOT/bounds"
      - name: Observe the package inputs (bounded, read-only, under the shared lock)
        run: timeout --kill-after=30s "${OBSERVE_INPUTS_SECONDS}s" python3 scripts/frankel-factory-package-wiring.py observe-inputs --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --out "$TASK_OUTPUT"
      - name: Allowlisted JSON receipt only
        if: always()
        run: |
          set -euo pipefail
          test -n "${TASK_ROOT:-}" || exit 0
          mkdir -m 0700 "$TASK_RECEIPTS"
          name=frankel-factory-inputs.json
          if [[ -f "$TASK_OUTPUT/$name" && ! -L "$TASK_OUTPUT/$name" ]]; then cp -- "$TASK_OUTPUT/$name" "$TASK_RECEIPTS/$name"; fi
      - name: Receipts artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frankel-factory-observe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TASK_RECEIPTS }}
          retention-days: 7
          if-no-files-found: warn
      - name: Remove this attempt's task directory
        if: always()
        run: test -z "${TASK_ROOT:-}" || rm -rf -- "$TASK_ROOT"

  frankel-factory-package:
    # FRANKEL-FACTORY-PACKAGE: packaging-only initial factory installer frankel-install-<build>.zip of the one published
    # Frankel build named in the committed os/factory-package/frankel.json (every value bound there, otatoolsSha256
    # and fastbootSha256 from a frankel-factory-observe receipt; the hosted guard exits 4 otherwise and no host starts),
    # from that build's original attempt's own release/signed-target_files.zip, with the otatools copy its signing kept in
    # <sourceRoot>/releases/<build>. The shared steps of
    # scripts/factory_package_route.py, the same as rango-factory-package's with no Rango pin, image or receipt: Signing's
    # scripts/host-factory-package.py (it holds the nonblocking shared builder lock for its whole run and checks the AVB
    # key it derives from the signed target-files against the flavor's pin), then scripts/factory-package.py observe,
    # Signing's scripts/rango-firmware-observe.py --device frankel (its observation reaches classify only when it exited 0
    # with its output, its refusal otherwise kept truthfully) and classify. No archive signature is added: classify
    # reports signatureVerified missing (exit 3 is the expected truthful result), and every record carries the
    # unsigned-intermediate label: not factory-ready and not the delivered installer. Everything stays in a new task
    # directory under /home/pixelbuild/rose-actions (refused when absent). Two private run artifacts leave: the reports
    # (package receipt, target-files observation, firmware observation and its attempt record, classify report, cleanup
    # report and the package attempt record; 7 days) and, only after inspection reported and the ZIP's regular-file, size
    # (proposed 8 GiB cap) and sha256 checks against the helper receipt pass, the installer (exactly SHA256SUMS and the
    # ZIP; 3 days). Never the capped raw log or the target-files; nothing is published. contents: read only: no OIDC
    # token, signer login, secret, signing, download, install, phone action or publication. Time: the Rango route's
    # per-step wrapper ceilings from the hosted guard (package 5100 s, observe 600 s, firmware 570 s, classify 7200 s,
    # stage 900 s, each +30 s kill; upload 45 min; job 297 min), not measurements or a guaranteed stop. 128 GiB free is the
    # helper's precondition, not a usage cap. Cleanup stops the builder only if this run's controller started it.
    # Runtime is not approved.
    needs: [guard, controller]
    if: inputs.mode == 'frankel-factory-package'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: ${{ fromJSON(needs.guard.outputs.frankel_package_job_minutes || '1') }}
    permissions:
      contents: read
    env:
      PACKAGE_SECONDS: ${{ needs.guard.outputs.frankel_package_seconds }}
      OBSERVE_SECONDS: ${{ needs.guard.outputs.frankel_observe_seconds }}
      FIRMWARE_SECONDS: ${{ needs.guard.outputs.frankel_firmware_seconds }}
      CLASSIFY_SECONDS: ${{ needs.guard.outputs.frankel_classify_seconds }}
      STAGE_SECONDS: ${{ needs.guard.outputs.frankel_stage_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recheck the binding, pins and bounds on the builder
        run: |
          set -euo pipefail
          for bound in "$PACKAGE_SECONDS" "$OBSERVE_SECONDS" "$FIRMWARE_SECONDS" "$CLASSIFY_SECONDS" "$STAGE_SECONDS"; do [[ "$bound" =~ ^[1-9][0-9]{0,5}$ ]]; done
          python3 scripts/frankel-factory-package-wiring.py check --stage package > "$RUNNER_TEMP/frankel-factory-package-bounds"
          grep -qx "package_seconds=$PACKAGE_SECONDS" "$RUNNER_TEMP/frankel-factory-package-bounds"
          grep -qx "observe_seconds=$OBSERVE_SECONDS" "$RUNNER_TEMP/frankel-factory-package-bounds"
          grep -qx "firmware_seconds=$FIRMWARE_SECONDS" "$RUNNER_TEMP/frankel-factory-package-bounds"
          grep -qx "classify_seconds=$CLASSIFY_SECONDS" "$RUNNER_TEMP/frankel-factory-package-bounds"
          grep -qx "stage_seconds=$STAGE_SECONDS" "$RUNNER_TEMP/frankel-factory-package-bounds"
      - name: Package the install archive (bounded, under the helper's shared lock)
        run: timeout --kill-after=30s "${PACKAGE_SECONDS}s" python3 scripts/frankel-factory-package-wiring.py package --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --attempt-record "$RUNNER_TEMP/frankel-factory-package-attempt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Observe the signed target-files (bounded)
        run: timeout --kill-after=30s "${OBSERVE_SECONDS}s" python3 scripts/frankel-factory-package-wiring.py observe --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Observe the firmware-carried partitions (bounded)
        run: timeout --kill-after=30s "${FIRMWARE_SECONDS}s" python3 scripts/frankel-factory-package-wiring.py firmware-observe --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Classify the install archive (bounded)
        run: timeout --kill-after=30s "${CLASSIFY_SECONDS}s" python3 scripts/frankel-factory-package-wiring.py classify --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Stage the installer for the private artifact (bounded)
        id: installer
        run: timeout --kill-after=30s "${STAGE_SECONDS}s" python3 scripts/frankel-factory-package-wiring.py stage-installer --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Private installer artifact (exactly SHA256SUMS and the ZIP; an unsigned intermediate)
        id: installer-artifact
        timeout-minutes: 45
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frankel-install-unsigned-intermediate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.installer.outputs.root }}/SHA256SUMS
            ${{ steps.installer.outputs.root }}/${{ steps.installer.outputs.file }}
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
      - name: Cleanup report and allowlisted receipts
        if: always()
        env:
          INSTALLER_UPLOAD: ${{ steps.installer-artifact.outcome || 'skipped' }}
        run: python3 scripts/frankel-factory-package-wiring.py report --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --upload-dir "$RUNNER_TEMP/frankel-factory-package-upload-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --installer-upload "$INSTALLER_UPLOAD" --attempt-record "$RUNNER_TEMP/frankel-factory-package-attempt-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
      - name: Receipts artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frankel-factory-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frankel-factory-package-upload-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn

  rango-factory-inspect:
    # FOLD-FACTORY-INSPECT: no regeneration. One bounded command (scripts/rango-factory-inspect-wiring.py inspect) holds
    # the nonblocking shared builder lock for its whole run, verifies the installer ZIP an earlier rango-factory-package
    # run retained (regular file without symlinks, the committed size and sha256, and its package receipt recording that
    # same output; any mismatch refuses before any inspection), then runs observe, Signing's firmware observer and
    # classify of that ZIP, each tool call in its own process group with its own time bound and the retained-ZIP hash
    # within its own in-process bound. Everything is written to a new task directory; the retained one is only read.
    # Only the inspection JSON reports and an observed cleanup report are uploaded (7 days); never the ZIP, the
    # target-files or a log. Cleanup reports, it does not guarantee: an empty classify-work is removed, anything an
    # interrupted run left is listed (classifyWorkLeft) and kept. contents: read only: no OIDC token, signer login,
    # secret, signing, download, install, phone action or publication. Time: verify 300 s, observe 600 s, firmware 570 s,
    # classify 2700 s (about ten times the work's estimate), each +30 s kill, +120 s margin = outer 4410 s; job 84 min;
    # ceilings, not measurements; a stop is a recorded failure, never a pass. Cleanup
    # stops the builder only if this run's controller started it. Runtime is not approved.
    needs: [guard, controller]
    if: inputs.mode == 'rango-factory-inspect'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: ${{ fromJSON(needs.guard.outputs.inspect_job_minutes || '1') }}
    permissions:
      contents: read
    env:
      OUTER_SECONDS: ${{ needs.guard.outputs.inspect_outer_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recheck the pins and bounds on the builder
        run: |
          set -euo pipefail
          [[ "$OUTER_SECONDS" =~ ^[1-9][0-9]{0,5}$ ]]
          python3 scripts/rango-factory-inspect-wiring.py check | grep -qx "outer_seconds=$OUTER_SECONDS"
      - name: Inspect the retained installer (bounded, under the shared lock)
        run: timeout --kill-after=30s "${OUTER_SECONDS}s" python3 scripts/rango-factory-inspect-wiring.py inspect --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Cleanup report and allowlisted reports
        if: always()
        run: python3 scripts/rango-factory-inspect-wiring.py report --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --upload-dir "$RUNNER_TEMP/rango-factory-inspect-upload-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Reports artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rango-factory-inspect-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rango-factory-inspect-upload-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn

  launcher3-compile:
    # LAUNCHER3-COMPILE: a compile-only proof of RoseOS's Launcher3 changes. One bounded command
    # (scripts/launcher3-compile.py run) holds the nonblocking shared builder lock for its whole run, byte-copies the
    # bound source tree read-only into a new run root under the binding's taskParent, checks the copy for the bound
    # branch (verifyIntegrated, or verifyBaseApplyCandidate with the candidate delta applied in that copy only; never the
    # source tree, never a reset), and only then runs a contained `m -j8 Launcher3QuickStepLib` with both aconfig flag
    # outputs. A frankel lunch first checks OS Product's pinned lunch inputs in the copy (1800 s) and runs the admitted
    # adevtool public fetch into the copy's vendor/adevtool/.git (1800 s, 1 GiB), only when the binding's adevtoolGit is
    # bound. Its own bounds: copy 7200 s, tree pins 1800 s per check, lunch 1200 s, compile 7200 s with sampled output and memory
    # stops (ceilings, not measurements; a stop is a recorded failure, never a pass), each +30 s kill; the outer and job
    # times are derived from the helper by the hosted guard and re-checked here. The run step execs timeout, so a cancel
    # reaches it and it forwards the signal; the outer timeout's TERM or that cancel makes the helper end its running
    # stage's whole session within about 6 s (inside a cancel's 7.5 s before the runner's SIGTERM, and inside the 30 s
    # kill-after) and report interrupted. finish waits for the run's lock and ends a recorded stage session that
    # outlived it, else removes nothing. finish always runs: it uploads only
    # report.json, classification.json and cleanup.json (7 days; never a log, the tree or outputs) and removes only this
    # run's tree, out, home and tmp (cleanup.json says what it removed or left). contents: read only: no OIDC token,
    # signer login, secret, signing, packaging, install, phone action or publication, and no download but that admitted
    # fetch. Cleanup stops the builder
    # only if this run's controller started it. Runtime is not approved.
    needs: [guard, controller]
    if: inputs.mode == 'launcher3-compile'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: ${{ fromJSON(needs.guard.outputs.launcher3_job_minutes || '1') }}
    permissions:
      contents: read
    env:
      OUTER_SECONDS: ${{ needs.guard.outputs.launcher3_outer_seconds }}
      FINISH_SECONDS: ${{ needs.guard.outputs.launcher3_finish_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Recheck the contract, binding and bounds on the builder
        run: |
          set -euo pipefail
          [[ "$OUTER_SECONDS" =~ ^[1-9][0-9]{0,5}$ && "$FINISH_SECONDS" =~ ^[1-9][0-9]{0,4}$ ]]
          python3 scripts/launcher3-compile.py check > "$RUNNER_TEMP/launcher3-check.txt"
          grep -qx "outer_seconds=$OUTER_SECONDS" "$RUNNER_TEMP/launcher3-check.txt"
          grep -qx "finish_seconds=$FINISH_SECONDS" "$RUNNER_TEMP/launcher3-check.txt"
      - name: Compile (bounded, under the shared lock)
        run: exec timeout --kill-after=30s "${OUTER_SECONDS}s" python3 scripts/launcher3-compile.py run --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Allowlisted reports and this run's cleanup
        if: always()
        run: timeout --kill-after=30s "${FINISH_SECONDS}s" python3 scripts/launcher3-compile.py finish --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --upload-dir "$RUNNER_TEMP/launcher3-compile-upload-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Reports artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launcher3-compile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/launcher3-compile-upload-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn

  blazer-compile:
    # BLAZER-COMPILE: one first build of the four blazer make goals (vendorbootimage, vendorkernelbootimage,
    # target-files-package, otatools-package) by Flavors' scripts/blazer-build-only.py run --stage compile, in the
    # isolated blazer-prep work tree (never the production source root), under the nonblocking shared lock. The helper
    # refuses before compiling unless the tree is isolated and carries the admitted Rose integration
    # (blazer_integration.compile_problems against the bound integration receipt and local-inputs.json), the lock is
    # free and available minus the reviewed 250 GiB first-build allowance stays above the reserve; the allowance is a
    # sampled stop, not a quota, and compile.timeoutSeconds (8 h, a first-build cap, not a measurement) stops the process
    # group. Outputs stay on the builder; only preflight.json, started.json and completed.json (the collected output
    # paths, sizes and sha256) are uploaded (7 days). No signing, packaging, secret, OIDC token or publication;
    # contents: read only. Time: the outer timeout (+300 s, +30 s kill) and the job (+10 min) are derived from the
    # recipe by the hosted guard. Cleanup stops the builder only if this run's controller started it. Runtime is not
    # approved.
    needs: [guard, controller]
    if: inputs.mode == 'blazer-compile'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: ${{ fromJSON(needs.guard.outputs.blazer_compile_job_minutes || '1') }}
    permissions:
      contents: read
    env:
      OUTER_SECONDS: ${{ needs.guard.outputs.blazer_compile_outer_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: New task directory for this attempt
        run: |
          set -euo pipefail
          task="$RUNNER_TEMP/blazer-compile-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$task"
          mkdir -m 0700 "$task"
          { echo "TASK_ROOT=$task"; echo "TASK_RUN=$task/run"; echo "TASK_RECEIPTS=$task/receipts"; } >> "$GITHUB_ENV"
      - name: Compile (bounded, under the shared lock)
        run: |
          set -euo pipefail
          [[ "$OUTER_SECONDS" =~ ^[1-9][0-9]{0,5}$ ]]
          python3 scripts/blazer-compile-wiring.py check | grep -qx "outer_seconds=$OUTER_SECONDS"
          timeout --kill-after=30s "${OUTER_SECONDS}s" python3 scripts/blazer-compile-wiring.py run --receipt-dir "$TASK_RUN"
      - name: Allowlisted JSON receipts only
        if: always()
        run: |
          set -euo pipefail
          test -n "${TASK_ROOT:-}" || exit 0
          mkdir -m 0700 "$TASK_RECEIPTS"
          for name in preflight.json started.json completed.json; do
            if [[ -f "$TASK_RUN/$name" && ! -L "$TASK_RUN/$name" ]]; then cp -- "$TASK_RUN/$name" "$TASK_RECEIPTS/$name"; fi
          done
      - name: Receipts artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blazer-compile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.TASK_RECEIPTS }}
          retention-days: 7
          if-no-files-found: warn
      - name: Remove this attempt's task directory
        if: always()
        run: test -z "${TASK_ROOT:-}" || rm -rf -- "$TASK_ROOT"

  blazer-integrate:
    # BLAZER-INTEGRATE: the Rose integration of the isolated blazer-prep work tree (after git-meta), by the existing
    # owners' commands only, in order, each bounded, stopping at the first failure (scripts/blazer-integrate-wiring.py
    # run): the two SDK tools re-hashed against their expected sha256, a fresh collision-checked blazer build reserved
    # under the shared lock (scripts/blazer-allocate.py; the work and reconcile directories derive from it), the reconcile seed from the one Frankel receipt that matches the copy (re-verifying the copy's expected
    # inventory), the already-signed candidate bundle, Flavors' admit and render, a local worktree of this checkout as
    # the candidate, then exactly the host-reconcile apply command render printed, under the nonblocking shared lock.
    # The tree changes only through host-reconcile's own owner-conflict checks; nothing is retried, reset or adopted.
    # Only integrate.json, the seed provenance, the admitted local-inputs.json, the rendered config and the newest
    # reconcile receipt are uploaded (7 days). No signing, compile, secret, OIDC token or publication; contents: read
    # only. Time: eight step ceilings (tools 300 s, allocate 120 s, seed 600 s, assemble 300 s, admit 600 s, render 120 s,
    # candidate 300 s, reconcile 3600 s), +30 s kill each, +300 s margin = outer 6480 s; job 119 minutes; ceilings, not
    # measurements. Cleanup stops
    # the builder only if this run's controller started it. Runtime is not approved.
    needs: [guard, controller]
    if: inputs.mode == 'blazer-integrate'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: ${{ fromJSON(needs.guard.outputs.blazer_integrate_job_minutes || '1') }}
    permissions:
      contents: read
    env:
      OUTER_SECONDS: ${{ needs.guard.outputs.blazer_integrate_outer_seconds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Integrate (bounded, stopping at the first failure)
        run: |
          set -euo pipefail
          [[ "$OUTER_SECONDS" =~ ^[1-9][0-9]{0,5}$ ]]
          python3 scripts/blazer-integrate-wiring.py check | grep -qx "outer_seconds=$OUTER_SECONDS"
          run_dir="$RUNNER_TEMP/blazer-integrate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          timeout --kill-after=30s "${OUTER_SECONDS}s" python3 scripts/blazer-integrate-wiring.py run --run-dir "$run_dir" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Allowlisted reports
        if: always()
        run: python3 scripts/blazer-integrate-wiring.py report --run-dir "$RUNNER_TEMP/blazer-integrate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --upload-dir "$RUNNER_TEMP/blazer-integrate-upload-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Reports artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blazer-integrate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blazer-integrate-upload-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn

  publisher:
    needs: [builder, signed-builder]
    # The existing route (signed-builder skipped) or the dedicated route only after signed-builder succeeded.
    if: always() && needs.builder.result == 'success' && (needs.signed-builder.result == 'success' || (needs.builder.outputs.dedicated != 'true' && needs.signed-builder.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PIXEL_OTA_PUBLISHER: ${{ vars.PIXEL_OTA_PUBLISHER }}
      PIXEL_OTA_APP_ID: ${{ vars.PIXEL_OTA_APP_ID }}
      PIXEL_OTA_APP_KEY_PRESENT: ${{ secrets.PIXEL_OTA_APP_PRIVATE_KEY != '' }}
      # The builder's candidate identity: the explicit pins, or the latest-beta allocation.
      CANDIDATE_SHA: ${{ needs.builder.outputs.candidate_sha }}
      BUILD_NUMBER: ${{ needs.builder.outputs.build_number }}
      BUILD_TIMESTAMP: ${{ needs.builder.outputs.build_timestamp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # latest-beta re-derives its candidate and notes from the captured source history
          persist-credentials: false
      - run: python3 scripts/release-pipeline.py preflight --job publisher
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: os-release-${{ env.ROSE_DEVICE }}-${{ needs.builder.outputs.build_number }}
          path: ${{ runner.temp }}/artifact
      - if: (inputs.mode == 'latest-beta' || inputs.mode == 'latest-draft')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: os-release-allocation-${{ github.run_id }}
          path: ${{ runner.temp }}/allocation
      # Short-lived token for the pixel-ota installation only; the action revokes it when the job ends.
      - name: Mint pixel-ota publisher token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PIXEL_OTA_APP_ID }}
          private-key: ${{ secrets.PIXEL_OTA_APP_PRIVATE_KEY }}
          owner: Immortal-Protocols
          repositories: pixel-ota
          permission-contents: write
      - name: Revalidate, draft, download-check and promote if requested
        env:
          PIXEL_OTA_TOKEN: ${{ steps.app.outputs.token }}
          EXPLICIT_PROMOTE: ${{ inputs.promote }}
        run: |
          set -euo pipefail
          extra=()
          # latest-beta: a fresh tag only, notes from the captured source range, Beta Latest after the download check.
          if [[ "$MODE" == latest-beta ]]; then
            extra=(--allocation "$RUNNER_TEMP/allocation/allocation.json")
            [[ "${DRAFT_ONLY:-false}" == true ]] || extra+=(--promote)
          fi
          # Defense in depth: the publisher refuses an invalid private request even if the guard were bypassed.
          [[ "${DRAFT_ONLY:-false}" != true || ( "$MODE" == latest-beta && "$EXPLICIT_PROMOTE" == false && -z "${CAMPAIGN:-}" ) ]]
          [[ "$EXPLICIT_PROMOTE" != true ]] || extra+=(--promote)
          python3 scripts/release-pipeline.py publish --device "$ROSE_DEVICE" --candidate-sha "$CANDIDATE_SHA" --build-number "$BUILD_NUMBER" \
            --build-timestamp "$BUILD_TIMESTAMP" --channel "$CHANNEL" --artifact-dir "$RUNNER_TEMP/artifact" \
            "${extra[@]}"

  # Public Rose Agent APK (app-only or app-reuse with app_publish): hosted, after the builder's verified private artifact.
  # Only this job mints the pixel-ota App token (revoked by the action at job end); the builder never receives it.
  app-publisher:
    needs: [app-builder, app-reuse]
    if: >-
      !cancelled() && inputs.app_publish &&
      ((inputs.mode == 'app-only' && needs.app-builder.result == 'success' && needs.app-builder.outputs.app_skip != 'true') ||
      (inputs.mode == 'app-reuse' && needs.app-reuse.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # apps=auto: the builder's allocated candidate and version; explicit app-only and app-reuse keep their inputs.
      CANDIDATE_SHA: ${{ needs.app-builder.outputs.candidate_sha || inputs.candidate_sha }}
      APPS: ${{ needs.app-builder.outputs.apps || inputs.apps }}
      PIXEL_OTA_PUBLISHER: ${{ vars.PIXEL_OTA_PUBLISHER }}
      PIXEL_OTA_APP_ID: ${{ vars.PIXEL_OTA_APP_ID }}
      PIXEL_OTA_APP_KEY_PRESENT: ${{ secrets.PIXEL_OTA_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/release-pipeline.py preflight --job publisher
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-release-dev.pixel.voice-${{ github.run_id }}
          path: ${{ runner.temp }}/app-artifact
      - name: Mint pixel-ota publisher token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PIXEL_OTA_APP_ID }}
          private-key: ${{ secrets.PIXEL_OTA_APP_PRIVATE_KEY }}
          owner: Immortal-Protocols
          repositories: pixel-ota
          permission-contents: write
      - name: Verify the signed APK and publish its own prerelease
        env:
          PIXEL_OTA_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          reuse=()
          [[ "$MODE" != app-reuse ]] || reuse=(--reuse-binding "$REUSE_BINDING" --build-number "$BUILD_NUMBER" --build-timestamp "$BUILD_TIMESTAMP")
          python3 scripts/app_release_publisher.py --artifact-dir "$RUNNER_TEMP/app-artifact" --candidate-sha "$CANDIDATE_SHA" --apps "$APPS" --public-dir "$RUNNER_TEMP/app-public" "${reuse[@]}"
      - name: Public publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-publication-dev.pixel.voice-${{ github.run_id }}
          path: ${{ runner.temp }}/app-public
          retention-days: 7
          if-no-files-found: error

  # OCT29-INFRA-S005: one reviewed signing-bootstrap profile (scripts/signing-bootstrap.py). The preflight runs before any
  # login; signer access exists only around the bootstrap step. No build, integrate, OS signing or publisher job runs in
  # this mode and no publisher credential reaches the builder. Only the allowlisted public receipt leaves.
  signing-bootstrap:
    needs: controller
    if: inputs.mode == 'signing-bootstrap'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SIGNER_SERVICE_ACCOUNT: ${{ vars.GCP_SIGNER_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Profile, tool and access preflight (before any login)
        run: python3 scripts/signing-bootstrap.py preflight --profile "$BOOTSTRAP_PROFILE" --recipe-sha "$GITHUB_SHA"
      # OCT30-INFRA-S016: profiles with a localProof (Fold) prove their four tools on this host under the shared lock with
      # the admitted helper, before any login; the bounded proof is bound to this run. Fixed summary codes only.
      - name: Local tool proof (before any login)
        run: python3 scripts/signing-bootstrap.py prove --profile "$BOOTSTRAP_PROFILE" --recipe-sha "$GITHUB_SHA" --proof-dir "$RUNNER_TEMP/signing-bootstrap-proof"
      - name: Signer access for the bootstrap only
        run: python3 scripts/actions-gcp-login.py login "$GCP_SIGNER_SERVICE_ACCOUNT"
      - name: Bootstrap under the shared lock
        run: python3 scripts/signing-bootstrap.py run --profile "$BOOTSTRAP_PROFILE" --recipe-sha "$GITHUB_SHA" --state-dir "$HOME/rose-signing-bootstrap" --receipt-dir "$RUNNER_TEMP/signing-bootstrap" --proof-file "$RUNNER_TEMP/signing-bootstrap-proof/fold-tool-proof.json"
      - name: Drop signer access
        if: always()
        run: python3 scripts/actions-gcp-login.py logout
      - name: Public receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signing-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signing-bootstrap/signing-bootstrap-receipt.json
          retention-days: 7
          if-no-files-found: warn

  # OCT30-INFRA-S013: sign the retained unsigned Models APK with the protected models-v0 identity through the PR #149
  # adapter (scripts/host-models-sign.py). Preflight (guard-verified input recheck, bootstrap journal, SDK archive and JDK tree proofs) runs
  # before any login; signer access exists only around the run. No build, OS signing or publisher job runs in this mode
  # and no publisher credential reaches the builder. Only the signed APK and nonsecret receipts leave, privately.
  models-signer:
    needs: controller
    if: inputs.mode == 'models-sign'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SIGNER_SERVICE_ACCOUNT: ${{ vars.GCP_SIGNER_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: models-bootstrap-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/models-bootstrap
      - name: Fresh consumer directory for the verified input
        run: test ! -e "$RUNNER_TEMP/models-input"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: models-input-${{ github.run_id }}
          path: ${{ runner.temp }}/models-input
      - name: Input recheck, journal, SDK archive and JDK proofs (before any login)
        run: python3 scripts/host-models-sign.py preflight --receipt-dir "$RUNNER_TEMP/models-bootstrap" --input-dir "$RUNNER_TEMP/models-input/input" --ingress-receipt "$RUNNER_TEMP/models-input/models-input-receipt.json"
      - name: Signer access for Models signing only
        run: python3 scripts/actions-gcp-login.py login "$GCP_SIGNER_SERVICE_ACCOUNT"
      - name: Sign under the shared lock
        run: python3 scripts/host-models-sign.py run --receipt-dir "$RUNNER_TEMP/models-bootstrap" --output-dir "$RUNNER_TEMP/models-signed" --input-dir "$RUNNER_TEMP/models-input/input" --ingress-receipt "$RUNNER_TEMP/models-input/models-input-receipt.json"
      - name: Drop signer access
        if: always()
        run: python3 scripts/actions-gcp-login.py logout
      - name: Private signed APK and receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: models-signed-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/models-signed/rose-models-signed.apk
            ${{ runner.temp }}/models-signed/models-signing-receipt.json
            ${{ runner.temp }}/models-signed/models-sign-receipt.json
          retention-days: 7
          if-no-files-found: error

  # OCT30-INFRA-S015: one retained, already-compiled Rango build through the Frankel primitives (scripts/rango-retained.py):
  # staged input revalidated before login, host-sign.py under the shared lock, release-pipeline verify_signed and
  # stage_artifact. No compile or app rebuild; only public files and nonsecret receipts leave, privately.
  rango-builder:
    needs: controller
    if: inputs.mode == 'rango-retained'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SIGNER_SERVICE_ACCOUNT: ${{ vars.GCP_SIGNER_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # the separately pinned release notes are read from their own commit
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rango-first-use-provenance-${{ github.run_id }}
          path: ${{ runner.temp }}/rango-provenance
      - run: |
          echo "ROSE_FIRST_USE_PROVENANCE=$RUNNER_TEMP/rango-provenance/first-use-provenance.json" >> "$GITHUB_ENV"
          echo "ROSE_RECOVERY_EVIDENCE=$RUNNER_TEMP/rango-provenance/recovery-evidence.json" >> "$GITHUB_ENV"
          echo "RANGO_RELEASE_DIR=$RUNNER_TEMP/${ROSE_RECOVER_RUN:+rango-recovery-}rango-release" >> "$GITHUB_ENV"
      - name: Retained input, signer, tool and publication bindings (before any login)
        run: python3 scripts/rango-retained.py preflight --job builder
      - name: Stage the retained input into a fresh consumer directory
        run: python3 scripts/rango-retained.py stage --consumer "$RUNNER_TEMP/rango-consumer"
      # OCT30-INFRA-S017: the admitted S016 helper proves the four Fold tools under the shared lock, before any login.
      - name: Local tool proof (before any login)
        if: inputs.rango_recover_run == ''
        run: python3 scripts/rango-retained.py prove --proof-dir "$RUNNER_TEMP/rango-proof"
      - name: Signer access for Rango OS signing only
        if: inputs.rango_recover_run == ''
        run: python3 scripts/actions-gcp-login.py login "$GCP_SIGNER_SERVICE_ACCOUNT"
      - name: Sign under the shared lock
        if: inputs.rango_recover_run == ''
        run: python3 scripts/rango-retained.py sign --consumer "$RUNNER_TEMP/rango-consumer" --release-dir "$RUNNER_TEMP/rango-release" --proof-file "$RUNNER_TEMP/rango-proof/fold-tool-proof.json"
      - name: Drop signer access
        if: always()
        run: python3 scripts/actions-gcp-login.py logout
      - name: Verify the signed candidate
        if: inputs.rango_recover_run == ''
        run: python3 scripts/rango-retained.py verify --consumer "$RUNNER_TEMP/rango-consumer" --release-dir "$RUNNER_TEMP/rango-release"
      # Packaging-only recovery: the named run's durable signed outputs, matched to the signed marker and first-use identity.
      - name: Recover the already signed and verified outputs (no login, signing or verification)
        if: inputs.rango_recover_run != ''
        run: python3 scripts/rango-retained.py recover --consumer "$RUNNER_TEMP/rango-consumer" --release-dir "$RANGO_RELEASE_DIR"
      - name: Stage only public files and receipts
        run: python3 scripts/rango-retained.py stage-artifact --consumer "$RUNNER_TEMP/rango-consumer" --release-dir "$RANGO_RELEASE_DIR" --artifact-dir "$RUNNER_TEMP/rango-artifact"
      - name: Transfer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rango-release-${{ github.run_id }}
          path: ${{ runner.temp }}/rango-artifact
          retention-days: 3
          if-no-files-found: error

  # Separate public rango-{build} release, only when rango_publish is explicitly true (default false; the command refuses
  # too): draft, download check, then public with make_latest=false; Latest unchanged. Signing-only runs stop at the
  # builder's private artifact and never mint the pixel-ota token.
  rango-publisher:
    needs: rango-builder
    if: inputs.mode == 'rango-retained' && inputs.rango_publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PIXEL_OTA_PUBLISHER: ${{ vars.PIXEL_OTA_PUBLISHER }}
      PIXEL_OTA_APP_ID: ${{ vars.PIXEL_OTA_APP_ID }}
      PIXEL_OTA_APP_KEY_PRESENT: ${{ secrets.PIXEL_OTA_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/release-pipeline.py preflight --job publisher
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rango-release-${{ github.run_id }}
          path: ${{ runner.temp }}/rango-artifact
      - name: Mint pixel-ota publisher token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PIXEL_OTA_APP_ID }}
          private-key: ${{ secrets.PIXEL_OTA_APP_PRIVATE_KEY }}
          owner: Immortal-Protocols
          repositories: pixel-ota
          permission-contents: write
      - name: Revalidate, draft, download-check and finalize public (never Latest)
        env:
          PIXEL_OTA_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 scripts/rango-retained.py publish --artifact-dir "$RUNNER_TEMP/rango-artifact"

  mustang-build:
    needs: [guard, controller]
    if: (inputs.mode == 'mustang-build' || inputs.mode == 'mustang-ota') && needs.guard.outputs.mustang_skip != 'true'
    runs-on: [self-hosted, roseos-frankel-builder]
    # Original lifecycle fallback remains 12 h. This is an 11 h job cap,
    # independent of the four-hour delivery target, not a restarted deadline.
    timeout-minutes: 660
    permissions:
      contents: read
    steps:
      - name: mustang-ota runs once (a re-run attempt never compiles)
        if: inputs.mode == 'mustang-ota'
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo "::error::mustang-ota runs once: re-run attempts are refused; dispatch mustang-ota again"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check installed-baseline updater before starting a newer compile
        if: inputs.mustang_publish_ota
        run: python3 scripts/mustang_ota.py observe --out "$RUNNER_TEMP/mustang-ota-baseline-prebuild.json"
      - name: Reclaim regenerable build data
        run: python3 scripts/builder-reclaim.py apply --current-run "$GITHUB_RUN_ID" --label "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-mustang-build"
      - name: Prepare, allocate, integrate and compile Mustang once
        run: python3 scripts/mustang-pipeline.py run --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Collect allowlisted receipts
        if: always()
        run: python3 scripts/mustang-pipeline.py report --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --out "$RUNNER_TEMP/mustang-reports-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Private receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mustang-reports-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn

      - if: always() && inputs.mustang_publish_ota
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-ota-baseline-prebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mustang-ota-baseline-prebuild.json
          retention-days: 7
          if-no-files-found: warn

  mustang-ota-bind:
    # MUSTANG-OTA (one button): the delivery's producer binding for this same run, in place of the producer run id a
    # mustang-delivery dispatch takes by hand. Only after this run's own mustang-build job succeeded:
    # scripts/mustang-ota-chain.py bind re-checks the signing read-access window (the chain's second check; at least 30
    # minutes left) and requires attempt 1 of this manual mustang-ota dispatch on main, exactly one successful
    # mustang-build job, exactly one unexpired mustang-receipts-<run>-1 artifact and the committed original bootstrap.
    # No collection-fault recovery (manual mustang-delivery only), no retry. Hosted, contents/actions read only: no
    # OIDC token, login, secret, write or dispatch.
    needs: [guard, mustang-build]
    if: inputs.mode == 'mustang-ota' && needs.mustang-build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      compile_source: ${{ steps.bind.outputs.compile_source }}
      compile_recovery: ${{ steps.bind.outputs.compile_recovery }}
      bootstrap_source: ${{ steps.bind.outputs.bootstrap_source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind this run's own successful producer (second signing-window check)
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mustang-ota-chain.py bind --out "$RUNNER_TEMP/mustang-ota-chain-binding.json"
      - name: Chain binding receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-ota-chain-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mustang-ota-chain-binding.json
          retention-days: 7
          if-no-files-found: warn

  mustang-bootstrap:
    needs: controller
    if: inputs.mode == 'mustang-bootstrap'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SIGNER_SERVICE_ACCOUNT: ${{ vars.GCP_SIGNER_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/signing-bootstrap.py preflight --profile pro-mustang-v1 --recipe-sha "$GITHUB_SHA"
      - run: python3 scripts/signing-bootstrap.py prove --profile pro-mustang-v1 --recipe-sha "$GITHUB_SHA" --proof-dir "$RUNNER_TEMP/mustang-proof"
      - run: python3 scripts/actions-gcp-login.py login "$GCP_SIGNER_SERVICE_ACCOUNT"
      - run: python3 scripts/signing-bootstrap.py run --profile pro-mustang-v1 --recipe-sha "$GITHUB_SHA" --state-dir "$HOME/rose-signing-bootstrap" --receipt-dir "$RUNNER_TEMP/mustang-bootstrap" --proof-file "$RUNNER_TEMP/mustang-proof/fold-tool-proof.json"
      - if: always()
        run: python3 scripts/actions-gcp-login.py logout
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mustang-bootstrap/signing-bootstrap-receipt.json
          retention-days: 7
          if-no-files-found: warn

  mustang-signer:
    # mustang-delivery: the producer run typed by hand (pinned by the guard). mustang-ota: this same run's producer,
    # pinned by mustang-ota-bind. !cancelled() lets a skipped mustang-ota-bind (every mode but mustang-ota) not skip
    # this job; guard and controller must still have succeeded.
    needs: [guard, controller, mustang-ota-bind]
    if: >-
      !cancelled() && needs.guard.result == 'success' && needs.controller.result == 'success' &&
      (inputs.mode == 'mustang-delivery' || (inputs.mode == 'mustang-ota' && needs.mustang-ota-bind.result == 'success'))
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 190
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SIGNER_SERVICE_ACCOUNT: ${{ vars.GCP_SIGNER_SERVICE_ACCOUNT }}
      EXPECTED_COMPILE_RUN: ${{ inputs.mode == 'mustang-ota' && github.run_id || inputs.mustang_compile_run }}
      EXPECTED_COMPILE_SOURCE: ${{ inputs.mode == 'mustang-ota' && needs.mustang-ota-bind.outputs.compile_source || needs.guard.outputs.mustang_compile_source }}
      EXPECTED_COMPILE_RECOVERY: ${{ inputs.mode == 'mustang-ota' && needs.mustang-ota-bind.outputs.compile_recovery || needs.guard.outputs.mustang_compile_recovery }}
      EXPECTED_BOOTSTRAP_SOURCE: ${{ inputs.mode == 'mustang-ota' && needs.mustang-ota-bind.outputs.bootstrap_source || needs.guard.outputs.mustang_bootstrap_source }}
    steps:
      - name: mustang-ota runs once (a re-run attempt never signs)
        if: inputs.mode == 'mustang-ota'
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo "::error::mustang-ota runs once: re-run attempts are refused; dispatch mustang-ota again"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mustang-receipts-${{ inputs.mode == 'mustang-ota' && github.run_id || inputs.mustang_compile_run }}-1
          run-id: ${{ inputs.mode == 'mustang-ota' && github.run_id || inputs.mustang_compile_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mustang-compile
      - if: inputs.mustang_publish_ota != true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mustang-bootstrap-${{ inputs.mustang_bootstrap_run }}-1
          run-id: ${{ inputs.mustang_bootstrap_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mustang-bootstrap
      - name: Use the committed original public bootstrap receipt for OTA (no expiring artifact dependency)
        if: inputs.mustang_publish_ota
        run: |
          mkdir -p "$RUNNER_TEMP/mustang-bootstrap"
          cp os/signing-bootstrap/mustang-bootstrap-receipt.json "$RUNNER_TEMP/mustang-bootstrap/signing-bootstrap-receipt.json"
      - name: Collect actual Mustang outputs before signer login
        run: python3 scripts/mustang-sign-package.py collect --compile-receipt "$RUNNER_TEMP/mustang-compile/candidate-receipt.json" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Observe actual installed-baseline package and OTA trust before login
        if: inputs.mustang_publish_ota
        run: python3 scripts/mustang_ota.py observe --out "$RUNNER_TEMP/mustang-ota-baseline.json"
      - name: Signing read-access window still open (the chain's third check, right before signer login)
        if: inputs.mode == 'mustang-ota'
        run: python3 scripts/mustang_ota.py guard
      - run: python3 scripts/actions-gcp-login.py login "$GCP_SIGNER_SERVICE_ACCOUNT"
      - run: python3 scripts/mustang-sign-package.py sign --compile-receipt "$RUNNER_TEMP/mustang-compile/candidate-receipt.json" --bootstrap-receipt "$RUNNER_TEMP/mustang-bootstrap/signing-bootstrap-receipt.json" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - if: always()
        run: python3 scripts/actions-gcp-login.py logout
      - name: Public output-collection receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-collection-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/pixelbuild/rose-actions/mustang-collect-${{ github.run_id }}-${{ github.run_attempt }}/compile-collection.json
          retention-days: 7
          if-no-files-found: warn
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-sign-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/pixelbuild/rose-actions/mustang-sign-${{ github.run_id }}-${{ github.run_attempt }}/mustang-sign-receipt.json
          retention-days: 7
          if-no-files-found: warn

      - name: Check newer Mustang OTA and stage public assets without signer credentials
        if: inputs.mustang_publish_ota
        run: python3 scripts/mustang_ota.py stage --sign-run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --baseline "$RUNNER_TEMP/mustang-ota-baseline.json" --out "/home/pixelbuild/rose-actions/mustang-ota-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - if: inputs.mustang_publish_ota
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-ota-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/pixelbuild/rose-actions/mustang-ota-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - if: always() && inputs.mustang_publish_ota
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-ota-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mustang-ota-baseline.json
          retention-days: 7
          if-no-files-found: warn

  mustang-ota-publisher:
    # Explicit results: mustang-signer needs mustang-ota-bind, which is skipped in every mode but mustang-ota, and an
    # implicit success() would carry that skip down this chain (jobs.<job_id>.needs).
    needs: mustang-signer
    if: >-
      !cancelled() && needs.mustang-signer.result == 'success' &&
      (inputs.mode == 'mustang-delivery' || inputs.mode == 'mustang-ota') && inputs.mustang_publish_ota
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mustang-ota-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mustang-ota
      - name: Verify same-run OTA stage before minting the existing publisher token
        run: python3 scripts/mustang_ota.py verify-staged --dir "$RUNNER_TEMP/mustang-ota"
      - name: Mint existing pixel-ota publisher token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PIXEL_OTA_APP_ID }}
          private-key: ${{ secrets.PIXEL_OTA_APP_PRIVATE_KEY }}
          owner: Immortal-Protocols
          repositories: pixel-ota
          permission-contents: write
      - name: Publish fresh Mustang OTA, metadata last, never Latest
        env:
          PIXEL_OTA_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 scripts/mustang_ota.py publish --dir "$RUNNER_TEMP/mustang-ota" --out "$RUNNER_TEMP/mustang-publication"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-ota-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mustang-publication/publication.json
            ${{ runner.temp }}/mustang-publication/journal.jsonl
          retention-days: 7
          if-no-files-found: warn

  mustang-packager:
    # Explicit results: mustang-signer needs mustang-ota-bind, which is skipped in every mode but mustang-ota, and an
    # implicit success() would carry that skip down this chain (jobs.<job_id>.needs).
    needs: mustang-signer
    if: >-
      !cancelled() && needs.mustang-signer.result == 'success' && inputs.mode == 'mustang-delivery' && inputs.mustang_publish_ota != true
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: package
        run: python3 scripts/mustang-sign-package.py package --sign-run "$GITHUB_RUN_ID" --sign-attempt "$GITHUB_RUN_ATTEMPT" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.artifact_dir }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-package-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/pixelbuild/rose-actions/mustang-package-${{ github.run_id }}-${{ github.run_attempt }}/mustang-package-receipt.json
          retention-days: 7
          if-no-files-found: warn

  mustang-delivered:
    # Explicit results: mustang-signer needs mustang-ota-bind, which is skipped in every mode but mustang-ota, and an
    # implicit success() would carry that skip down this chain (jobs.<job_id>.needs).
    needs: mustang-packager
    if: >-
      !cancelled() && needs.mustang-packager.result == 'success' && inputs.mode == 'mustang-delivery'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mustang-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mustang-download
      - env:
          ARTIFACT_ID: ${{ needs.mustang-packager.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mustang-delivery.py verify-download --dir "$RUNNER_TEMP/mustang-download" --artifact-id "$ARTIFACT_ID" --out "$RUNNER_TEMP/mustang-delivery.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-delivery-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mustang-delivery.json
          retention-days: 7
          if-no-files-found: error

  cleanup:
    needs: [controller, device-readiness, builder, signing-bootstrap, models-signer, rango-builder, rango-publisher, rango-factory-observe, blazer-prep, rango-factory-package, rango-factory-inspect, launcher3-compile, blazer-compile, blazer-integrate, app-builder, alpha-builder, alpha-successor, alpha-apk-diagnostic, alpha-verify-retained, alpha-export, app-reuse, request-signing, signed-builder, publisher, mustang-build, mustang-bootstrap, mustang-signer, mustang-packager, frankel-factory-observe, frankel-factory-package, mustang-ota-bind, app-inputs-export]
    if: always() && needs.controller.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_CONTROLLER_SERVICE_ACCOUNT: ${{ vars.GCP_CONTROLLER_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/release-pipeline.py preflight --job cleanup
      - run: python3 scripts/actions-gcp-login.py login "$GCP_CONTROLLER_SERVICE_ACCOUNT"
      # The existing 12h automatic STOP on the builder remains the independent fallback.
      - if: inputs.mode != 'blazer-prep' && inputs.mode != 'rango-factory-package' && inputs.mode != 'rango-factory-inspect' && inputs.mode != 'launcher3-compile' && inputs.mode != 'blazer-compile' && inputs.mode != 'blazer-integrate' && inputs.mode != 'mustang-build' && inputs.mode != 'mustang-bootstrap' && inputs.mode != 'mustang-delivery' && inputs.mode != 'mustang-ota' && inputs.mode != 'frankel-factory-observe' && inputs.mode != 'frankel-factory-package' && inputs.mode != 'app-inputs-export'
        run: python3 scripts/release-pipeline.py stop-builder
      # The owned-builder modes this condition names only: stop only a builder this run's controller started; unknown ownership
      # fails without stopping.
      - if: inputs.mode == 'blazer-prep' || inputs.mode == 'rango-factory-package' || inputs.mode == 'rango-factory-inspect' || inputs.mode == 'launcher3-compile' || inputs.mode == 'blazer-compile' || inputs.mode == 'blazer-integrate' || inputs.mode == 'mustang-build' || inputs.mode == 'mustang-bootstrap' || inputs.mode == 'mustang-delivery' || inputs.mode == 'mustang-ota' || inputs.mode == 'frankel-factory-observe' || inputs.mode == 'frankel-factory-package' || inputs.mode == 'app-inputs-export'
        env:
          STARTED: ${{ needs.controller.outputs.started }}
        run: python3 scripts/release-pipeline.py stop-builder --only-if-started "$STARTED"
      - if: always()
        run: python3 scripts/actions-gcp-login.py logout

  # RELEASE020: the back-to-back campaign's only link. After a healthy latest-beta campaign run (builder, publisher and
  # cleanup all succeeded, attempt 1, before the carried deadline, not stopped, no successor yet) it dispatches exactly
  # one successor workflow_dispatch on main with the job's short-lived GITHUB_TOKEN; the successor pins fresh main and
  # allocates fresh versions itself. Owner-approved permission (Nathan 18:09:54 UTC): actions:write on this job only.
  next-release:
    needs: [builder, publisher, cleanup]
    if: always() && inputs.mode == 'latest-beta' && inputs.campaign != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RESULT_BUILDER: ${{ needs.builder.result }}
      RESULT_PUBLISHER: ${{ needs.publisher.result }}
      RESULT_CLEANUP: ${{ needs.cleanup.result }}
      CAMPAIGN_STOP: ${{ vars.RELEASE_CAMPAIGN_STOP }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/release-chain.py next
