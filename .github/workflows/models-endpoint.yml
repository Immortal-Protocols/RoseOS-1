name: Models HTTPS edge and conformance

# Runs the Rose Models HTTPS edge tests against a real nginx binary on loopback, with a fixture
# backend and fake credentials, the persistent-service source tests (service-auth-v1 with synthetic
# attestation chains, health/recovery, model storage, renewal, rendered units), plus the offline
# envelope-conformance fixtures. No ACME, DNS, cloud, live endpoint, GPU, model or secret is used.
on:
  pull_request:
    paths:
      - 'workspace/models/serving/https/**'
      - 'workspace/models/serving/service/**'
      - 'workspace/models/serving/tests/test_service_*.py'
      - 'workspace/models/serving/muse-glimmer-30b.json'
      - 'workspace/models/serving/render_local.py'
      - 'workspace/models/contracts/service-auth-v1.md'
      - 'workspace/models/serving/conformance/**'
      - 'workspace/models/rose-chat-core/examples/conformance.rs'
      - 'workspace/models/rose-chat-core/tests/conformance.rs'
      - '.github/workflows/models-endpoint.yml'
  push:
    branches: [main]
    paths:
      - 'workspace/models/serving/https/**'
      - 'workspace/models/serving/service/**'
      - 'workspace/models/serving/tests/test_service_*.py'
      - 'workspace/models/serving/muse-glimmer-30b.json'
      - 'workspace/models/serving/render_local.py'
      - 'workspace/models/contracts/service-auth-v1.md'
      - 'workspace/models/serving/conformance/**'
      - 'workspace/models/rose-chat-core/examples/conformance.rs'
      - 'workspace/models/rose-chat-core/tests/conformance.rs'
      - '.github/workflows/models-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: models-endpoint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Real nginx binary (extracted, not installed or started)
        run: |
          mkdir -p "$RUNNER_TEMP/nginx" && cd "$RUNNER_TEMP/nginx"
          sudo apt-get update -qq
          apt-get download nginx
          dpkg-deb -x nginx_*.deb root
          echo "package: $(ls nginx_*.deb) sha256 $(sha256sum nginx_*.deb | cut -d' ' -f1)"
          echo "binary sha256 $(sha256sum root/usr/sbin/nginx | cut -d' ' -f1)"
          root/usr/sbin/nginx -v
          echo "ROSE_NGINX=$RUNNER_TEMP/nginx/root/usr/sbin/nginx" >> "$GITHUB_ENV"
      - name: Edge tests (real nginx, loopback fixture backend)
        env:
          ROSE_REQUIRE_NGINX: '1'
        run: python3 -I workspace/models/serving/https/tests/test_edge.py -v
      - name: TLS front tests (real nginx, disposable synthetic CA; not real issuance)
        env:
          ROSE_REQUIRE_NGINX: '1'
        run: |
          openssl version
          python3 -I workspace/models/serving/https/tests/test_tls.py -v
      - name: service-auth-v1 through real nginx (auth_request, post-auth limits, ACME webroot; synthetic attestation)
        env:
          ROSE_REQUIRE_NGINX: '1'
        run: |
          sudo apt-get install -y -qq python3-cryptography
          /usr/bin/python3 -c 'import cryptography; print("cryptography", cryptography.__version__)'
          /usr/bin/python3 -I workspace/models/serving/https/tests/test_service_edge.py -v

  service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Distro cryptography (the version the VM installs)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography
          /usr/bin/python3 -c 'import cryptography; print("cryptography", cryptography.__version__)'
      - name: Persistent-service source tests (synthetic; no systemd, Docker, GPU, model or network)
        run: |
          for t in test_service_auth test_service_ops test_service_tls_deploy test_service_render \
                   test_service_bootstrap test_serving_config test_local_profile; do
            /usr/bin/python3 -I workspace/models/serving/tests/$t.py -v
          done
      - name: Render the service tree and build the bootstrap payload (identity printed)
        run: |
          /usr/bin/python3 -I workspace/models/serving/service/render_service.py --out "$RUNNER_TEMP/rose-models"
          /usr/bin/python3 -I workspace/models/serving/service/build_bootstrap.py --out "$RUNNER_TEMP/bootstrap"
          bash -n "$RUNNER_TEMP/bootstrap/startup-script.sh"

  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workspace/models/rose-chat-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rust 1.97.0
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
          rustup default 1.97.0
      - name: Conformance harness tests (real local-agent-v1 agent, fixtures and loopback server)
        run: cargo test --locked --test conformance
      - name: Fixture runs (pass set must pass, mixed set must fail the bar)
        run: |
          cargo run -q --locked --example conformance -- fixture --prompts ../serving/conformance/prompts.json \
            --replies ../serving/conformance/fixtures/replies-pass.json > /dev/null
          if cargo run -q --locked --example conformance -- fixture --prompts ../serving/conformance/prompts.json \
            --replies ../serving/conformance/fixtures/replies-mixed.json > /dev/null; then
            echo "mixed fixtures unexpectedly passed the bar" >&2; exit 1
          fi
