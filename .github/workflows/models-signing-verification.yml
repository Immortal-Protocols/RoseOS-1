name: Models signing verification

# Source tests for the Rose Models (dev.pixel.models) signing adapter: closed profile, input
# binding, refusal order, signer/output inspection and receipts, with synthetic fixtures and a
# mocked signer; and the isolated build-tools r35 preparation in the models-sign preflight (MODELS-SDK-PREP-001) with
# synthetic archives and mocked transport; and the closed signing diagnostic (MODELS-SIGN-DIAG-001) with a fake SDK
# and synthetic sentinels; and the required synthetic sign/verify check (MODELS-SIGN-PRECHECK-001) against the
# runner's preinstalled build-tools, accepted only when equal to the pinned r35 members, with disposable synthetic
# keys. No real keys, secrets, SDK download, network or artifact access.
on:
  pull_request:
    paths:
      - 'workspace/models/signing/**'
      - 'workspace/models/android/tests/verify-artifact.sh'
      - 'scripts/sign-apk.py'
      - 'scripts/models-sdk-prepare.py'
      - 'scripts/host-models-sign.py'
      - 'os/models-signing/models-sign.json'
      - '.github/workflows/models-signing-verification.yml'
  push:
    branches: [main]
    paths:
      - 'workspace/models/signing/**'
      - 'workspace/models/android/tests/verify-artifact.sh'
      - 'scripts/sign-apk.py'
      - 'scripts/models-sdk-prepare.py'
      - 'scripts/host-models-sign.py'
      - 'os/models-signing/models-sign.json'
      - '.github/workflows/models-signing-verification.yml'

permissions:
  contents: read

concurrency:
  group: models-signing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Adapter tests (synthetic fixtures, mocked signer)
        working-directory: workspace/models/signing
        run: |
          python3 --version
          python3 -m unittest -v test_models_signing
      - name: Signing diagnostic, sign-apk.py opt-in hook and leak sentinels (fake SDK, no keys); real pinned apksigner scheme cases
        env:
          MODELS_REQUIRE_PINNED_TOOLS: '1'  # the real pinned-tool cases (incl. MODELS-SCHEME-FIX-001) fail, never skip
        run: python3 workspace/models/signing/test_sign_diagnostic.py -v
      - name: Synthetic sign check failure paths (fake JDK trees, mocks, no keys)
        run: python3 workspace/models/signing/test_synthetic_sign_check.py -v
      - name: Required synthetic sign/verify check (real pinned build-tools, explicit roots, zero skips)
        run: |
          set -euo pipefail
          bt=/usr/local/lib/android/sdk/build-tools/35.0.0
          # Accepted only when equal to the pinned build-tools_r35_linux.zip members; nothing is downloaded.
          printf '%s  %s\n' \
            b47549e373b895ce6ca620d0c7887e674d9615ffa837a86ac601dcfd04adb0f0 apksigner \
            00ef9948f843fe395d2440ae3ef41405b8040a6d5d46493bd1902ac0ee6deae7 lib/apksigner.jar \
            a205d94a45c8522ca1b571dcbe190df145c818f0a29dfb366e4dd78eef4f56a7 zipalign | (cd "$bt" && sha256sum -c --strict -)
          grep '^JAVA_VERSION=' "$JAVA_HOME_21_X64/release"  # hosted Temurin 21: synthetic evidence, not the pinned JDK
          sdk="$RUNNER_TEMP/models-sdk"
          mkdir -p "$sdk/build-tools"
          ln -s "$bt" "$sdk/build-tools/android-15"
          # A poisoned caller environment must not reach the tools.
          env -i PATH=/nonexistent JAVA_TOOL_OPTIONS=-XX:+NoSuchPoisonFlag HOME="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" \
            "$(command -v python3)" -I workspace/models/signing/synthetic_sign_check.py \
            --jdk-home "$JAVA_HOME_21_X64" --sdk-root "$sdk" | tee precheck.json
          python3 - <<'PY'
          import json
          r = json.load(open('precheck.json'))
          assert (r['result'], r['category'], r['executed'], r['passed'], r['failed'], r['skipped']) == ('pass', 'none', 3, 3, 0, 0), r
          assert r['correctedInvocation'] == {'signed': True, 'verified': True}, r
          print('executed:', ', '.join(c['name'] for c in r['cases'] if c['signed'] and c['verified']))
          PY
      - name: SDK preparation and models-sign preflight ordering (synthetic archives, mocked transport)
        run: python3 workspace/models/signing/test_models_sdk_prepare.py -v
      - name: Existing host-models-sign suite with the preparation hook
        run: python3 scripts/tests/test_models_apk_signing.py
      - name: Committed profile is valid and refuses while unbound
        run: |
          set +e
          python3 workspace/models/signing/models_signing.py plan > plan.json
          code=$?
          set -e
          cat plan.json
          test "$code" -eq 3
          grep -q '"blocked": \["signer_unbound", "tool_unbound"\]' plan.json
