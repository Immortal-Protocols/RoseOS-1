name: Mustang signing and packaging
run-name: Mustang ${{ inputs.mode }} ${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [bootstrap, sign-package]
        default: sign-package
      compile_run:
        description: Successful Mustang unsigned workflow run; empty for bootstrap
        default: ''
      bootstrap_run:
        description: Successful Mustang bootstrap run; empty for bootstrap
        default: ''

permissions:
  contents: read

concurrency:
  group: os-release-frankel
  cancel-in-progress: false
  queue: max

env:
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_CONTROLLER_SERVICE_ACCOUNT: ${{ vars.GCP_CONTROLLER_SERVICE_ACCOUNT }}
  GCP_SIGNER_SERVICE_ACCOUNT: ${{ vars.GCP_SIGNER_SERVICE_ACCOUNT }}

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      compile_source: ${{ steps.bind.outputs.compile_source }}
      bootstrap_source: ${{ steps.bind.outputs.bootstrap_source }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind admitted Mustang profile and actual producer runs
        id: bind
        env:
          MODE: ${{ inputs.mode }}
          COMPILE_RUN: ${{ inputs.compile_run }}
          BOOTSTRAP_RUN: ${{ inputs.bootstrap_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/mustang-delivery.py guard --mode "$MODE" --compile-run "$COMPILE_RUN" --bootstrap-run "$BOOTSTRAP_RUN" --out "$RUNNER_TEMP/mustang-binding.json"

  controller:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      started: ${{ steps.owner.outputs.started }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/release-pipeline.py preflight --job controller
      - run: python3 scripts/actions-gcp-login.py login "$GCP_CONTROLLER_SERVICE_ACCOUNT"
      - run: python3 scripts/release-pipeline.py start-builder --ownership-record "$RUNNER_TEMP/mustang-owner.json"
      - id: owner
        if: always()
        run: python3 scripts/release-pipeline.py builder-ownership --ownership-record "$RUNNER_TEMP/mustang-owner.json" >> "$GITHUB_OUTPUT"
      - if: always()
        run: python3 scripts/actions-gcp-login.py logout

  bootstrap:
    needs: controller
    if: inputs.mode == 'bootstrap'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/signing-bootstrap.py preflight --profile pro-mustang-v1 --recipe-sha "$GITHUB_SHA"
      - run: python3 scripts/signing-bootstrap.py prove --profile pro-mustang-v1 --recipe-sha "$GITHUB_SHA" --proof-dir "$RUNNER_TEMP/mustang-proof"
      - run: python3 scripts/actions-gcp-login.py login "$GCP_SIGNER_SERVICE_ACCOUNT"
      - run: python3 scripts/signing-bootstrap.py run --profile pro-mustang-v1 --recipe-sha "$GITHUB_SHA" --state-dir "$HOME/rose-signing-bootstrap" --receipt-dir "$RUNNER_TEMP/mustang-bootstrap" --proof-file "$RUNNER_TEMP/mustang-proof/fold-tool-proof.json"
      - if: always()
        run: python3 scripts/actions-gcp-login.py logout
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mustang-bootstrap/signing-bootstrap-receipt.json
          retention-days: 7
          if-no-files-found: warn

  signer:
    needs: [guard, controller]
    if: inputs.mode == 'sign-package'
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 190
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      EXPECTED_COMPILE_RUN: ${{ inputs.compile_run }}
      EXPECTED_COMPILE_SOURCE: ${{ needs.guard.outputs.compile_source }}
      EXPECTED_BOOTSTRAP_SOURCE: ${{ needs.guard.outputs.bootstrap_source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mustang-receipts-${{ inputs.compile_run }}-1
          run-id: ${{ inputs.compile_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mustang-compile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mustang-bootstrap-${{ inputs.bootstrap_run }}-1
          run-id: ${{ inputs.bootstrap_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/mustang-bootstrap
      - run: python3 scripts/actions-gcp-login.py login "$GCP_SIGNER_SERVICE_ACCOUNT"
      - run: python3 scripts/mustang-sign-package.py sign --compile-receipt "$RUNNER_TEMP/mustang-compile/candidate-receipt.json" --bootstrap-receipt "$RUNNER_TEMP/mustang-bootstrap/signing-bootstrap-receipt.json" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - if: always()
        run: python3 scripts/actions-gcp-login.py logout
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-sign-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/pixelbuild/rose-actions/mustang-sign-${{ github.run_id }}-${{ github.run_attempt }}/mustang-sign-receipt.json
          retention-days: 7
          if-no-files-found: warn

  packager:
    needs: signer
    runs-on: [self-hosted, roseos-frankel-builder]
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: package
        run: python3 scripts/mustang-sign-package.py package --sign-run "$GITHUB_RUN_ID" --sign-attempt "$GITHUB_RUN_ATTEMPT" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.artifact_dir }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-package-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/pixelbuild/rose-actions/mustang-package-${{ github.run_id }}-${{ github.run_attempt }}/mustang-package-receipt.json
          retention-days: 7
          if-no-files-found: warn

  delivered:
    needs: packager
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mustang-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mustang-download
      - env:
          ARTIFACT_ID: ${{ needs.packager.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mustang-delivery.py verify-download --dir "$RUNNER_TEMP/mustang-download" --artifact-id "$ARTIFACT_ID" --out "$RUNNER_TEMP/mustang-delivery.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mustang-delivery-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mustang-delivery.json
          retention-days: 7
          if-no-files-found: error

  cleanup:
    needs: [controller, bootstrap, signer, packager]
    if: always() && needs.controller.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      STARTED: ${{ needs.controller.outputs.started }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/release-pipeline.py preflight --job cleanup
      - run: python3 scripts/actions-gcp-login.py login "$GCP_CONTROLLER_SERVICE_ACCOUNT"
      - run: python3 scripts/release-pipeline.py stop-builder --only-if-started "$STARTED"
      - if: always()
        run: python3 scripts/actions-gcp-login.py logout
