[package]
name = "rose-auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "rose-auth-v1: authenticator one-time codes plus a knowledge factor, sessions, rate limits and recovery for Rose-generated servers."

[dependencies]
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
subtle = "2"
getrandom = "0.2"

[dev-dependencies]
