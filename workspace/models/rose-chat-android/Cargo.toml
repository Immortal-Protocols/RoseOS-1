[package]
name = "rose-chat-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Thin JNI adapter exposing Core's local-agent-v1 Agent to the Rose Models Android app."

[lib]
name = "rose_chat_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core owns the agent; Android builds drop its desktop HTTP transport and CLI.
rose-chat-core = { path = "../rose-chat-core", default-features = false }
jni-sys = "0.4"
