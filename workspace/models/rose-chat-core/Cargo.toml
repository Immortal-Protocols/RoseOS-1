[package]
name = "rose-chat-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rose Models chat core: configuration, ordered history and an injected transport boundary."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }

[[bin]]
name = "rose-chat"
path = "src/bin/rose-chat.rs"
