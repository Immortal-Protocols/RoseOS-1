[package]
name = "rose-chat-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rose Models chat core: configuration, ordered history and an injected transport boundary."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Desktop HTTP transport and the rose-chat CLI. Android builds disable it (`--no-default-features`):
# there Java owns HTTPS and platform trust, and the pure `agent` module needs only serde.
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"], optional = true }

[features]
default = ["http"]
http = ["dep:ureq"]

[[bin]]
name = "rose-chat"
path = "src/bin/rose-chat.rs"
required-features = ["http"]

[[test]]
name = "cli"
required-features = ["http"]

[[test]]
name = "http_loopback"
required-features = ["http"]

[[test]]
name = "signals"
required-features = ["http"]
