[package]
name = "rose-signin"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "rose-signin-v1: authenticator one-time codes plus a knowledge factor, sessions, rate limits and recovery for Rose-generated servers."

[dependencies]
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
subtle = "2"
getrandom = "0.2"
aes-gcm = "0.10"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[features]
# The reference SQLite store (store::sqlite). Generated servers enable it; the core library needs no database.
sqlite = ["dep:rusqlite"]

[dev-dependencies]
