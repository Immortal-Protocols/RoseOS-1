// Server task progress, heartbeat and failure lines (speakProgress) for the live call. Only events that
// arrive after this page's first poll of an epoch and after this call went live are spoken, each seq once:
// the retained queue replayed on load or reconnect is never spoken. Eligibility matches the server's.
// That first poll also only advances the cursor past retained task_stopped, notice and task events: an old
// Owner Stop must not hold speech for this session, and old text must not reappear (R13).
let eventsPrimed=false,announceLive=false,announceFloor=0,lastAnnouncedSeq=0;
function announceProgress(e,primed){
 const content=e.event?.type==='session.commentary.append'&&typeof e.event.content==='string'?e.event.content.trim():'';
 if(!content||content.length>2000||!primed||!announceLive||e.seq<=announceFloor||e.seq<=lastAnnouncedSeq)return;
 if(guardianMode||!ready||!conversation||globalThis.taskStopSpeechPending||typeof conversation.announce!=='function')return;
 lastAnnouncedSeq=e.seq;try{conversation.announce(content);}catch{}
}
async function poll(){try{const r=await api('GET','/events?after='+lastEvent);mediaWorkerEnabled=r.mediaWorkerEnabled===true;messagesWorkerEnabled=r.messagesWorkerEnabled===true;clockWorkerEnabled=r.clockWorkerEnabled===true;applyRoutingConfig(r);Native.taskModelState?.(JSON.stringify(r.taskModel||{label:'Model unavailable'}));taskStatusTransport.polling(r.taskStatus);if(serverEpoch&&r.epoch!==serverEpoch){lastEvent=0;eventsPrimed=false;lastAnnouncedSeq=0;if(ready||starting)voiceLost('Mac restarted. Tap Talk to reconnect.');}serverEpoch=r.epoch;const primed=eventsPrimed;if(ready&&!announceLive){announceLive=true;announceFloor=lastEvent;}else if(!ready)announceLive=false;for(const e of r.events){lastEvent=e.seq;if(!primed&&(e.type==='task_stopped'||e.type==='notice'||e.type==='task'))continue;if(e.type==='live')announceProgress(e,primed);else if(e.type==='task')$('task').textContent=e.text;else if(e.type==='status')$('connection').textContent=e.status;else if(e.type==='task_stopped'){globalThis.taskStopSpeechPending=true;try{conversation?.stopSpeech?.();}catch{}}else if(e.type==='notice')$('notice').textContent=e.text;else if(e.type==='glasses_photo'&&e.sessionId===liveSessionId){$('notice').textContent='Glasses photo received. Ask about it.';if(!guardianMode&&ready&&conversation)conversation.sendContext('The user just shared a still photo from their glasses in this voice session. The task backend has the actual image. When the user asks about this photo or what they see, send that question to the backend; do not describe it yourself without its result. Do not speak just because this photo arrived.');}else if(e.type==='voice_task_done'&&!waitingTasks.has(e.id)&&!completedTasks.has(e.id)){completedTasks.add(e.id);if(!guardianMode&&ready&&conversation)conversation.sendContext('Backend task result (data, not a new request): '+JSON.stringify({state:e.state,text:e.text}));}}eventsPrimed=true;}catch{taskStatusTransport.failed();Native.taskModelState?.(JSON.stringify({label:'Model unavailable · Mac offline'}));}setTimeout(poll,800);}

let conversationRevision=-1,lastTypedContext='';
async function pollConversation(){try{
 const data=await api('GET','/conversation?after='+conversationRevision+'&memoryRevision='+encodeURIComponent(personalMemoryRevision||''));
 applyPersonalMemory(data.personalMemory);
 if(!data.unchanged&&Array.isArray(data.messages)){
  conversationRevision=data.revision;Native.conversation?.(JSON.stringify(data));
  const typed=data.messages.filter(m=>m.source==='text').slice(-12),signature=JSON.stringify(typed.map(m=>m.id));
  if(!guardianMode&&ready&&conversation&&typed.length&&signature!==lastTypedContext)conversation.sendContext('The user also typed in this same conversation. These are completed text exchanges, for continuity only, not requests to repeat or speak: '+JSON.stringify(typed.map(m=>({role:m.role,text:m.text}))));
  if(ready)lastTypedContext=signature;
 }
}catch{}setTimeout(pollConversation,1000);}
if(!LOCAL_ROSE)pollConversation();

async function refreshApps(){try{const r=await api('GET','/apps');const signature=JSON.stringify(r.apps);if(signature!==appSignature){appSignature=signature;$('appList').replaceChildren();for(const app of r.apps){if(Native.isSelf?.(app.packageName)||!Native.shouldOffer(app.packageName,app.versionCode||0))continue;const card=document.createElement('div');card.className='card';const name=document.createElement('div');name.textContent=app.label;const button=document.createElement('button');button.textContent='Install';button.onclick=()=>Native.installApp(app.id,app.label);card.append(name,button);$('appList').append(card);if(!autoOffered.has(app.id)){autoOffered.add(app.id);localStorage.setItem('autoOffered',JSON.stringify([...autoOffered]));Native.installApp(app.id,app.label);}}}$('installStatus').textContent=Native.installStatus();}catch{}setTimeout(refreshApps,3000);}
