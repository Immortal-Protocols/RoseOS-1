<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#b9dff3;color:#29385d;font-family:system-ui,sans-serif}body{display:flex;flex-direction:column;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:27px;font-weight:900;margin:0}button{border:0;background:#ffd66b;border-radius:50%;width:52px;height:52px;color:#29385d;box-shadow:0 5px #b9872f;font-size:29px;font-weight:900}#status{font-size:15px;font-weight:700;margin:16px 0}#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#0b1629;border-radius:24px;display:flex;align-items:center;justify-content:center;touch-action:none}video{visibility:hidden;width:100%;height:100%;object-fit:contain;transform-origin:center;flex-shrink:0}footer{font-size:13px;font-weight:700;text-align:center;padding:14px 0 2px}#error{font-size:12px;overflow-wrap:anywhere;max-height:75px;overflow:hidden}.compact{padding:0;background:transparent}.compact header,.compact #status,.compact footer,.compact #error{display:none}.compact #stage{width:100%;height:100%;border-radius:0;margin:0;cursor:pointer}@media(prefers-color-scheme:dark){html,body{background:#141e33;color:#eaf2ff}} .toolbar{display:flex;gap:10px;margin:10px 0}.toolbar button,.keybar button{width:auto;min-width:43px;height:40px;border-radius:14px;font-size:15px;padding:0 13px;background:#c7e7ff;box-shadow:0 3px #789ab5}.toolbar button.selected,.keybar button.selected{background:#ffd66b;box-shadow:0 3px #b9872f}.toolbar button:disabled{opacity:.4}.keybar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.keybar[hidden]{display:none}#remoteKeyboard{font:18px system-ui;border:2px solid #789ab5;border-radius:14px;background:#fff7e5;color:#29385d;min-height:42px;padding:8px;width:100%;margin-top:10px}.compact .toolbar,.compact #remoteKeyboard,.compact #keys,.compact #hint{display:none}#hint{font-size:12px;text-align:center;margin:8px 0 0}
#remoteCursor{position:absolute;width:26px;height:34px;pointer-events:none;z-index:2;filter:drop-shadow(0 1px 2px #000);transition:left 70ms linear,top 70ms linear}#remoteCursor[hidden]{display:none}</style></head><body><header><h1>Mac screen</h1><button aria-label="Close Mac screen" onclick="Native.close()">×</button></header><div id="status">Connecting</div><div class="toolbar"><button id="control" aria-pressed="false">Control</button><button id="keyboardButton" disabled>Keyboard</button></div><div id="stage"><video aria-hidden="true" autoplay muted playsinline></video><svg id="remoteCursor" hidden viewBox="0 0 26 34" aria-hidden="true"><path d="M2 2 L2 26 L9 20 L15 32 L21 29 L15 17 L24 16 Z" fill="#ffd66b" stroke="#14203a" stroke-width="2.5" stroke-linejoin="round"/></svg></div><div id="hint">Pinch to zoom</div><textarea hidden id="remoteKeyboard" rows="1" aria-label="Type on Mac" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea><div hidden id="keys" class="keybar"><button data-mod="Command">Cmd</button><button data-mod="Shift">Shift</button><button data-key="Escape">Esc</button><button data-key="Tab">Tab</button><button data-key="ArrowLeft" aria-label="Left arrow">←</button><button data-key="ArrowUp" aria-label="Up arrow">↑</button><button data-key="ArrowDown" aria-label="Down arrow">↓</button><button data-key="ArrowRight" aria-label="Right arrow">→</button><button data-key="Backspace" aria-label="Backspace">⌫</button><button data-key="Enter" aria-label="Return">↵</button></div><footer aria-hidden="true" id="metrics">Pinch to zoom</footer><div id="error"></div><script src="mac-screen.js"></script></body></html>
