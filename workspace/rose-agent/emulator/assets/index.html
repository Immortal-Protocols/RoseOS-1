<!doctype html><html><head><title>Rose Agent</title><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#151515;font-family:system-ui,-apple-system,sans-serif;padding:55px 23px 25px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:30px;letter-spacing:-1.3px;margin:8px 0}button,input{font:inherit}button{border:0;border-radius:20px;background:#e8e8e4;color:#111;padding:15px 22px;font-weight:650}button:disabled{opacity:.4}.eyebrow{font-size:11px;letter-spacing:2px;color:#73736d;text-transform:uppercase}#status{font-size:16px;color:#666;min-height:44px;margin:10px 0}#orb{width:146px;height:146px;border-radius:50%;background:#161616;margin:34px auto;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 15px 45px #0001}#orb i{width:7px;border-radius:10px;background:#fff;height:24px}#orb i:nth-child(2){height:55px}#orb i:nth-child(3){height:78px}#orb i:nth-child(4){height:45px}.live i{animation:pulse 1s ease-in-out infinite alternate}.live i:nth-child(2n){animation-delay:.3s}@keyframes pulse{to{transform:scaleY(.55)}}.controls{display:flex;justify-content:center;gap:10px}#talk{background:#151515;color:white;min-width:130px}#tasks{margin-top:32px;border-top:1px solid #ddd;padding-top:20px}.card{margin-top:10px;border-radius:18px;background:white;padding:15px;white-space:pre-wrap;font-size:14px;line-height:1.5}.speaker{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#777;margin-bottom:4px}#transcript{max-height:210px;overflow:auto}#notice{font-size:12px;color:#777;margin-top:16px}details{margin-top:25px;font-size:13px}input{border:1px solid #ddd;background:#fff;border-radius:12px;padding:13px;width:100%;margin-top:10px}#send{padding:10px 18px;margin-top:8px}.small{font-size:12px;color:#888}#connection{font-size:11px;border-radius:30px;padding:8px 12px;background:#e5e5df}
</style></head><body><header><div><div class="eyebrow">Your voice. Your tools.</div><h1>Rose Agent</h1></div><span id="connection">Connecting</span></header><div id="status">Connecting to your Mac…</div><div id="micLevel" class="small" aria-live="polite"></div><div id="orb"><i></i><i></i><i></i><i></i><i></i></div><div class="controls"><button id="talk" disabled>Talk</button><button id="mute" disabled>Mute</button><button id="end" disabled>End</button></div><div id="tasks"><div class="eyebrow">Codex on your Mac</div><div id="task" class="card">Your requests and task progress will appear here.</div></div><section id="apps"><div class="eyebrow" style="margin-top:24px">Apps ready to install</div><div id="appList"></div><div id="installStatus" class="small" style="margin-top:12px"></div></section><div id="transcript"></div><div id="notice"></div><details><summary>Connection & typed request</summary><label class="small">Mac service address</label><input id="address"><button id="save">Reconnect</button><input id="prompt" placeholder="Ask Codex to do something"><button id="send">Send to Codex</button><p class="small">This prototype keeps the screen awake during use. The API key stays on your Mac.</p></details><script>
const $=id=>document.getElementById(id);let requestSeq=0,pending=new Map(),lastEvent=0,serverEpoch=null,peer,channel,mic,ready=false,starting=false,muted=false,ended=true,closeTimer,disconnectTimer,startTimer,meterTimer,meterContext,apiChain=Promise.resolve();const audio=new Audio();audio.autoplay=true;
window.nativeResponse=(id,status,raw)=>{const p=pending.get(id);if(!p)return;pending.delete(id);clearTimeout(p.timer);let data;try{data=JSON.parse(raw)}catch{data={error:raw}};status>=200&&status<300?p.resolve(data):p.reject(new Error(data.error||'Connection failed'));};
function api(method,route,data={}){return new Promise((resolve,reject)=>{const id=String(++requestSeq);const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Mac request timed out'));},40000);pending.set(id,{resolve,reject,timer});Native.request(id,method,route,JSON.stringify(data));});}
function relay(e){apiChain=apiChain.then(()=>api('POST','/event',e)).catch(e=>{$('notice').textContent=e.message;});}
function say(role,text){let last=$('transcript').lastElementChild;if(!last||last.dataset.role!==role){last=document.createElement('div');last.className='card';last.dataset.role=role;const name=document.createElement('div');name.className='speaker';name.textContent=role;last.append(name,document.createElement('span'));$('transcript').append(last);}last.lastElementChild.textContent+=text;$('transcript').scrollTop=$('transcript').scrollHeight;}
function transmit(e){if(channel?.readyState==='open'&&ready)channel.send(JSON.stringify(e));}
let generation=0,explicitlyStopped=false;let parked=true,activating=false,wantActivate=false,warmTimer;let timingStart=0,timingStages=new Set(),audioTimingTimer;function mark(stage){if(timingStages.has(stage))return;timingStages.add(stage);Native.timing(stage,performance.now()-timingStart);}
function endConversation(){explicitlyStopped=true;cleanup();$('status').textContent='Ready when you are';diagnostic();}
function cleanup(){Native.trayAudio(0,0);Native.assistantSpeaking(false);const cleanupGeneration=++generation;audio.muted=true;parked=true;activating=false;wantActivate=false;clearTimeout(warmTimer);clearInterval(audioTimingTimer);clearTimeout(startTimer);clearInterval(meterTimer);if(meterContext){meterContext.close().catch(()=>{});meterContext=null;}clearTimeout(closeTimer);clearTimeout(disconnectTimer);muted=false;ready=false;starting=false;ended=true;channel?.close();channel=null;peer?.close();peer=null;mic?.getTracks().forEach(t=>t.stop());mic=null;audio.srcObject=null;Native.audio(false);$('talk').disabled=false;$('end').disabled=true;$('mute').disabled=true;$('mute').textContent='Mute';$('orb').classList.remove('live');api('POST','/voice-ended').catch(()=>{});}
async function start(warm=false){if(starting||ready)return;const myGeneration=++generation;parked=warm;audio.muted=warm;timingStart=performance.now();timingStages.clear();mark("start");starting=true;ended=false;muted=false;startTimer=setTimeout(()=>voiceLost('Voice did not connect. Tap Talk to retry.'),25000);$('mute').textContent='Mute';$('talk').disabled=true;$('end').disabled=false;$('status').textContent=warm?'Ready when you are':'Opening microphone…';$('notice').textContent='';try{if(!warm){Native.audio(true);const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});if(generation!==myGeneration){stream.getTracks().forEach(t=>t.stop());return;}mic=stream;mark("microphone_ready");}peer=new RTCPeerConnection();const thisPeer=peer;peer.onconnectionstatechange=()=>{if(peer!==thisPeer||ended)return;clearTimeout(disconnectTimer);if(thisPeer.connectionState==='failed'){voiceLost('Voice connection lost. Tap Talk to reconnect.');}else if(thisPeer.connectionState==='disconnected'){ $('status').textContent='Voice reconnecting…';disconnectTimer=setTimeout(()=>{if(peer===thisPeer&&thisPeer.connectionState==='disconnected')voiceLost('Voice connection lost. Tap Talk to reconnect.');},8000);}else if(thisPeer.connectionState==='connected'&&ready){$('status').textContent=parked?'Ready when you are':muted?'Microphone muted':'Listening · speak naturally';}};mic?.getAudioTracks().forEach(t=>{t.enabled=true;t.onended=()=>{if(!ended)voiceLost('Microphone stopped. Tap Talk to reconnect.');};});peer.ontrack=e=>{mark("remote_track");audio.srcObject=new MediaStream([e.track]);audio.play().catch(e=>$('notice').textContent=e.message);};if(mic){for(const t of mic.getTracks())peer.addTrack(t,mic);}else peer.addTransceiver('audio',{direction:'sendrecv'});channel=peer.createDataChannel('oai-events');channel.onmessage=({data})=>{if(peer!==thisPeer||ended)return;const e=JSON.parse(data);if(e.type==='session.started'){mark('session_started');clearTimeout(startTimer);ready=true;starting=false;if(parked){$('status').textContent='Ready when you are';$('talk').disabled=false;diagnostic();if(wantActivate)activate();return;}startMeter();$('status').textContent='Listening · speak naturally';$('orb').classList.add('live');$('mute').disabled=false;}else if(e.type==='session.input_transcript.delta'){say('You',e.delta||'');relay(e);}else if(e.type==='session.output_transcript.delta'){mark('first_output_transcript');say('Pixel',e.delta||'');relay(e);}else if(e.type==='session.delegation.created'){relay(e);$('task').textContent='Codex is working…';}else if(e.type==='session.closed'){relay(e);$('status').textContent='Conversation ended';cleanup();}else if(e.type==='error'){if(e.error?.code!=='missing_scope')$('notice').textContent=e.error?.message||'Voice error';relay(e);}console.log('LIVE_EVENT '+e.type);};channel.onclose=()=>{if(peer===thisPeer&&!ended){$('status').textContent='Voice disconnected';cleanup();}};mark("offer_start");const offer=await peer.createOffer();await peer.setLocalDescription(offer);if(peer.iceGatheringState!=='complete')await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(new Error('Network setup timed out')),10000);peer.addEventListener('icegatheringstatechange',()=>{if(peer.iceGatheringState==='complete'){clearTimeout(timeout);resolve();}});});if(generation!==myGeneration)return;mark('ice_complete');if(!warm)$('status').textContent='Connecting voice…';let result;mark('session_request');try{result=await api('POST','/session',{sdp:peer.localDescription.sdp});}catch(error){if(error.message!=='End the active voice session first')throw error;await api('POST','/voice-ended');result=await api('POST','/session',{sdp:peer.localDescription.sdp});}mark("session_response");if(generation!==myGeneration||ended||peer!==thisPeer)return;await peer.setRemoteDescription({type:'answer',sdp:result.transport.sdp});mark('answer_applied');const timedPeer=peer;audioTimingTimer=setInterval(async()=>{if(peer!==timedPeer){clearInterval(audioTimingTimer);return;}try{const stats=await timedPeer.getStats();stats.forEach(s=>{if(s.type==='inbound-rtp'&&s.kind==='audio'&&s.totalAudioEnergy>0){mark('first_received_audio_energy');clearInterval(audioTimingTimer);}});}catch{}},100);}catch(e){if(generation===myGeneration){$('status').textContent=e.message;cleanup();}}}
function diagnostic(){const tracks=mic?.getAudioTracks()||[];relay({type:'client.diagnostic',status:$('status').textContent,ready:ready&&!parked,starting,muted,prepared:ready&&parked,visibility:document.visibilityState,audioRoute:Native.audioRoute(),connection:peer?.connectionState||'none',channel:channel?.readyState||'none',tracks:tracks.map(t=>({enabled:t.enabled,muted:t.muted,state:t.readyState}))});}
function startMeter(){Native.readyChime();try{meterContext=new AudioContext();meterContext.resume();const analyser=meterContext.createAnalyser();analyser.fftSize=256;meterContext.createMediaStreamSource(mic).connect(analyser);const output=meterContext.createAnalyser();output.fftSize=256;if(audio.srcObject)meterContext.createMediaStreamSource(audio.srcObject).connect(output);const data=new Uint8Array(256),out=new Uint8Array(256);function rms(node,buffer){node.getByteTimeDomainData(buffer);let sum=0;for(const x of buffer)sum+=(x-128)*(x-128);return Math.min(1,Math.sqrt(sum/buffer.length)/18);}let ticks=0;meterTimer=setInterval(()=>{if(!ready)return;let input=muted?0:rms(analyser,data),reply=rms(output,out);Native.trayAudio(input,reply);Native.assistantSpeaking(reply>.01);$('micLevel').textContent='Microphone level: '+Math.round(input*100)+'%';if(++ticks%25===0)diagnostic();},80);}catch(e){$('notice').textContent='Microphone meter unavailable';}diagnostic();}
function voiceLost(message){cleanup();$('status').textContent=message;}
function toggleMute(){const tracks=mic?.getAudioTracks()||[];if(!ready||channel?.readyState!=='open'||!tracks.length||tracks.some(t=>t.readyState!=='live')||['failed','disconnected','closed'].includes(peer?.connectionState)){voiceLost('Voice unavailable. Tap Talk to reconnect.');return;}muted=!muted;tracks.forEach(t=>t.enabled=!muted);$('mute').textContent=muted?'Unmute':'Mute';$('status').textContent=parked?'Ready when you are':muted?'Microphone muted':'Listening · speak naturally';}
async function activate(){if(activating||explicitlyStopped)return;activating=true;wantActivate=false;timingStart=performance.now();timingStages.clear();mark('warm_tap');const current=peer;try{Native.audio(true);const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});if(peer!==current||ended){stream.getTracks().forEach(t=>t.stop());return;}mic=stream;mark('microphone_ready');await peer.getTransceivers().find(t=>t.receiver.track.kind==='audio').sender.replaceTrack(mic.getAudioTracks()[0]);if(peer!==current||ended)return;parked=false;audio.muted=false;muted=false;mark('warm_listening');$('status').textContent='Listening · speak naturally';$('talk').disabled=true;$('mute').disabled=false;$('end').disabled=false;$('orb').classList.add('live');startMeter();}catch(e){voiceLost(e.message);}finally{activating=false;}}
window.startFromGlasses=()=>{explicitlyStopped=false;if(ready&&parked){activate();return;}if(ready){if(muted)toggleMute();return;}if(starting){wantActivate=true;return;}start(false);};
window.setTrayMuted=(value)=>{if(!ready||parked||muted===value)return;toggleMute();diagnostic();};
window.glassesTap=()=>{if(ready&&!parked){toggleMute();diagnostic();}else window.startFromGlasses();};
$('talk').onclick=window.startFromGlasses;$('mute').onclick=toggleMute;$('end').onclick=endConversation;
$('address').value=Native.endpoint();$('save').onclick=()=>{Native.setEndpoint($('address').value);$('status').textContent='Reconnecting…';check();};$('send').onclick=async()=>{const text=$('prompt').value.trim();if(!text)return;try{await api('POST','/task',{text});$('prompt').value='';$('task').textContent='Codex is working…';}catch(e){$('task').textContent=e.message;}};
async function check(){try{const h=await api('GET','/health');$('connection').textContent=h.ready?'Mac connected':'Mac starting';if(!ready&&!starting){$('status').textContent=h.ready?'Ready when you are':'Starting Codex…';$('talk').disabled=!h.ready;}}catch(e){$('connection').textContent='Mac offline';$('status').textContent='Cannot reach Mac. Check connection settings.';$('talk').disabled=true;}}
async function poll(){try{const r=await api('GET','/events?after='+lastEvent);if(serverEpoch&&r.epoch!==serverEpoch){lastEvent=0;if(ready||starting)voiceLost('Mac restarted. Tap Talk to reconnect.');}serverEpoch=r.epoch;if(r.ready&&!ready&&!starting){$('talk').disabled=false;$('connection').textContent=r.busy?'Codex working':'Mac connected';if($('status').textContent.includes('Cannot reach')||$('status').textContent.includes('Connecting to'))$('status').textContent='Ready when you are';}for(const e of r.events){lastEvent=e.seq;if(e.type==='live')transmit(e.event);else if(e.type==='task')$('task').textContent=e.text;else if(e.type==='status')$('connection').textContent=e.status;else if(e.type==='notice')$('notice').textContent=e.text;}}catch{}setTimeout(poll,800);}
async function pollPhoneCommands(){
 try{const r=await api('GET','/phone/commands');
  for(const c of r.commands){const result=JSON.parse(Native.phoneCommand(JSON.stringify(c)));await api('POST','/phone/commands/'+c.id,result);}
 }catch{}setTimeout(pollPhoneCommands,800);
}
pollPhoneCommands();
let appSignature='';const autoOffered=new Set(JSON.parse(localStorage.getItem('autoOffered')||'[]'));

async function refreshApps(){try{const r=await api('GET','/apps');const signature=JSON.stringify(r.apps);if(signature!==appSignature){appSignature=signature;$('appList').replaceChildren();for(const app of r.apps){if(!Native.shouldOffer(app.packageName,app.versionCode||0))continue;const card=document.createElement('div');card.className='card';const name=document.createElement('div');name.textContent=app.label;const button=document.createElement('button');button.textContent='Install';button.style.marginTop='10px';button.onclick=()=>Native.installApp(app.id,app.label);card.append(name,button);$('appList').append(card);if(!autoOffered.has(app.id)){autoOffered.add(app.id);localStorage.setItem('autoOffered',JSON.stringify([...autoOffered]));Native.installApp(app.id,app.label);}}}$('installStatus').textContent=Native.installStatus();}catch{}setTimeout(refreshApps,3000);}
setInterval(()=>{Native.state(JSON.stringify({status:$('status').textContent,task:$('task').textContent,ready:ready&&!parked,muted,connected:peer?.connectionState==='connected'&&channel?.readyState==='open',level:parseInt(($('micLevel').textContent.match(/level: (\d+)/)||[])[1]||0)}));},250);setInterval(diagnostic,10000);check();poll();refreshApps();
</script></body></html>
